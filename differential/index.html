<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Differential Visualizer</title>
<meta name="description" content="Drive a truck with an open, limited-slip or locking differential, traction control and AWD or part-time 4WD: in turns, on ice and with a wheel in the air. Look inside in 2D or 3D, read gear contact patterns, practice ring and pinion setup, and diagnose differential noises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. Colors: ring/carrier amber, pinion orange,
   side gears/axles blue, spider gears green, clutch packs violet. 2D views; the 3D "look inside" loads only when opened. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --ring:#FFB224; --pin:#FF7A3D; --side:#4FA3E3; --spider:#3DDC97; --clutch:#C77DFF;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.35;cursor:not-allowed}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.used{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,390px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vbox{flex:1;min-height:0;padding:0 8px 8px;position:relative}
.vbox svg{width:100%;height:100%;display:block}
.vbox canvas{width:100%;height:100%;display:block;border-radius:10px}
#pMain{grid-row:1/3}
.svgt{font:600 10.5px var(--f-label);fill:#E6EDF3;letter-spacing:.04em}
.svgs{font:600 8.5px var(--f-label);fill:#8A98A8;letter-spacing:.08em;text-transform:uppercase}
.svgv{font:500 10px var(--f-mono);fill:#C5CFD9}
.chip{padding:3px 8px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}.chip.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}.chip.warn{border-color:rgba(255,178,36,.55);color:#FFE2A8}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{font:600 9.5px/1.15 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 3px;border-bottom:1px solid var(--line);text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{padding:4px 3px;border-bottom:1px solid #151d26;text-align:right;font:500 11.5px/1.2 var(--f-mono);color:var(--soft);white-space:nowrap}
table.dt td:first-child{font:600 12px/1.2 var(--f-label);color:var(--fg)}
td.bad{color:#FFC2BC!important}td.warn{color:#FFE2A8!important}td.ok{color:#BFEBD6!important}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:20px}
/* notebook */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.sl{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:8px;align-items:center;margin:3px 0}
.sl label{font-size:12.5px;color:var(--dim)}
.sl output{font:500 12px/1 var(--f-mono);text-align:right;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rowb .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);min-width:74px}
.tog{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.tog[aria-pressed="true"]{color:var(--fg);border-color:#3a4a5c;background:#17222d}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.msg.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:6px 0}
.tests .btn{white-space:normal;text-align:center;line-height:1.2;padding:8px 8px}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f > b{display:block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.find .f .bad{color:#FFC2BC}.find .f .ok{color:#BFEBD6}.find .f .warn{color:#FFE2A8}
.steps{display:grid;gap:4px;margin:4px 0 8px}
.steps div{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
.steps div i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 var(--f-label);background:var(--line-2);color:var(--fg);font-style:normal}
.steps div.done{color:#C9F7E2}.steps div.done i{background:var(--ok);color:#06140d}
.steps div.cur{color:var(--fg)}.steps div.cur i{background:var(--accent)}
.readout{font:600 22px/1.1 var(--f-mono);color:var(--fg);padding:8px 10px;border-radius:10px;background:#0a0f14;border:1px solid var(--line-2);display:inline-block;min-width:140px;text-align:center}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pMain{grid-row:auto;grid-column:1/-1;height:420px}
  #pDiff,#pData{height:330px}
  .main>.panel{height:680px}
}
@media (max-width: 640px){ .views{grid-template-columns:minmax(0,1fr)} #pMain{height:330px} .brand p{display:none} }
/* back to the tools hub (site root) */
.hublink{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);color:var(--soft);font:600 12px/1 var(--f-label);letter-spacing:.05em;text-decoration:none;white-space:nowrap;pointer-events:auto}
.hublink:hover{color:var(--fg);border-color:#3a4a5c}
.hublink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hublink{padding:0 8px}.hublink span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <a class="hublink" href="../" title="All STECH student tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>All tools</span></a>
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h6M16 12h6"/><rect x="8" y="7" width="8" height="10" rx="2"/><path d="M12 17v5M10 9.5h4M10 14.5h4"/></svg></div>
      <div><h1>Differential Visualizer</h1><p>Open · LSD · locker · AWD · setup</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="pattern">Pattern</button><button data-m="setup">Setup</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pMain" aria-label="Main view"><div class="phead"><h2 id="mTitle">Top view</h2><span id="mSub"></span><div class="r" id="mChips"></div></div><div class="vbox"><svg id="svMain" viewBox="0 0 640 400" role="img" aria-label="Top view of the truck showing each wheel's speed, torque and grip"></svg></div></section>
      <section class="panel" id="pDiff" aria-label="Inside the differential"><div class="phead"><h2>Inside the diff</h2><span id="dSub"></span><div class="r"><span class="seg mini" id="vSeg"><button data-v="2d" aria-pressed="true">2D cutaway</button><button data-v="3d">3D look inside</button></span></div></div><div class="vbox" id="dBox"><svg id="svDiff" viewBox="0 0 300 250" role="img" aria-label="Cutaway of the rear differential: pinion, ring gear, carrier, side gears, spider gears and clutch packs"></svg><canvas id="cv3d" hidden></canvas><div class="loading3d" id="ld3d" hidden>Loading the 3D model…</div></div></section>
      <section class="panel" id="pData" aria-label="Wheel data"><div class="phead"><h2 id="dtTitle">Wheel data</h2></div><div class="ro" id="data"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2, MPS = 0.44704;
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const f0 = v => Math.round(v).toLocaleString('en-US');
const WN = ['LF', 'RF', 'LR', 'RR'], WNL = ['Left front', 'Right front', 'Left rear', 'Right rear'];

/* ================= teaching truck (generic pickup; typical values) ================= */
const MASS = 2000, G = 9.81, RW = 0.36, TW = 1.65, WB = 3.2, HCG = 0.75, IW = 1.5, JC = 25, FD = 3.73, GEAR1 = 3.0, TE = 380, REV = 5800, SIDE_T = 16, SPIDER_T = 10;
const SITU = {
  dry:   { n: 'Straight, dry pavement', d: 'All four tires have good grip.', mu: [0.9, 0.9, 0.9, 0.9], lift: [0, 0, 0, 0], R: Infinity },
  turn:  { n: 'Turning (dry)', d: 'A 15 m (50 ft) curve at a steady 15 mph.', mu: [0.9, 0.9, 0.9, 0.9], lift: [0, 0, 0, 0], R: 15, cruise: 15 },
  tight: { n: 'Tight parking-lot turn', d: 'Full lock, 6 m (20 ft) circle at 5 mph.', mu: [0.9, 0.9, 0.9, 0.9], lift: [0, 0, 0, 0], R: 6, cruise: 5 },
  ice:   { n: 'Left rear on ice', d: 'Stopped with the left rear tire on a patch of wet glare ice.', mu: [0.9, 0.9, 0.04, 0.9], lift: [0, 0, 0, 0], R: Infinity },
  air:   { n: 'Right rear in the air', d: 'Off-road: the right rear tire is lifted off the ground.', mu: [0.9, 0.9, 0.9, 0.9], lift: [0, 0, 0, 1], R: Infinity },
  cross: { n: 'Cross-axle (LF + RR in the air)', d: 'Diagonal wheels lifted: the classic AWD test.', mu: [0.9, 0.9, 0.9, 0.9], lift: [1, 0, 0, 1], R: Infinity },
  snow:  { n: 'Packed snow', d: 'Low grip on all four tires.', mu: [0.25, 0.25, 0.25, 0.25], lift: [0, 0, 0, 0], R: Infinity },

/* ================= physics =================

  const N = [Nf, Nf, Nr, Nr];
  for (const [a, b] of [[0, 1], [2, 3]]) { if (C.lift[a]) { N[b] += N[a]; N[a] = 0; } if (C.lift[b]) { N[a] += N[b]; N[b] = 0; } }
  // throttle (cruise holds speed)
  let thr = C.throttle;
  if (C.cruise != null) thr = clamp(0.12 + (C.cruise * MPS - X.v) * 0.5, 0, 1);
  const c = C.layout === 'AWD' ? [0.25, 0.25, 0.25, 0.25] : [0, 0, 0.5, 0.5];
  const win = c.reduce((s, ci, i) => s + ci * X.w[i], 0), erpm = win * FD * GEAR1 * 60 / TAU;
  const driven = C.layout === 'AWD' ? [0, 1, 2, 3] : [2, 3];
  const s = X.w.map((w, i) => (w * RW - vi[i]) / Math.max(Math.abs(vi[i]), 3));   // floor of 3 m/s keeps the tire model stable at a standstill
  let Te = erpm > REV ? 0 : thr * TE;

  const Tin = Te * GEAR1 * FD * 0.92;

  for (let i = 0; i < 4; i++) {

  { body: '', ctl: ['throttle'], goal: { mc: { q: 'How did the LSD get the truck moving?', opts: ['The clutch packs resist the wheels turning at different speeds and send extra torque (bias) to the slower wheel with grip', 'It locks solid like a spool', 'It sends all torque to the icy wheel'], a: 0, why: 'The bias grows with input torque (ramps) on top of a spring preload. Look at the clutch bias number in the cutaway.' } } },
  { body: '', goal: { mc: { q: 'Clutch LSDs chatter in tight turns after an oil change. Most likely cause?', opts: ['The wrong fluid: clutch LSDs need friction modifier (or LS-rated gear oil)', 'Low tire pressure', 'Bad U-joint'], a: 0, why: 'Without it the clutches stick and slip instead of sliding smoothly. Try the Diagnose mode for this one.' } } },
] },
{ id: 'locker', title: 'Lockers', sub: 'All the torque, but not in turns', steps: [
  { body: 'Ice again, with a selectable <b>locker</b> that’s still unlocked. <b>Lock it</b> and give it throttle.', setup: { situ: 'ice', cfg: { rear: 'locker', lockOn: false, throttle: 0.5 } }, ctl: ['rear', 'throttle'], goal: { check: () => C.rear === 'locker' && C.lockOn && mph() > 3, hint: 'Locker ON, truck over 3 mph.' } },
  { body: '', goal: { mc: { q: 'Why does the locker beat the LSD here?', opts: ['Both wheels must turn together, so the dry wheel can take as much torque as its tire can hold', 'It makes more horsepower', 'It brakes the icy wheel'], a: 0, why: 'A locked axle doesn’t care which wheel has grip. Great off-road, but…' } } },
  { body: 'Now a tight parking-lot turn on dry pavement with the locker <b>still locked</b>. Look at the status and tires.', setup: { situ: 'tight', cfg: { rear: 'locker', lockOn: true } }, goal: { mc: { q: 'Why unlock it on pavement?', opts: ['The wheels can’t turn at different speeds, so a tire scrubs: hard steering, chirping, tire wear and stress on the axle', 'It uses more fuel', 'It doesn’t matter'], a: 0, why: 'Automatic lockers unlock on their own when a wheel needs to overrun; selectable lockers are switched off for pavement.' } } },
] },
{ id: 'tc', title: 'Traction control', sub: 'Brakes as a fake LSD', steps: [
  { body: 'Open diff on ice with 50% throttle: stuck. Turn <b>traction control on</b>.', setup: { situ: 'ice', cfg: { rear: 'open', throttle: 0.5, tc: false } }, ctl: ['tc'], goal: { check: () => C.tc && X.tb[2] > 80 && mph() > 1.5, hint: 'TC on, braking the left rear, truck moving.' } },
  { body: '', ctl: ['tc'], goal: { mc: { q: 'How does braking the spinning wheel help?', opts: ['The open diff still splits torque equally. Braking the spinning wheel lets it hold more torque, so the wheel with grip gets that much too', 'It cuts the engine', 'It locks the diff'], a: 0, why: 'ABS/TC hardware does this with wheel speed sensors and the hydraulic unit. That’s why a bad wheel speed sensor can disable it.' } } },
] },
{ id: 'awd', title: '4WD, AWD and the center diff', sub: 'Three diffs, two axles', steps: [
  { body: '4WD/AWD truck with an <b>open center</b> and open axles. Two diagonal wheels are in the air. Give it 50% throttle and look.', setup: { situ: 'cross', cfg: { layout: 'AWD', center: 'open', rear: 'open', throttle: 0.5 } }, goal: { mc: { q: 'All four wheels are "driven." Why is it stuck?', opts: ['Every diff is open, so torque goes to the easiest path: the two wheels in the air spin and the others get almost nothing', 'The engine is too small', 'The center diff is broken'], a: 0, why: 'An open center diff is needed on pavement (front and rear axles travel different distances in turns) but it has the same weakness as an open axle.' } } },
  { body: '<b>Lock the center</b> (4H).', ctl: ['center'], goal: { check: () => C.center === 'locked', hint: 'Center: Locked (4H).' } },
  { body: '', ctl: ['center'], goal: { mc: { q: 'Still stuck. Why?', opts: ['Each axle still has an open diff with one wheel in the air', 'The transfer case slipped', 'Not enough throttle'], a: 0, why: 'Now turn on traction control (or lock the rear axle) and it will climb out.' } } },
  { body: 'Turn <b>traction control on</b>.', ctl: ['tc'], goal: { check: () => C.tc && mph() > 1.5, hint: 'TC on, truck moving.' } },
  { body: 'Now 4H (center locked) in a tight turn on dry pavement.', setup: { situ: 'tight', cfg: { layout: 'AWD', center: 'locked', rear: 'open' } }, goal: { mc: { q: 'Why is part-time 4WD only for slippery surfaces?', opts: ['In turns the front axle needs to turn faster than the rear; locked together, the tires scrub and the driveline binds (crow-hop)', 'It wears out the engine', 'The front wheels can’t steer'], a: 0, why: 'On snow or dirt the tires can slip a little to relieve the windup. On dry pavement they can’t. AWD systems use an open or slipping center to avoid this.' } } },
] },
{ id: 'pattern', title: 'Gear contact patterns', sub: 'Read before you set up', steps: [
  { body: 'Switch to <b>Pattern</b> mode later to practice. First, the rules.', setup: { situ: 'dry', cfg: {} }, goal: { mc: { q: 'The pattern sits high on the face of the drive side. What do you change?', opts: ['Pinion depth: move the pinion deeper (closer to the ring gear)', 'Backlash only', 'Nothing'], a: 0, why: 'Height on the tooth = pinion depth. Face = pinion too shallow; flank = too deep.' } } },
  { body: '', goal: { mc: { q: 'Depth looks right but the drive pattern runs toward the heel. What now?', opts: ['Too much backlash: move the ring gear toward the pinion', 'Move the pinion deeper', 'Replace the gears'], a: 0, why: 'Lengthwise (toe ↔ heel) = backlash. Always fix depth first, then backlash.' } } },
] },
{ id: 'setup', title: 'Setup order', sub: 'Depth → preload → backlash → pattern', steps: [
  { body: '', setup: { situ: 'dry', cfg: {} }, goal: { mc: { q: 'You overshot pinion bearing preload on a crush sleeve (32 in-lb, spec 15–25). What do you do?', opts: ['Install a new crush sleeve and start over', 'Back the nut off a little', 'Leave it: more preload is fine'], a: 0, why: 'Backing off leaves the sleeve crushed with no real preload: the pinion bearings loosen and you get a whine on coast. Try it in Setup mode.' } } },
  { body: '', goal: { mc: { q: 'What’s the right order?', opts: ['Pinion depth, pinion bearing preload, carrier bearing preload, backlash, then check the pattern', 'Backlash first, then depth', 'Pattern first, then everything else'], a: 0, why: 'Each step changes the ones after it. Then practice the whole job in Setup mode.' } } },
] },
];
function curStep() { return S.lesson ? S.lesson.steps[S.step] : null; }
function enterStep() {
  const st = curStep(); if (!st) return; S.mcPick = []; S.stepOk = !st.goal;
  if (st.setup) { C = baseCfg(); Object.assign(C, st.setup.cfg || {}); const s = SITU[st.setup.situ]; Object.assign(C, { situ: st.setup.situ, mu: s.mu.slice(), lift: s.lift.slice(), R: s.R, cruise: s.cruise ?? null }); restart(); }
  renderPanel(); renderViews();
}
function checkGoal() { const g = curStep()?.goal; if (S.mode !== 'guided' || !g || S.stepOk || !g.check) return; if (g.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderPanel(); } }
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets up a situation, tells you what to change and watch, and checks your work.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;
    else h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Done.' : '◎ ' + g.hint}</div>`;
  }
  if (st.ctl) h += `<h4>Controls</h4>` + drivetrainHTML(st.ctl);
  h += `<div class="nav"><button class="btn small" data-act="nav:back"${S.step ? '' : ' disabled'}>Back</button><button class="btn small" data-act="nav:list">All lessons</button><span class="sp"></span><button class="btn small primary" data-act="nav:next"${S.stepOk ? '' : ' disabled'}>${S.step === L.steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['drive', 'Drive']], guided: [['les', 'Lessons']], pattern: [['pat', 'Pattern']], setup: [['job', 'Setup job']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'drive' ? exploreHTML() : S.tab === 'les' ? lessonsHTML() : S.tab === 'pat' ? patHTML() : S.tab === 'job' ? jobHTML() : caseHTML();
  b.scrollTop = keep;
}
function renderViews() {
  if (S.mode === 'pattern') { const p = S.pat; if (p) { const P = PATS[p.type]; $('#svMain').innerHTML = patternSVG(P.d, P.b); } $('#mTitle').textContent = 'Contact pattern'; $('#mSub').textContent = ''; $('#mChips').innerHTML = ''; }
  else if (S.mode === 'setup') { drawBench(); $('#mChips').innerHTML = ''; }
  else drawCar();
  drawDiff(); drawData();
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m; $$('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'explore' || m === 'guided') { S.lesson = null; C = baseCfg(); situ('dry'); }
  if (m === 'diagnose') { C = baseCfg(); situ('dry'); C.throttle = 0; if (!S.dx || S.dx.solved) newCase(); }
  if (m === 'pattern' && (!S.pat || S.pat.solved)) newPat();
  if (m === 'setup' && (!S.job || S.job.done)) newJob();
  renderPanel(); renderViews();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'situ': situ(v); renderPanel(); break;
    case 'restart': restart(); break;
    case 'layout': C.layout = v; restart(); renderPanel(); break;
    case 'rear': C.rear = v; if (v !== 'locker') C.lockOn = false; renderPanel(); checkGoal(); break;
    case 'lock': C.lockOn = !C.lockOn; renderPanel(); break;
    case 'center': C.center = v; renderPanel(); checkGoal(); break;
    case 'tc': C.tc = !C.tc; renderPanel(); break;
    case 'pans': { const p = S.pat; if (!p || p.solved) break; p.tries++; if (v === PATS[p.type].a) { p.solved = true; S.patScore.n++; if (p.tries === 1) S.patScore.first++; if (PBAG.order[PBAG.i] === p.type && !PBAG.res[p.type]) { PBAG.res[p.type] = p.tries; PBAG.i++; store.set('diff-pat-bag-v1', JSON.stringify(PBAG)); } toast('✓ Correct', 'good'); } else { p.wrong.push(v); toast('Not quite. Height first, then lengthwise.', 'bad'); } renderPanel(); break; }
    case 'newpat': newPat(); break;
    case 'newjob': newJob(); break;
    case 'shim': case 'depthok': case 'nut': case 'measure': case 'backoff': case 'sleeve': case 'preok': case 'cpre': case 'bl': case 'readbl': case 'blok': case 'finish': jobAct(a, +v); break;
    case 'test': runTest(v); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('diff.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#pbody').addEventListener('input', e => {
  const k = e.target.dataset.c; if (!k) return;
  if (k === 'throttle') { C.throttle = +e.target.value / 100; $('#o-thr').textContent = e.target.value + '%'; }
  if (k === 'R') { C.R = +e.target.value; $('#o-rad').textContent = C.R + ' m'; }
  checkGoal();
});

/* ================= loop ================= */
let last = performance.now(), acc = 0, acc2 = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode !== 'pattern' && S.mode !== 'setup') { let t = dt; while (t > 1e-6) { const h = Math.min(0.0005, t); step(h); t -= h; } }
  acc += dt; acc2 += dt;
  if (acc > 0.05) { acc = 0; if (S.mode !== 'pattern' && S.mode !== 'setup') { drawCar(); drawDiff(); } }
  if (acc2 > 0.25) { acc2 = 0; if (S.mode !== 'pattern' && S.mode !== 'setup') drawData(); const w = $('#whyBox'); if (w) w.innerHTML = whyText(); checkGoal(); }
  draw3d();
  requestAnimationFrame(frame);
}
situ('dry'); renderPanel(); renderViews();
requestAnimationFrame(frame);
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__DF = { S, get C() { return C; }, get X() { return X; }, step, situ, restart, setMode, LESSONS, CAUSES, PATS, curStep, newCase, newPat, newJob, jobAct, get BAG() { return BAG; }, get PBAG() { return PBAG; }, status,
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; } };
})();
</script>
</body>

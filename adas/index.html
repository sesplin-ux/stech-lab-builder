<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADAS Calibration Trainer</title>
<meta name="description" content="See what radar, camera, corner radar, ultrasonic and surround-view sensors cover, what 1 degree of misaim does at 100 m, why targets go on the thrust line, which repairs require calibration, and practice pre-checks, static vs. dynamic calibration and target placement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. 2D views:
   road/shop top view, vertical aim (side), sensor effects, calibration matrix / job, notebook. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --radar:#FF7A3D; --cam:#2F9BE0; --corner:#C77DFF; --us:#3DDC97; --sv:#FFD166;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.used{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vbox{flex:1;min-height:0;padding:0 8px 8px}
.vbox svg{width:100%;height:100%;display:block}
#pView{grid-column:1/3}
#pCal{grid-column:2/4}
.svgt{font:600 10px var(--f-label);fill:#C5CFD9;letter-spacing:.03em}
.svgs{font:600 8.5px var(--f-label);fill:#5A6773;letter-spacing:.08em;text-transform:uppercase}
.svgv{font:500 10.5px var(--f-mono);fill:#E6EDF3}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.eff{display:grid;gap:6px}
.eff div{padding:7px 9px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:12.5px;color:var(--soft)}
.eff div b{display:block;font:700 9.5px/1.4 var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.eff div strong{color:#fff}
.eff div.bad{border-color:rgba(255,90,78,.5)}.eff div.warn{border-color:rgba(255,178,36,.5)}.eff div.ok{border-color:rgba(61,220,151,.35)}
table.mx{width:100%;border-collapse:collapse;font-size:12px}
table.mx th{font:600 9.5px/1.15 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:bottom}
table.mx td{padding:5px 3px;border-bottom:1px solid #151d26;text-align:center;color:var(--soft)}
table.mx th:first-child,table.mx td:first-child{text-align:left}
table.mx tr.click{cursor:pointer}
table.mx tr.click:hover td{background:rgba(255,255,255,.03)}
table.mx tr.sel td{background:rgba(47,155,224,.12)}
table.mx td span{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:5px;padding:0 4px;font:700 9.5px/1 var(--f-label);letter-spacing:.06em}
td span.S{background:#2a7fc0;color:#fff}td span.D{background:#7a4fb0;color:#fff}td span.F{background:#2b6c50;color:#C9F7E2}
.chip{padding:3px 7px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}.chip.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}.chip.warn{border-color:rgba(255,178,36,.55);color:#FFE2A8}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.sl{display:grid;grid-template-columns:104px minmax(0,1fr) 66px;gap:8px;align-items:center;margin:3px 0}
.sl label{font-size:12.5px;color:var(--dim)}
.sl output{font:500 12px/1 var(--f-mono);text-align:right;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rowb .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);min-width:76px}
.tog{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.06em;color:var(--dim)}
.tog i{width:10px;height:10px;border-radius:3px}
.tog[aria-pressed="true"]{color:var(--fg);border-color:#3a4a5c}
.tog[aria-pressed="false"] i{opacity:.25}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.msg.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:6px 0}
.tests .btn{white-space:normal;text-align:center;line-height:1.2;padding:8px 8px}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f > b{display:block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.find .f .bad{color:#FFC2BC}.find .f .warn{color:#FFE2A8}.find .f .ok{color:#BFEBD6}
.steps{display:grid;gap:4px;margin:4px 0 8px}
.steps div{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
.steps div i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 var(--f-label);background:var(--line-2);color:var(--fg);font-style:normal}
.steps div.done{color:#C9F7E2}.steps div.done i{background:var(--ok);color:#06140d}
.steps div.cur{color:var(--fg)}.steps div.cur i{background:var(--accent)}
.pc{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--raise);border:1px solid var(--line);margin:4px 0;font-size:12.5px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pView{grid-column:1/-1;height:400px}
  #pCal{grid-column:1/-1;height:auto;min-height:240px}
  #pAim,#pEff{height:300px}
  .main>.panel{height:660px}
}
@media (max-width: 640px){ .views{grid-template-columns:minmax(0,1fr)} #pView{height:280px} .brand p{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 18h3l1-4h8l1 4h3"/><path d="M12 10 5 3M12 10l7-7M12 10V2"/><circle cx="12" cy="11" r="1.5"/></svg></div>
      <div><h1>ADAS Calibration Trainer</h1><p>Coverage · aim · calibration</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="cal">Calibrate</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pView" aria-label="Top view"><div class="phead"><h2 id="vTitle">Road view</h2><span id="vSub"></span><div class="r"><span class="seg mini" id="viewSeg"><button data-v="road" aria-pressed="true">Road</button><button data-v="shop">Shop</button></span></div></div><div class="vbox"><svg id="svView" viewBox="0 0 640 300" role="img" aria-label="Top view of the vehicle with sensor fields of view"></svg></div></section>
      <section class="panel" id="pAim" aria-label="Vertical aim"><div class="phead"><h2>Vertical aim</h2><span>side view · front radar</span></div><div class="vbox"><svg id="svAim" viewBox="0 0 300 220" role="img" aria-label="Side view of the radar beam versus an overhead sign and the road"></svg></div></section>
      <section class="panel" id="pEff" aria-label="What the sensors think"><div class="phead"><h2>What the system thinks</h2></div><div class="ro" id="eff"></div></section>
      <section class="panel" id="pCal" aria-label="Calibration"><div class="phead"><h2 id="cTitle">When to calibrate</h2><span id="cSub"></span></div><div class="ro" id="cal"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DEG = Math.PI / 180, LANE = 3.7, FT = 3.281;
const fx = (v, d = 1) => (Math.abs(v) < 0.05 && d <= 1 ? '0.0' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d));
const m2 = v => `${Math.abs(v).toFixed(2)} m (${(Math.abs(v) * FT).toFixed(1)} ft)`;
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

/* ================= teaching vehicle + sensors (generic; follow OEM / Autel instructions for real work) ================= */
const CAR = { L: 4.7, Wd: 1.9, WB: 2.8, ovF: 0.95 };   // length, width, wheelbase, front overhang (m)
const SEN = {
  radar:  { n: 'Front radar', c: '#FF7A3D', use: 'Adaptive cruise (ACC), automatic emergency braking (AEB)', range: 160, half: 9 },
  cam:    { n: 'Windshield camera', c: '#2F9BE0', use: 'Lane keeping, lane centering, sign reading, AEB (with radar)', range: 70, half: 26 },
  corner: { n: 'Rear corner radars', c: '#C77DFF', use: 'Blind-spot warning, rear cross-traffic alert', range: 60, half: 65 },
  us:     { n: 'Ultrasonic sensors', c: '#3DDC97', use: 'Parking aid (beeps), park assist', range: 2.5, half: 35 },
  sv:     { n: 'Surround-view cameras', c: '#FFD166', use: '360° bird’s-eye parking view', range: 6, half: 90 },
};
const METH = { radar: 'S', cam: 'S', corner: 'D', us: 'F', sv: 'S' };
const METHN = { S: 'Static (targets in the shop)', D: 'Dynamic (drive on the road)', F: 'Function test only' };
const EVENTS = {
  windshield: { n: 'Windshield replaced', req: ['cam'] },
  align:      { n: 'Wheel alignment (thrust angle changed)', req: ['cam', 'radar'] },
  fbumper:    { n: 'Front bumper removed / repaired', req: ['radar', 'sv', 'us'] },
  rbumper:    { n: 'Rear bumper repaired', req: ['corner', 'sv', 'us'] },
  mirror:     { n: 'Side mirror replaced', req: ['sv'] },
  ride:       { n: 'Ride height changed (springs, lowering)', req: ['cam', 'radar', 'corner', 'sv'] },
  bracket:    { n: 'Front radar or bracket replaced', req: ['radar'] },
};
// target spec (generic teaching values): distance from the front wheel centers, centered and square to the THRUST line
const TSPEC = { cam: { d: 1500, tolD: 20, tolL: 10, tolY: 0.2, h: 1200 }, radar: { d: 2000, tolD: 25, tolL: 10, tolY: 0.2, h: 500 } };

/* ================= state ================= */
const BASEC = () => ({ yawRadar: 0, yawCam: 0, yawCorner: 0, rideF: 0, rideR: 0, thrust: 0, show: { radar: true, cam: true, corner: true, us: true, sv: true }, event: 'windshield' });
const S = { mode: 'explore', tab: 'ctl', view: 'road', c: BASEC(), lesson: null, step: 0, stepOk: false, mcPick: [], done: new Set(JSON.parse(store.get('adas.done') || '[]')),
  job: null, jobScore: { jobs: 0, clean: 0 }, dx: null, dxScore: { cases: 0, first: 0, tests: 0 } };
const pitch = c => Math.atan((c.rideF - c.rideR) / 1000 / CAR.WB) / DEG;   // + = nose up (rear lowered or front raised)

/* ================= effects model ================= */
function effects(c) {
  const out = [];
  // radar yaw: perceived lateral = true − d·tan(ψ) (aimed right → objects appear left)
  const ty = Math.tan(c.yawRadar * DEG), halfLane = LANE / 2;
  const leadErr = -100 * ty, leadLane = Math.abs(leadErr) > halfLane ? (leadErr < 0 ? 'the LEFT lane' : 'the RIGHT lane') : 'your lane';
  const adj = 3.7 - 70 * ty, adjLane = Math.abs(adj) <= halfLane ? 'YOUR lane' : adj > halfLane ? 'the right lane' : 'your lane';
  const dWrong = Math.abs(ty) > 1e-6 ? halfLane / Math.abs(ty) : Infinity;

}

  for (let d = 0; d <= 150; d += 25) h += `<line x1="${X(d)}" y1="${Yl(-1.5 * LANE) - 4}" x2="${X(d)}" y2="${Yl(-1.5 * LANE) - 10}" stroke="#2A3644"/>` + T(X(d), Yl(-1.5 * LANE) - 14, d + ' m', 'svgs');
  h += T(X(150) - 2, 286, 'lateral ×4', 'svgs', 'end');
  const thr = c.thrust;   // car body yawed relative to travel by −thrust (crab); keep it simple: draw body straight, thrust line arrow
  // corner radar zones (behind, both sides)
  if (c.show.corner) for (const side of [-1, 1]) { const zoneY0 = side * (LANE / 2 + 0.2 + c.yawCorner * 0.25), zoneY1 = side * (LANE * 1.5 + c.yawCorner * 0.9); h += `<path d="M${X(-1)} ${Yl(zoneY0)} L${X(-22)} ${Yl(zoneY0)} L${X(-22)} ${Yl(zoneY1)} L${X(-1)} ${Yl(zoneY1)}Z" fill="#C77DFF" fill-opacity=".14" stroke="#C77DFF" stroke-opacity=".5"/>`; }

function checkGoal() { const g = curStep()?.goal; if (S.mode !== 'guided' || !g || S.stepOk || !g.check) return; if (g.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderPanel(); } }
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets things up, tells you what to change and watch, and checks your answer.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;
    else h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Done.' : '◎ ' + g.hint}</div>`;
  }
  h += `<div class="nav"><button class="btn small" data-act="nav:back"${S.step ? '' : ' disabled'}>Back</button><button class="btn small" data-act="nav:list">All lessons</button><span class="sp"></span><button class="btn small primary" data-act="nav:next"${S.stepOk ? '' : ' disabled'}>${S.step === L.steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  if (st.ctl) h += `<h4>Controls</h4>` + ctlHTML(st.ctl);
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['ctl', 'Controls']], guided: [['les', 'Lessons']], cal: [['job', 'Job']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'ctl' ? exploreHTML() : S.tab === 'les' ? lessonsHTML() : S.tab === 'job' ? jobHTML() : caseHTML();
  b.scrollTop = keep;
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m;
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'explore' || m === 'guided') { S.c = BASEC(); S.lesson = null; S.view = 'road'; }
  if (m === 'cal') { if (!S.job || S.job.result) newJob(); else S.view = 'shop'; }
  if (m === 'diagnose') { if (!S.dx || S.dx.solved) newCase(); else S.c = Object.assign(BASEC(), CAUSES[S.dx.type].set); }
  renderPanel(); renderViews();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v, w] = b.dataset.act.split(':');
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'show': S.c.show[v] = !S.c.show[v]; renderPanel(); renderViews(); break;
    case 'reset': S.c = BASEC(); renderPanel(); renderViews(); break;
    case 'newjob': newJob(); break;
    case 'pick': case 'stage0': case 'check': case 'fix': case 'stage1': case 'meth': case 'stage2': case 'stage3': case 'drive': case 'run': jobStep(a, v, w); break;
    case 'test': runTest(v); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('adas.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#viewSeg').addEventListener('click', e => { const v = e.target.closest('button')?.dataset.v; if (!v) return; S.view = v; renderViews(); checkGoal(); });
$('#cal').addEventListener('click', e => { const tr = e.target.closest('tr[data-ev]'); if (!tr || S.mode === 'diagnose' || S.mode === 'cal') return; S.c.event = tr.dataset.ev; S.clickedEv = true; renderViews(); checkGoal(); });
$('#pbody').addEventListener('input', e => {
  const t = e.target, k = t.dataset.c; if (!k) return;
  const v = +t.value, o = $('#o-' + k);
  if (k.startsWith('tg-')) { const [, s, f] = k.split('-'); S.job.tg[s][f] = v; if (o) o.textContent = (f === 'y' ? v.toFixed(2) + '°' : v + ' mm'); renderViews(); return; }
  S.c[k] = v; if (o) o.textContent = (['rideF', 'rideR'].includes(k) ? v.toFixed(0) + ' mm' : k === 'thrust' ? v.toFixed(2) + '°' : v.toFixed(1) + '°');
  renderViews(); checkGoal();
});

renderPanel(); renderViews();
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__AD = { S, effects, pitch, LESSONS, CAUSES, EVENTS, METH, TSPEC, PRE, setMode, newJob, jobStep, newCase, runTest, curStep, renderViews, renderPanel, get BAG() { return BAG; },
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; } };
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow the Energy</title>
<meta name="description" content="Trace energy through a gas front-drive car, a 4WD truck, a hybrid and an electric car: fuel or battery to the wheels, plus starting, charging, regen braking and where the energy is lost. Click any part to learn what it does and jump to the deeper STECH tool.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. 2D top-view cutaway car,
   part info, energy path, energy budget, notebook. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --chem:#FFB224; --elec:#2F9BE0; --mech:#3DDC97; --heat:#FF5A4E;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
a{color:#7cc4f0}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"],.seg.veh button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vbox{flex:1;min-height:0;padding:0 8px 8px}
.vbox svg{width:100%;height:100%;display:block}
#pCar{grid-column:1/3}
#pPath{grid-column:2/4}
.svgt{font:600 10px var(--f-label);fill:#C5CFD9;letter-spacing:.03em}
.svgs{font:600 8.5px var(--f-label);fill:#5A6773;letter-spacing:.08em;text-transform:uppercase}
.comp{cursor:pointer}
.comp:hover rect.box{stroke:#fff}
.comp:focus{outline:none}
.comp:focus-visible rect.box{stroke:#fff;stroke-width:2.4}
.flow{stroke-dasharray:4 10;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:600 10px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;margin:4px 0}
.chain .c{all:unset;cursor:pointer;padding:5px 8px;border-radius:8px;background:var(--raise);border:1px solid var(--line-2);font:600 12px/1.1 var(--f-label);color:var(--fg)}
.chain .c:hover{border-color:#3a4a5c}
.chain .a{font:700 9px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;padding:0 3px;display:inline-flex;align-items:center;gap:3px}
.chain .a::after{content:"→";font-size:13px}
.loss{font-size:12.5px;color:#FFC2BC;margin:6px 0 0}
.info h3{margin:0 0 4px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.info p{margin:0 0 8px;font-size:13.5px;color:var(--soft)}
.info .io{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin:6px 0 10px}
.info .io span{color:var(--faint);font:700 9.5px/1.6 var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.chip{padding:3px 7px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}
.bars{display:grid;gap:8px}
.brow small{display:flex;justify-content:space-between;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line-2)}
.stack div{display:grid;place-items:center;font:600 10px/1 var(--f-mono);color:#0b1015;overflow:hidden;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rowb .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);min-width:70px}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.trace{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.trace span{padding:4px 7px;border-radius:7px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);font:600 11.5px/1 var(--f-label);color:#C9F7E2}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:7px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f.bad{border-color:rgba(255,90,78,.45);color:#FFC2BC}.find .f.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}.find .f.ok{border-color:rgba(61,220,151,.4);color:#BFEBD6}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pCar{grid-column:1/-1;height:420px}
  #pPath{grid-column:1/-1;height:auto;min-height:200px}
  #pInfo,#pBudget{height:320px}
  .main>.panel{height:640px}
}
@media (max-width: 640px){ .views{grid-template-columns:minmax(0,1fr)} #pCar{height:280px} .brand p{display:none} }
/* back to the tools hub (site root) */
.hublink{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);color:var(--soft);font:600 12px/1 var(--f-label);letter-spacing:.05em;text-decoration:none;white-space:nowrap;pointer-events:auto}
.hublink:hover{color:var(--fg);border-color:#3a4a5c}
.hublink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hublink{padding:0 8px}.hublink span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <a class="hublink" href="../" title="All STECH student tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>All tools</span></a>
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
      <div><h1>Follow the Energy</h1><p>Fuel · battery · wheels</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="diagnose">Find the break</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pCar" aria-label="Vehicle"><div class="phead"><h2 id="carTitle">Vehicle</h2><span id="carSub"></span><div class="r"><span class="legend"><span><i style="background:var(--chem)"></i>Fuel</span><span><i style="background:var(--elec)"></i>Electric</span><span><i style="background:var(--mech)"></i>Turning</span><span><i style="background:var(--heat)"></i>Heat (lost)</span></span></div></div><div class="vbox"><svg id="svCar" viewBox="0 0 640 330" role="img" aria-label="Top-view cutaway of the vehicle. Click a part to learn about it."></svg></div></section>
      <section class="panel" id="pInfo" aria-label="Part"><div class="phead"><h2>Part</h2><span>click any part</span></div><div class="ro info" id="info"></div></section>
      <section class="panel" id="pBudget" aria-label="Where the energy goes"><div class="phead"><h2>Where the energy goes</h2><span id="bSub"></span></div><div class="ro" id="budget"></div></section>
      <section class="panel" id="pPath" aria-label="Energy path"><div class="phead"><h2>Energy path</h2><span id="pathSub"></span></div><div class="ro" id="path"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const FORM = { chem: { n: 'Fuel (chemical)', c: '#FFB224' }, elec: { n: 'Electric', c: '#2F9BE0' }, mech: { n: 'Turning (mechanical)', c: '#3DDC97' }, heat: { n: 'Heat', c: '#FF5A4E' } };
const T = {   // links to the deeper STECH tools (relative to this tool's folder)
  engine: ['Engine: How It Works', '../engine/'], fuel: ['Fuel Trim Simulator', '../fuel-trim/'], wiring: ['Wiring Diagram Reader', '../wiring-diagram/'],
  bench: ['Electrical Test Bench', '../electrical-testing/'], dtc: ['DTC Code-Setting Visualizer', '../dtc-visualizer/'], hv: ['HV Safety Trainer', '../hv-safety/'],
  align: ['Alignment Simulator', '../alignment/'], brakes: ['Brake Hydraulics Simulator', '../brake-hydraulics/'], ac: ['A/C Cycle Simulator', '../ac-cycle/'], planet: ['Planetary Gear Sandbox', '../planetary/'],
};

/* ================= parts library ================= */
const P = {
  tank:    { n: 'Fuel tank', d: 'Stores gasoline: chemical energy. One gallon holds about 33.7 kWh, roughly the energy in a small EV battery pack.', ein: '—', eout: 'Fuel (chemical)', course: 'Engine Performance I', tools: ['fuel'] },
  pump:    { n: 'Fuel pump', d: 'An electric pump in the tank that pushes fuel up to the engine at about 40–60 psi.', ein: 'Fuel + electric (to run the pump)', eout: 'Fuel under pressure', course: 'Engine Performance I', tools: ['fuel', 'wiring'] },
  engine:  { n: 'Engine', d: 'Burns fuel and air. The heat pushes the pistons down and turns the crankshaft. Most of the fuel’s energy leaves as heat through the cooling system and exhaust.', ein: 'Fuel (chemical)', eout: 'Turning crankshaft + a lot of heat', course: 'Engine Repair · Engine Performance I/II', tools: ['engine', 'fuel', 'dtc'] },
  trans:   { n: 'Transaxle', d: 'A transmission and differential in one case. It changes gear ratios so the engine stays in its useful speed range, then splits torque to the two front axles.', ein: 'Turning', eout: 'Turning (slower, more torque)', course: 'Automatic Transmissions · Manual Drive Trains', tools: ['planet'] },
  trans4:  { n: 'Transmission', d: 'Changes gear ratios: low gears for torque to get moving, high gears for efficient cruising.', ein: 'Turning', eout: 'Turning (geared)', course: 'Automatic Transmissions', tools: ['planet'] },
  tcase:   { n: 'Transfer case', d: 'Sends power to the rear driveshaft only (2H) or to both the rear and front driveshafts (4H). Many have a low range (4L) for extra torque.', ein: 'Turning', eout: 'Turning to the rear (and front in 4H)', course: 'Manual Drive Trains and Axles', tools: [] },
  axles:   { n: 'CV axles', d: 'Shafts with constant-velocity joints that carry torque from the transaxle to each front wheel while the wheels steer and bounce.', ein: 'Turning', eout: 'Turning wheels', course: 'Manual Drive Trains and Axles', tools: ['align'] },
  rearDS:  { n: 'Rear driveshaft', d: 'A tube with U-joints that carries torque from the transfer case back to the rear differential.', ein: 'Turning', eout: 'Turning', course: 'Manual Drive Trains and Axles', tools: [] },
  frontDS: { n: 'Front driveshaft', d: 'Carries torque from the transfer case to the front differential, but only when 4WD is engaged.', ein: 'Turning', eout: 'Turning', course: 'Manual Drive Trains and Axles', tools: [] },
  rearDiff:{ n: 'Rear differential', d: 'Turns the power 90° to the axles, multiplies torque (final drive ratio), and lets the left and right wheels turn at different speeds in a corner.', ein: 'Turning', eout: 'Turning both rear axles', course: 'Manual Drive Trains and Axles', tools: [] },
  frontDiff:{ n: 'Front differential', d: 'Same job as the rear differential, for the front wheels in 4WD.', ein: 'Turning', eout: 'Turning both front axles', course: 'Manual Drive Trains and Axles', tools: [] },

function center(id) {

function anchor(id, toward) {
  if (W[id]) return center(id);
  const p = V().parts[id], [x, y, w, h, kind] = p, [tx, ty] = toward;
  if (kind === 'bar') return [x, clamp(ty, y - h / 2, y + h / 2)];

  const dx = tx - x, dy = ty - y; if (!dx && !dy) return [x, y];
  const s = Math.min(Math.abs((w / 2) / (dx || 1e-9)), Math.abs((h / 2) / (dy || 1e-9)));
  return [x + dx * s, y + dy * s];
}

const CASE_POOL = Object.keys(CAUSES);
/* Shuffle bag: every case type comes up once per round, in a random order, before any repeat.
   A case counts once it's solved. A new round reshuffles and never opens with the case that closed
   the last one. Saved per browser. */
const BAG_KEY = 'energy-dx-bag-v1';
let BAG = null;
try { BAG = JSON.parse(store.get(BAG_KEY)); } catch (e) {}
if (!(BAG && Array.isArray(BAG.order) && BAG.order.length === CASE_POOL.length && CASE_POOL.every(t => BAG.order.includes(t)) && BAG.res && BAG.i >= 0)) BAG = { order: shuffled(CASE_POOL), i: 0, round: 1, res: {} };
const saveBag = () => store.set(BAG_KEY, JSON.stringify(BAG));
function shuffled(ids, avoidFirst) {
  const a = ids.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (avoidFirst && a.length > 1 && a[0] === avoidFirst) { const j = 1 + Math.floor(Math.random() * (a.length - 1)); [a[0], a[j]] = [a[j], a[0]]; }
  return a;
}
function bagNext() {
  if (BAG.i >= BAG.order.length) BAG = { order: shuffled(CASE_POOL, BAG.order[BAG.order.length - 1]), i: 0, round: BAG.round + 1, res: {} };
  saveBag(); return BAG.order[BAG.i];
}
function bagSolved(type, tries) { if (BAG.order[BAG.i] === type && !BAG.res[type]) { BAG.res[type] = tries; BAG.i++; saveBag(); } }
function bagHTML() {
  const n = BAG.order.length, first = Object.values(BAG.res).filter(r => r === 1).length;
  return `<div class="mprog"><span>Round ${BAG.round} · ${BAG.i} of ${n} cases solved</span><div class="mdots" aria-label="Round progress">${BAG.order.map((t, k) => {
    const r = BAG.res[t];
    return `<i class="${r ? (r === 1 ? 'r' : 't') : k === BAG.i ? 'cur' : ''}" title="Case ${k + 1} of ${n}${r ? (r === 1 ? ': correct, first try' : `: correct in ${r} tries`) : ''}"></i>`;
  }).join('')}</div></div>${BAG.i >= n ? `<div class="msg ok" style="margin-top:8px"><b>Set complete!</b> You've solved all ${n} case types once. Correct on the first try: ${first} of ${n}. The next round uses a new shuffled order.</div>` : ''}`;
}
function newCase() {
  const type = bagNext(), C = CAUSES[type];
  S.vk = C.vk; S.sit = C.sit; S.sel = null;
  S.dx = { n: (S.dx?.n || 0) + 1, type, checks: {}, log: [], pick: null, tries: 0, solved: false, wrong: null };
  S.tab = 'case'; renderPanel(); renderViews();
}
function inspect(id) {
  const d = S.dx, C = CAUSES[d.type]; if (!d || d.solved) return;
  const key = W[id] ? (C.path.find(p => W[p]) || id) : id;
  if (d.checks[key]) return;
  const i = C.path.indexOf(key), bi = C.path.indexOf(C.broken);
  let cls, txt;
  if (i < 0) { cls = 'ok'; txt = C.notes[key] || 'Not part of this problem: checks OK.'; }
  else if (i < bi) { cls = 'ok'; txt = 'Energy in ✓ out ✓. ' + (C.notes[key] || ''); }
  else if (i === bi) { cls = 'bad'; txt = (bi === 0 ? 'Energy out ✗. ' : 'Energy in ✓ out ✗. ') + (C.notes[key] || ''); }
  else { cls = 'warn'; txt = 'No energy arriving. ' + (C.notes[key] || ''); }
  d.checks[key] = cls; d.log.unshift({ id: key, cls, txt });
  renderPanel(); renderViews();
}

}

  { body: 'Electric car, <b>Driving</b>. Trace the drive path.', setup: { vk: 'ev', sit: 'drive' }, trace: ['hvbat', 'inverter', 'motor', 'reduction', 'rearAxle', 'wheels'] },
  { body: '', goal: { mc: { q: 'Compare the energy panel with the gas car. About what share of an EV’s energy reaches the wheels?', opts: ['Roughly two-thirds or more (65–73 %), plus energy recovered by regen', 'About 20 %', 'All of it'], a: 0, why: 'An electric drive loses about 15–20 %, versus 64–75 % lost in a gas engine.' } } },
  { body: 'Pick <b>Charging Level 2 (AC)</b>, then <b>DC fast charging</b>, and compare.', ctl: 'sit', goal: { check: () => S.sit === 'dc' && S.seenAC, hint: 'Situation: Charging Level 2, then DC fast charging.' } },
  { body: '', ctl: 'sit', goal: { mc: { q: 'What is different about DC fast charging?', opts: ['The station converts AC to DC itself and feeds the battery directly, bypassing the onboard charger', 'It uses the 12 V battery', 'There is no difference'], a: 0, why: 'So if Level 2 fails but DC fast works, suspect the onboard charger (or the AC side of the port).' } } },
  { body: '', goal: { mc: { q: 'An EV has no alternator. What keeps its 12 V battery charged?', opts: ['The DC-DC converter, fed by the high-voltage battery', 'A small gas engine', 'Nothing; you replace it'], a: 0, why: 'And if the 12 V battery dies, the car can’t wake up to connect its big battery, even at 80 % charge.' } } },
] },
];
function curStep() { return S.lesson ? S.lesson.steps[S.step] : null; }
function applySetup(su) { if (!su) return; if (su.vk) S.vk = su.vk; if (su.sit) S.sit = su.sit; S.sel = null; S.seenAC = false; }
function enterStep() { const st = curStep(); if (!st) return; S.mcPick = []; S.trace = []; S.stepOk = !st.goal && !st.trace; applySetup(st.setup); renderPanel(); renderViews(); }
function checkGoal() {
  const g = curStep()?.goal; if (S.mode !== 'guided' || !g || S.stepOk || !g.check) return;
  if (g.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderPanel(); }
}
function traceClick(id) {
  const st = curStep(); if (!st?.trace || S.stepOk) return false;
  const want = st.trace[S.trace.length];
  if (ptKey(id) === want) { S.trace.push(want); if (S.trace.length === st.trace.length) { S.stepOk = true; toast('✓ Traced it', 'good'); } renderPanel(); }
  else toast(`Not next. Where does the energy go after ${S.trace.length ? partName(S.trace[S.trace.length - 1] === 'wheels' ? 'wFL' : S.trace[S.trace.length - 1]) : 'it starts'}?`, 'bad');
  return true;
}
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets up a vehicle, asks you to trace the energy or answer a question, and checks your answer.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (st.trace) h += `<div class="trace">${S.trace.map(t => `<span>${t === 'wheels' ? 'Wheels' : P[t].n}</span>`).join('')}${S.trace.length < st.trace.length ? `<span style="background:none;border-style:dashed;color:var(--dim)">${st.trace.length - S.trace.length} more…</span>` : ''}</div><div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Traced.' : '◎ Click the parts on the vehicle in the order the energy flows.'}</div>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;
    else h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Done.' : '◎ ' + g.hint}</div>`;
  }
  h += `<div class="nav"><button class="btn small" data-act="nav:back"${S.step ? '' : ' disabled'}>Back</button><button class="btn small" data-act="nav:list">All lessons</button><span class="sp"></span><button class="btn small primary" data-act="nav:next"${S.stepOk ? '' : ' disabled'}>${S.step === L.steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  if (st.ctl === 'sit') h += `<h4>Controls</h4>` + ctlHTML(true);
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['ctl', 'Controls']], guided: [['les', 'Lessons']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'ctl' ? ctlHTML() : S.tab === 'les' ? lessonsHTML() : caseHTML();
  b.scrollTop = keep;
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m;
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'explore') { S.vk = 'gas'; S.sit = 'drive'; S.sel = 'engine'; }
  if (m === 'guided') { S.lesson = null; S.vk = 'gas'; S.sit = 'drive'; S.sel = null; }
  if (m === 'diagnose') { if (!S.dx || S.dx.solved) newCase(); else { const C = CAUSES[S.dx.type]; S.vk = C.vk; S.sit = C.sit; } }
  renderPanel(); renderViews();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function selectPart(id) {
  if (S.mode === 'diagnose') { const real = id === 'wheels' ? (CAUSES[S.dx.type].path.find(p => W[p]) || 'wFL') : id; S.sel = id; inspect(real); return; }
  if (S.mode === 'guided' && traceClick(id)) { S.sel = ptKey(id); renderViews(); return; }
  S.sel = ptKey(id); renderViews();
}
function onAct(e) {
  const pe = e.target.closest('[data-part]'); if (pe) { selectPart(pe.dataset.part); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'veh': S.vk = v; S.sit = Object.keys(VEH[v].sits).find(k => /drive|ev/.test(k)) || Object.keys(VEH[v].sits)[0]; S.sel = null; renderPanel(); renderViews(); break;
    case 'sit': S.sit = v; if (v === 'ac') S.seenAC = true; renderPanel(); renderViews(); checkGoal(); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('energy.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
for (const el of ['#pbody', '#tabs', '#svCar', '#path']) $(el).addEventListener('click', onAct);
$('#svCar').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-part]')) { e.preventDefault(); selectPart(e.target.closest('[data-part]').dataset.part); } });
$('#budget').addEventListener('click', e => { const c = e.target.closest('[data-cyc]')?.dataset.cyc; if (!c) return; S.cyc = c; drawBudget(); checkGoal(); });

renderPanel(); renderViews();
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__FE = { S, VEH, P, CAUSES, LESSONS, setMode, newCase, inspect, selectPart, curStep, renderViews, renderPanel, get BAG() { return BAG; },
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; } };
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AT Hydraulic Flow</title>
<meta name="description" content="Watch transmission fluid travel from the pump through the pressure regulator, manual valve, solenoids and shift valves to apply the clutches and bands, and see the gear ratio that results. GM 4L60-E and a ZF 8HP-style 8-speed, with zoomable spool valves, guided lessons and hydraulic diagnosis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. Views: hydraulic schematic
   (click a part to zoom), gear train, apply chart, notebook. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --sun:#4FA3E3; --car:#3DDC97; --ring:#FFB224; --pin:#9FB3C8;
  --o-line:#FF5A4E; --o-sig:#4FA3E3; --o-range:#FFB224; --o-apply:#3DDC97; --o-suct:#8C7BE0;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.seg.big button{padding:8px 12px;font-size:12px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn.on{border-color:var(--accent);color:#CFE8F8}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,350px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:minmax(0,2.15fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vbox{flex:1;min-height:0;padding:0 8px 8px;position:relative}
.vbox svg{width:100%;height:100%;display:block}
.schScroll{width:100%;height:100%}
#pSch{grid-column:1/-1}
.legend{display:flex;gap:9px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.lg i{width:14px;height:4px;border-radius:2px;display:inline-block}
.svgt{font:600 11.5px var(--f-label);fill:#C5CFD9;letter-spacing:.03em}
.svgs{font:600 9px var(--f-label);fill:#6E7C8B;letter-spacing:.08em;text-transform:uppercase}
.svgv{font:500 10px var(--f-mono);fill:#E6EDF3}
.plab{font:700 9.5px var(--f-label);letter-spacing:.1em;text-transform:uppercase}
/* oil passages */
.pipe{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pipe.base{stroke:#0B1015;stroke-width:8.5}
.pipe.empty{stroke:#1F2A36;stroke-width:4.5}
.pipe.oil{stroke-width:4.5}
.pipe.oil.low{stroke-dasharray:5 4}
.pipe.flow{stroke:#fff;stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:2.5 11.5;animation:flow 1.1s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-14}}
.spd0 .pipe.flow,.spd0 .spin{animation-play-state:paused}
.spd2 .pipe.flow{animation-duration:.45s}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.pipe.flow,.spin{animation:none}}
.comp{cursor:pointer}
.comp .box{fill:#121922;stroke:#2A3644;stroke-width:1}
.comp:hover .box{stroke:#4a5c70}
.comp:focus{outline:none}
.comp:focus-visible .box,.comp.sel .box{stroke:var(--accent);stroke-width:2}
/* zoom card */
#zoom{position:absolute;right:14px;top:4px;width:min(480px,calc(100% - 28px));max-height:calc(100% - 10px);overflow:auto;z-index:5;border-radius:14px;border:1px solid var(--line-2);background:rgba(11,16,21,.97);box-shadow:0 24px 60px -20px rgba(0,0,0,.9);padding:10px 12px 12px}
#zoom h3{margin:0;font:600 16px/1.2 var(--f-label);color:var(--fg)}
#zoom .zh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#zoom .zh .btn{margin-left:auto}
#zoom p{margin:6px 0 0;font-size:13.5px;color:var(--soft)}
#zoom svg{width:100%;height:auto;display:block;margin:4px 0}
#zoom ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--soft)}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.gres{padding:0 12px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.gres b.r{font:600 22px/1 var(--f-mono);color:var(--fg)}
.chip{padding:3px 7px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}
.chip.warn{border-color:rgba(255,178,36,.55);color:#FFE2A8}
.chip.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
.chip.info{border-color:rgba(47,155,224,.55);color:#CFE8F8}
table.rt{width:100%;border-collapse:collapse;font:500 12px/1.2 var(--f-mono)}
table.rt th{font:600 9.5px/1.15 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.rt td{text-align:center;padding:5px 3px;border-bottom:1px solid #151d26;color:var(--soft)}
table.rt th:first-child,table.rt td:first-child{text-align:left;font-family:var(--f-ui);font-size:12.5px;color:var(--dim)}
table.rt td.r,table.rt th.r{text-align:right}
table.rt th.sol{color:#7FB8E6}
table.rt tr.sel td{background:rgba(47,155,224,.12)}
table.rt tr.click{cursor:pointer}
table.rt tr.click:hover td{background:rgba(255,255,255,.03)}
table.rt td.A span,table.rt td.H span,table.rt td.O span,table.rt td.ON span{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:5px;padding:0 3px}
table.rt td.A span{background:var(--accent);color:#fff;font-weight:700}
table.rt td.H span{background:#2b6c50;color:#C9F7E2}
table.rt td.O span{border:1px dashed var(--line-2);color:var(--dim)}
table.rt td.ON span{background:rgba(79,163,227,.22);color:#CFE8F8;font-size:10px}
table.rt td.OFF{color:var(--faint);font-size:10px}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.flowtxt{font-size:13px;color:var(--soft);margin:4px 0 0;padding-left:16px}
.flowtxt li{margin:3px 0}
.soltab{display:grid;gap:4px}
.soltab div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 9px;border-radius:8px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.soltab small{color:var(--dim);font-size:11.5px;display:block}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.msg.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:6px 0}
.tests .btn{white-space:normal;text-align:center;line-height:1.2;padding:8px 8px}
.btn.used{border-color:rgba(61,220,151,.4);color:#C9F7E2}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f > b{display:block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.find .f div{margin:2px 0}
.find .f .bad{color:#FFC2BC}.find .f .warn{color:#FFE2A8}.find .f .ok{color:#BFEBD6}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pSch{height:560px}
  #pGear,#pChart{height:auto;min-height:300px}
  .main>.panel{height:640px}
}
@media (max-width: 700px){ .views{grid-template-columns:minmax(0,1fr)} #pSch{height:auto} .schScroll{overflow-x:auto;height:auto} #svSch{min-width:780px;height:auto} #pGear{min-height:0} #svGear{height:auto} .brand p{display:none} #zoom{left:8px;right:8px;width:auto} }
@media (max-width: 700px){ .schScroll::after{content:'Scroll sideways to see the whole circuit';display:block;padding:4px 2px 0;font-size:11.5px;color:var(--dim);position:sticky;left:0;width:max-content} }
/* back to the tools hub (site root) */
.hublink{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);color:var(--soft);font:600 12px/1 var(--f-label);letter-spacing:.05em;text-decoration:none;white-space:nowrap;pointer-events:auto}
.hublink:hover{color:var(--fg);border-color:#3a4a5c}
.hublink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hublink{padding:0 8px}.hublink span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <a class="hublink" href="../" title="All STECH student tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>All tools</span></a>
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="20" height="6" rx="1.5"/><path d="M7 9v6M11 9v6M16 9v6M5 9V4h4M18 15v5h-4"/></svg></div>
      <div><h1>AT Hydraulic Flow</h1><p>Pump · valve body · clutch apply</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pSch" aria-label="Hydraulic circuit">
        <div class="phead"><h2>Hydraulic circuit</h2><span id="sSub"></span>
          <div class="r">
            <span class="legend" aria-label="Oil color key"><span class="lg"><i style="background:var(--o-line)"></i>Line / system</span><span class="lg"><i style="background:var(--o-range)"></i>Range</span><span class="lg"><i style="background:var(--o-sig)"></i>Signal</span><span class="lg"><i style="background:var(--o-apply)"></i>Apply</span><span class="lg"><i style="background:#1F2A36"></i>Empty</span></span>
            <span class="seg mini" id="spd" role="group" aria-label="Animation speed"><button data-v="0">Pause</button><button data-v="1" aria-pressed="true">Slow</button><button data-v="2.5">Fast</button></span>
          </div>
        </div>
        <div class="vbox spd1" id="schBox"><div class="schScroll"><svg id="svSch" viewBox="0 0 1000 490" role="img" aria-label="Simplified hydraulic schematic. Colored passages are full of pressurized oil; gray passages are empty or exhausted. Select a valve, solenoid, clutch or accumulator to zoom in."></svg></div><div id="zoom" hidden role="dialog" aria-label="Close-up view"></div></div>
      </section>
      <section class="panel" id="pGear" aria-label="Gear train"><div class="phead"><h2>Gear train</h2><span id="gSub"></span></div><div class="vbox"><svg id="svGear" viewBox="0 0 640 230" role="img" aria-label="Face view of the planetary gearsets, turning at their true relative speeds for the clutches and bands the oil has applied"></svg></div><div class="gres" id="gres"></div></section>
      <section class="panel" id="pChart" aria-label="Apply chart"><div class="phead"><h2>Apply chart</h2><span id="cSub"></span></div><div class="ro" id="chart"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);

}

    if (r.bind || r.v.out == null) continue;

function shuffled(ids, avoidFirst) {
  const a = ids.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (avoidFirst && a.length > 1 && a[0] === avoidFirst) { const j = 1 + Math.floor(Math.random() * (a.length - 1)); [a[0], a[j]] = [a[j], a[0]]; }
  return a;
}

  saveBag(); return BAG.order[BAG.i];
}

      for (let g = 1; g <= n; g++) {
        const o = oD(g), got = gearName(tk, o.res), bad = got !== ORD[g] || o.slip.length;
        const sols = tk === '4l60e' ? `SS A ${o.m.cA ? 'ON' : 'OFF'} · SS B ${o.m.cB ? 'ON' : 'OFF'}` : `PC ${TRANS['8hp'].gears[g].join('+')}`;
        L.push([bad ? 'bad' : 'ok', `Cmd ${ORD[g]} · ${sols} · ${got === 'tie-up' ? 'speed ratio implausible (bind)' : o.res.ratio == null ? 'no output speed (slip)' : `ratio ${r2(o.res.ratio)}${got !== ORD[g] ? ` (= ${got})` : o.slip.length ? ', slip rpm high' : ''}`}`]);
      }
      if (tk === '4l60e') L.push([f === 'pcs_open' ? 'bad' : '', `PCS: commanded 0.90 A at idle · actual ${f === 'pcs_open' ? '0.00 A' : '0.90 A'}`]);
      if (f === 'ssA_open') L.push(['bad', 'SS A circuit status: FAULT (open)']);
      if (f === 'ssB_open') L.push(['bad', 'SS B circuit status: FAULT (open)']);
      const c = dtcs(tk, f); L.push(c.length ? ['bad', 'DTCs: ' + c.join(' · ')] : ['ok', 'DTCs: none stored.']);
      break;
    }
    case 'line': {
      const lp = r => { const m = model60({ range: r, gear: 1 }, f); const max = f === 'pcs_open' ? m.line : f === 'low_line' ? Math.round((r === 'R' ? 230 : 175) * 0.6) : (r === 'R' ? 230 : 175) - (m.line < (r === 'R' ? 75 : 62) ? 18 : 0); return [m.line, max]; };
      const [dI, dM] = lp('D'), [rI, rM] = lp('R'), inD = (v, lo, hi) => v >= lo && v <= hi;
      L.push(['', 'Gauge on the line pressure tap, engine running, vehicle stopped (1st gear in D). Sim spec: D 55–70 psi at idle, 160–190 psi with the PCS commanded to max; R 65–85 / 210–250 psi.']);
      L.push([inD(dI, 55, 70) && inD(dM, 160, 190) ? 'ok' : 'bad', `D: ${dI} psi idle · ${dM} psi PCS max${dI === dM ? ' (won\'t change with PCS command)' : ''}`]);
      L.push([inD(rI, 65, 85) && inD(rM, 210, 250) ? 'ok' : 'bad', `R: ${rI} psi idle · ${rM} psi PCS max${rI === rM ? ' (won\'t change with PCS command)' : ''}`]);
      if (f === 'leak_c34' || f === 'leak_servo2') L.push(['', 'Note: this test is done stopped in 1st, so a circuit that only fills in a higher gear isn\'t being tested.']);
      break;
    }
    case 'sol': {
      if (tk === '4l60e') {
        L.push([f === 'ssA_open' ? 'bad' : 'ok', `Shift solenoid A: ${f === 'ssA_open' ? 'OL (open) · no click' : '24 Ω · clicks'} (spec 20–30 Ω)`]);
        L.push([f === 'ssB_open' ? 'bad' : 'ok', `Shift solenoid B: ${f === 'ssB_open' ? 'OL (open) · no click' : '25 Ω · clicks'} (spec 20–30 Ω)`]);
        L.push([f === 'pcs_open' ? 'bad' : 'ok', `PCS: ${f === 'pcs_open' ? 'OL (open)' : '4.4 Ω'} (spec 3–6 Ω)`]);
      } else {
        for (const x of 'ABCDE') L.push([f === 'h_pcA' && x === 'A' ? 'bad' : 'ok', `PC solenoid ${x}: ${f === 'h_pcA' && x === 'A' ? 'OL (open)' : '5.2 Ω'} (spec 4–7 Ω)`]);
        L.push(['ok', 'Line PC solenoid: 5.1 Ω']);
      }
      break;
    }
    case 'adapt': {
      for (const x of 'ABCDE') {
        const v = f === 'h_leakE' && x === 'E' ? ['bad', 'fill pressure adaptation at the MAXIMUM limit'] : f === 'h_slowC' && x === 'C' ? ['bad', 'fill time adaptation at the limit (slow to fill)'] : f === 'h_lowSys' ? ['warn', 'adaptation high'] : f === 'h_pcA' && x === 'A' ? ['bad', 'not learnable (no response)'] : ['ok', 'within range'];
        L.push([v[0], `${elN('8hp', x)}: ${v[1]}`]);
      }
      L.push(['', 'Adaptations show how much the TCM has had to add to fill and apply each element smoothly.']);
      break;
    }
    case 'sysp': {
      const low = f === 'h_lowSys';
      L.push(['', 'System pressure with a test adapter. Sim spec: 80–100 psi at idle in D, 210–250 psi at full torque request.']);
      L.push([low ? 'bad' : 'ok', `D: ${low ? 50 : 90} psi idle · ${low ? 125 : 230} psi max`]);
      L.push([low ? 'bad' : 'ok', `R: ${low ? 66 : 120} psi idle · ${low ? 140 : 240} psi max`]);
      if (f === 'h_leakE') L.push(['', 'In a gear with clutch E applied, system pressure dips about 8 psi.']);
      break;
    }
    case 'fluid': {
      L.push(SLIPF.includes(f) ? ['warn', 'Level correct, but the fluid is dark with a burnt smell, and there is friction material on the magnet.'] : f === 'v12_stuck' || f === 'v23_stuck' || f === 'h_stuckD' || f === 'h_slowC' ? ['ok', 'Level correct, color red. Some varnish on the dipstick.'] : ['ok', 'Level correct, color red, no burnt smell.']);
      break;
    }
  }
  return L;
}
function runTest(k) {
  const d = S.dx; if (!d || d.solved || d.tests[k]) return;
  d.tests[k] = true;
  if (k.includes(':')) {
    const item = CONFIRM[d.tk].find(x => x[0] === k), hit = item[2] === d.type, isAir = k.startsWith('air:');
    const L = isAir ? [hit ? ['bad', 'Air hisses past the seals; the piston barely applies.'] : ['ok', 'A solid apply: you hear the clunk and it holds air.']]
      : k === 'vb:pump' ? [hit ? ['bad', 'Pump wear well past spec, and the regulator valve is sticky in its bore.'] : ['ok', 'Pump clearances in spec; the regulator moves freely.']]
      : k === 'vb:acc12' ? [hit ? ['bad', 'The accumulator spring is broken and the piston is stuck at the end of its bore.'] : ['ok', 'Spring and piston OK; the piston moves freely.']]
      : [hit ? ['bad', 'The valve sticks: varnish and scoring in the bore. It won\'t move under its own spring.'] : ['ok', 'The valve slides freely under its own weight.']];
    d.log.unshift({ name: item[1], lines: L });
  } else d.log.unshift({ name: TESTS[d.tk].find(t => t[0] === k)[1], lines: testOut(k) });
  renderPanel();
}
function submitDx() {
  const d = S.dx; if (!d || d.solved || !d.pick) return;
  d.tries++;
  if (d.pick === d.type) { bagSolved(d.type, d.tries); d.solved = true; S.dxScore.cases++; if (d.tries === 1) S.dxScore.first++; S.dxScore.tests += Object.keys(d.tests).length; toast('✓ Correct', 'good'); }
  else d.wrong = 'Not quite. Wrong gear (cleanly) points at solenoids and valves. Right gear that slips points at seals and pressure. A bad shift feel with normal gears points at accumulators and line pressure control.';
  renderPanel();
}
const WHY = {
  ssA_open: 'Signal A can never build, so the 1-2 valve is always up (no 1st) and the 3-4 valve never gets a signal (no 4th): 2-2-3-3. The ohm test and P0753 confirm it.',
  ssB_open: 'Signal B can never build, so the 2-3 valve is always up. Only solenoid A changes anything: 4-3-3-4. The ohm test and P0758 confirm it.',
  pcs_open: '0 A through the PCS means maximum line pressure: harsh everything, and line won\'t drop when commanded. P0748.',
  v12_stuck: 'The solenoids work, but the 1-2 valve never moves, so no 2nd fluid: stuck in 1st. Ratio codes set for 2nd–4th.',
  v23_stuck: 'No 3rd fluid, ever. And in 4th, signal A goes to the 1-2 valve (because the 2-3 valve is down), dropping it to 1st.',
  acc12: 'Gears are all correct and nothing slips: only the 1-2 shift feel is wrong. Its accumulator is the cushion for that one shift.',
  leak_fwd: 'Right gears, but every forward gear slips, and D engagement is slow. Reverse is fine. Line drops only in D. The forward clutch is the one element every forward gear shares.',
  leak_c34: 'Right gears, slipping only in 3rd and 4th: the 3-4 clutch. The stationary line test can\'t see it, because the circuit isn\'t filled in 1st.',
  leak_servo2: 'Slips only in 2nd: the band on 2nd apply. In 4th a second piston (4th apply) holds the band, so 4th is fine.',
  leak_rev: 'Only reverse slips, and line drops only in R. The reverse input clutch is the leaking circuit.',
  low_line: 'Everything slips and engagements are slow in both D and R: the shared supply. The line pressure test is low in every range.',
  h_pcA: 'Solenoid A reads open, so brake A never applies: no R, 1st, 2nd, 7th or 8th. The TCM goes limp in a gear without A.',
  h_leakE: 'Right gears, but the E gears (2, 3, 4, 6, 8) slip, and the E fill adaptation is maxed out.',
  h_stuckD: 'D is applied in every gear. In 1st–3rd that makes four elements: tie-up. The solenoids test fine, so it is the valve.',
  h_lowSys: 'Every element slips and engages slowly: system pressure is low, and every adaptation is high.',
  h_slowC: 'Steady gears are fine; only the shifts INTO clutch C (N→D, 2→3, 4→5, 6→7) flare. The C fill-time adaptation is at its limit.',
};
function caseHTML() {
  const d = S.dx; if (!d) return '';
  const C_ = CAUSES[d.type], sc = S.dxScore, T = TRANS[d.tk];
  let h = `<div class="case"><span class="qk">Case ${d.n}</span><h3>Customer concern</h3><p>${C_.concern}</p><p class="dim">${T.name}. Fluid level and shift linkage already checked OK by the service writer.</p></div>
    <div class="score"><div><small>First try</small><b>${sc.first} / ${sc.cases}</b></div><div><small>Avg tests</small><b>${sc.cases ? (sc.tests / sc.cases).toFixed(1) : '–'}</b></div><div><small>Tests here</small><b>${Object.keys(d.tests).length}</b></div></div>${bagHTML()}`;
  if (d.solved) h += `<div class="msg ok"><b>${d.tries === 1 ? 'Correct on the first try' : `Correct after ${d.tries} tries`}</b> with ${Object.keys(d.tests).length} tests: <b>${C_.lab}</b>.</div><p class="dim">${WHY[d.type]}</p><div class="nav"><button class="btn primary" data-act="newcase">${BAG.i >= BAG.order.length ? `Start round ${BAG.round + 1}` : 'Next case'}</button></div>`;
  else {
    h += `<h4>Tests</h4><div class="tests">${TESTS[d.tk].map(([k, n]) => `<button class="btn${d.tests[k] ? ' used' : ''}" data-act="test:${k}"${d.tests[k] ? ' disabled' : ''}>${n}</button>`).join('')}</div>`;
    h += `<h4>Confirm (valve body / unit off)</h4><div class="rowb">${CONFIRM[d.tk].map(([k, n]) => `<button class="btn small${d.tests[k] ? ' used' : ''}" data-act="test:${k}"${d.tests[k] ? ' disabled' : ''}>${n}</button>`).join('')}</div>`;
  }
  if (d.log.length) h += `<h4>Findings</h4><div class="find">${d.log.map(e => `<div class="f"><b>${e.name}</b>${e.lines.map(([k, s]) => `<div class="${k}">${s}</div>`).join('')}</div>`).join('')}</div>`;
  if (!d.solved) {
    const opts = CASE_POOL.filter(k => CAUSES[k].tk === d.tk);
    h += `<h4>What failed?</h4><div class="cards">${opts.map(k => `<button class="card" data-act="dx:${k}" aria-pressed="${d.pick === k}"><b>${CAUSES[k].lab}</b></button>`).join('')}</div><div class="nav"><button class="btn primary" data-act="dxsubmit"${d.pick ? '' : ' disabled'}>Submit diagnosis</button></div>`;
    if (d.wrong) h += `<div class="msg bad">${d.wrong}</div>`;
  }
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['ctl', 'Controls']], guided: [['les', 'Lessons']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'ctl' ? ctlHTML() : S.tab === 'les' ? lessonsHTML() : caseHTML();
  b.scrollTop = keep;
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m; S.ang = {}; S.prev = null; S.demo = null; stopAuto();
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'guided') S.lesson = null;
  if (m === 'diagnose') { if (!S.dx || S.dx.solved) newCase(); else { S.tk = S.dx.tk; } }
  renderPanel(); renderViews();
}
let autoT = null;
function stopAuto() { S.auto = false; clearInterval(autoT); autoT = null; }
function toggleAuto() {
  if (S.auto) { stopAuto(); renderPanel(); return; }
  S.auto = true;
  autoT = setInterval(() => { if (S.st.range !== 'D') { stopAuto(); renderPanel(); return; } setSt({ range: 'D', gear: S.st.gear % SPEC(S.tk).gears + 1 }); }, 2600);
  renderPanel();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const p = b.dataset.act.split(':'), a = p[0], v = p.slice(1).join(':');
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'tk': stopAuto(); setSt({ range: S.st.range === 'D' ? 'D' : SPEC(v).ranges.includes(S.st.range) ? S.st.range : 'D', gear: 1 }, v); break;
    case 'range': if (v !== 'D') stopAuto(); setSt({ range: v, gear: v === 'D' ? (S.st.range === 'D' ? S.st.gear : 1) : 1 }); break;
    case 'gear': stopAuto(); setSt({ range: 'D', gear: +v }); break;
    case 'auto': toggleAuto(); break;
    case 'test': runTest(v); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; S.ang = {}; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; S.demo = null; renderPanel(); renderViews(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('athyd.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; S.demo = null; renderPanel(); renderViews(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#chart').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-row]'); if (!tr) return;
  const row = chartRows(S.tk).find(r => r.g === tr.dataset.row); stopAuto(); setSt(row.st);
});
function openZoom(id) { S.zoom = S.zoom === id ? null : id; renderSchematic(); renderZoom(); checkGoal(); }
$('#svSch').addEventListener('click', e => { const g = e.target.closest('[data-z]'); if (g) openZoom(g.dataset.z); });
$('#svSch').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const g = e.target.closest('[data-z]'); if (g) { e.preventDefault(); openZoom(g.dataset.z); } });
$('#zoom').addEventListener('click', e => { if (e.target.closest('[data-zclose]')) { S.zoom = null; renderSchematic(); renderZoom(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.zoom) { S.zoom = null; renderSchematic(); renderZoom(); } });
$('#spd').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; S.speed = +b.dataset.v;
  document.querySelectorAll('#spd button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#schBox').className = 'vbox ' + (S.speed === 0 ? 'spd0' : S.speed > 1 ? 'spd2' : 'spd1');
});

/* animation loop: gears turn; during a shift the oncoming circuits fill and the off-going ones exhaust */
let lastT = performance.now(), wasShifting = false;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (VIEW && S.speed > 0) for (const g of VIEW.sets) placeAngles(g.id, g.set, g.v, dt);
  const shifting = S.prev && shiftK() < 1;
  if (shifting || wasShifting) { renderSchematic(); if (!shifting) S.prev = null; }
  wasShifting = shifting;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

renderPanel(); renderViews();
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__AH = { S, model, model60, model8, outcome, transSolve, gearName, NORM, TRANS, LAYOUT, CAUSES, testOut, runTest, newCase, setMode, setSt, LESSONS, curStep, renderViews, renderPanel, gearsMismatch, dtcs, get BAG() { return BAG; },
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; }, zoom: openZoom };
})();

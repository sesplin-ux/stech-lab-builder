<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brake Hydraulics Simulator</title>
<meta name="description" content="Push the pedal and follow the force: pedal ratio, booster, master cylinder bore, Pascal's law, calipers, proportioning and ABS. Break the system and diagnose spongy, sinking, hard and dragging brakes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. 2D views:
   system schematic, master cylinder cutaway, force chain, gauges, panic stop (ABS), notebook. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vbox{flex:1;min-height:0;padding:0 8px 8px}
.vbox svg{width:100%;height:100%;display:block}
#pSys{grid-column:1/3}
.svgt{font:600 10.5px var(--f-label);fill:#8A98A8;letter-spacing:.04em}
.svgs{font:600 9px var(--f-label);fill:#5A6773;letter-spacing:.08em;text-transform:uppercase}
.svgv{font:500 11px var(--f-mono);fill:#E6EDF3}
.svgv.bad{fill:#FF8A80}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
/* force chain */
.chain{display:grid;gap:3px;font-size:12.5px}
.chain .row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:4px 8px;border-radius:7px;background:var(--raise)}
.chain .op{font:600 13px/1 var(--f-mono);color:var(--accent);text-align:center}
.chain .lb{color:var(--dim)}
.chain .lb small{display:block;font-size:11px;color:var(--faint)}
.chain .v{font:600 12.5px/1.2 var(--f-mono);color:var(--fg);text-align:right;white-space:nowrap}
.chain .row.res{background:#0f1c27;box-shadow:inset 0 0 0 1px rgba(47,155,224,.35)}
.chain .row.bad .v{color:#FF8A80}
/* gauges */
.gwrap{display:grid;gap:8px}
.ped{padding:8px 10px;border-radius:10px;background:var(--raise)}
.ped .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ped .top small{font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ped .top b{font:600 15px/1 var(--f-mono)}
.track{position:relative;height:14px;border-radius:7px;background:#0a0f14;border:1px solid var(--line-2);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#2F9BE0,#5fb6ec);border-radius:7px}
.track i.bad{background:linear-gradient(90deg,#c9463d,#FF5A4E)}
.track i.warn{background:linear-gradient(90deg,#c98a1c,#FFB224)}
.track u{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(45deg,#1c2733 0 4px,#121a22 4px 8px)}
.tlab{display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--faint);margin-top:3px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:3px 7px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}
.chip.warn{border-color:rgba(255,178,36,.55);color:#FFE2A8}
.chip.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.wt{padding:7px 9px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.wt small{display:flex;justify-content:space-between;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.wt b{display:block;font:600 16px/1.25 var(--f-mono)}
.wt span{font-size:11px;color:var(--dim)}
.wt.drag{border-color:rgba(255,178,36,.55)}
.wt.dead b{color:var(--faint)}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.lamp{width:62px;height:34px;border-radius:7px;display:grid;place-items:center;font:700 11px/1 var(--f-label);letter-spacing:.14em;border:1px solid var(--line-2);color:#4a2622;background:#140c0c}
.lamp.on{background:#c62f25;color:#fff;border-color:#ff7a70;box-shadow:0 0 18px rgba(255,90,78,.55)}
.dec{font-size:12.5px;color:var(--dim)}
.dec b{color:var(--fg);font:600 13px var(--f-mono)}
.locked{padding:14px;border:1px dashed var(--line-2);border-radius:10px;color:var(--dim);font-size:13px;text-align:center;margin:4px 0}
table.gt{width:100%;border-collapse:collapse;font:500 11.5px/1.15 var(--f-mono)}
table.gt th{font:600 9.5px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px;border-bottom:1px solid var(--line)}
table.gt td{text-align:right;padding:4px;border-bottom:1px solid #151d26;color:var(--soft)}
table.gt th:first-child,table.gt td:first-child{text-align:left}
table.gt td.bad{color:#FF8A80;font-weight:600}
/* stop panel */
.stopres{font-size:12px;color:var(--soft);padding:0 12px 8px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.stopres b{font-family:var(--f-mono)}
/* notebook */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.sl{display:grid;grid-template-columns:104px minmax(0,1fr) 66px;gap:8px;align-items:center;margin:3px 0}
.sl label{font-size:12.5px;color:var(--dim)}
.sl output{font:500 12px/1 var(--f-mono);text-align:right;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rowb .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);min-width:96px}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.cyls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 4px 10px}
.cyls .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.cc{all:unset;cursor:pointer;min-width:30px;height:30px;padding:0 9px;box-sizing:border-box;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--raise);font:600 12.5px/1 var(--f-label);color:var(--soft)}
.cc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:6px 0}
.tests .btn{white-space:normal;text-align:center;line-height:1.2;padding:8px 8px}
.tests .btn.used{border-color:rgba(61,220,151,.4);color:#C9F7E2}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f > b{display:block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.find .f div{margin:2px 0}
.find .f .bad{color:#FFC2BC}.find .f .warn{color:#FFE2A8}.find .f .ok{color:#BFEBD6}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pSys{grid-column:1/-1;height:400px}
  #pMC,#pChain,#pGauge,#pStop{height:330px}
  .main>.panel{height:640px}
}
@media (max-width: 640px){ .views{grid-template-columns:minmax(0,1fr)} #pSys{height:250px} #pMC{height:270px} .brand p{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M5 7.5h4M5 16.5h4"/><rect x="2.5" y="9" width="5" height="6" rx="1.2"/></svg></div>
      <div><h1>Brake Hydraulics Simulator</h1><p>Pedal · Pascal · ABS</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pSys" aria-label="Hydraulic system"><div class="phead"><h2>Hydraulic system</h2><span id="sysSub"></span></div><div class="vbox"><svg id="svSys" viewBox="0 0 640 330" role="img" aria-label="Top-view schematic: pedal, booster, master cylinder, valves, ABS unit and the four wheel brakes, with lines colored by pressure"></svg></div></section>
      <section class="panel" id="pMC" aria-label="Master cylinder"><div class="phead"><h2>Master cylinder</h2><span>tandem · cutaway</span></div><div class="vbox"><svg id="svMC" viewBox="0 0 360 210" role="img" aria-label="Cutaway of the tandem master cylinder with pushrod, primary and secondary pistons, ports and reservoir"></svg></div></section>
      <section class="panel" id="pChain" aria-label="Force chain"><div class="phead"><h2>Force chain</h2><span>foot → pressure → clamp</span></div><div class="ro" id="chain"></div></section>
      <section class="panel" id="pGauge" aria-label="Gauges"><div class="phead"><h2>Gauges</h2><span id="gSub"></span></div><div class="ro" id="gauge"></div></section>
      <section class="panel" id="pStop" aria-label="Panic stop"><div class="phead"><h2>Panic stop</h2><span>60–0 mph</span>
        <div class="r"><span class="seg mini" id="surf"><button data-s="dry" aria-pressed="true">Dry</button><button data-s="wet">Wet</button><button data-s="ice">Ice</button></span><span class="seg mini"><button id="absBtn" aria-pressed="true">ABS on</button></span><button class="btn small primary" id="runStop">Run</button></div></div>
        <div class="vbox"><svg id="svStop" viewBox="0 0 360 170" role="img" aria-label="Chart of vehicle speed, left front wheel speed and left front brake pressure during a panic stop"></svg></div><div class="stopres" id="stopRes"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f0 = n => Math.round(n).toLocaleString('en-US');
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

/* ================= hydraulic model (generic teaching car; US units) ================= */
const IN2 = d => Math.PI * d * d / 4;
const K = { mu: 0.40, rf: 4.6, rdisc: 1.5, rrDisc: 4.3, wc: 0.875, drumR: 4.5, BF: 2.6, Rt: 12.5 };
const CAR = { W: 3400, h: 21, L: 106, fFront: 0.60 };
const BOOST = 3, RUNOUT = 1100, SMAX = 1.35, FLOOR = 6.0, FREE = 0.20, GAP = 0.65, SPLIT = 450, SLOPE = 0.30;
const WHEELS = ['LF', 'RF', 'LR', 'RR'];
const WNAME = { LF: 'left front', RF: 'right front', LR: 'left rear', RR: 'right rear' };
const isFront = w => w[1] === 'F';
const circuits = layout => layout === 'fr' ? { A: ['LF', 'RF'], B: ['LR', 'RR'] } : { A: ['LF', 'RR'], B: ['RF', 'LR'] };

  const compA = priCup < 124 - 1.5, compB = 254 + Math.min(ss, 58) < 258 - 1.5;

  h += spring(priCup + 2, secRear - 2, 130) + spring(secFront + 2, 332, 130);

/* ================= force chain ================= */

}

/* ================= gauges ================= */
function feelChips(m) {
  const c = S.c, f = [];
  if (m.effort <= 0) return [['Released', '']];
  if (m.floor) f.push(['To the floor', 'bad']);
  if (m.spongy) f.push(['Spongy', 'bad']);
  else if (m.travel > 2.8 && !m.floor) f.push(['Low pedal', 'warn']);
  if (!m.assistOn) f.push(['Hard: no assist', 'warn']);
  if (c.fault === 'bypass' && S.hold > 0) f.push(['Sinking', 'bad']);
  if (!f.length) f.push(['Firm', 'ok']);
  return f;
}
function drawGauge(m) {
  const c = S.c, rv = reveal(), d = S.dx;
  if (S.mode === 'diagnose') {
    $('#gSub').textContent = 'shop gauges';
    if (!d?.g) { $('#gauge').innerHTML = `<div class="locked">Connect pressure gauges at the four bleeder screws (Case tab → <b>Pressure gauges</b>) to see readings here.</div>`; return; }
    const g = d.g;
    let h = `<table class="gt"><tr><th>Wheel</th><th>Light 25 lb</th><th>Hard 80 lb</th><th>Released</th></tr>`;
    for (const w of WHEELS) h += `<tr><td>${w}</td><td class="${g.light[w] < 5 ? 'bad' : ''}">${f0(g.light[w])}</td><td class="${g.hard[w] < 5 ? 'bad' : ''}">${f0(g.hard[w])}</td><td class="${g.res[w] > 10 ? 'bad' : ''}">${f0(g.res[w])}</td></tr>`;
    h += `</table><p class="dim" style="margin:8px 0 0">psi. "Released" is read after a 10-minute drive with the pedal up. A good system reads 0. Rear pressure should be lower than front on a hard stop (proportioning).</p>`;
    $('#gauge').innerHTML = h; return;
  }
  $('#gSub').textContent = m.effort > 0 ? 'pedal applied' : 'pedal released';
  const pct = v => clamp(v / FLOOR * 100, 0, 100), fc = feelChips(m), barCls = m.floor || m.spongy ? 'bad' : m.travel > 2.8 ? 'warn' : '';
  let h = `<div class="gwrap"><div class="ped"><div class="top"><small>Pedal travel</small><b>${m.travel.toFixed(1)} in</b><span class="chips">${fc.map(([t, k]) => `<span class="chip ${k}">${t}</span>`).join('')}</span></div>
    <div class="track"><u style="width:${pct(m.free)}%"></u><i class="${barCls}" style="width:${pct(m.travel)}%"></i></div><div class="tlab"><span>0</span><span>free play ${m.free.toFixed(2)}</span><span>floor ${FLOOR.toFixed(1)} in</span></div></div><div class="wg">`;
  for (const w of WHEELS) {

  }
  const lock = m.lockF && m.lockR ? 'Front and rear at the grip limit' : m.lockF ? 'Fronts at the grip limit (would lock without ABS)' : m.lockR ? 'Rears at the grip limit (would lock first: unstable)' : '';
  h += `</div><div class="sum"><div class="lamp${m.warn ? ' on' : ''}" title="Red brake warning lamp">BRAKE</div><div class="dec">Decel <b>${m.decel.toFixed(2)} g</b> · 60–0 <b>${isFinite(m.stop60) ? f0(m.stop60) + ' ft' : '—'}</b>${lock ? `<br><span style="color:#FFE2A8">${lock}</span>` : ''}${Math.abs(m.pullDrive) > 40 ? `<br><span style="color:#FFE2A8">Drag pulls the car ${m.pullDrive < 0 ? 'left' : 'right'}</span>` : ''}${m.effort > 0 && Math.abs(m.pullBrake) > 0.08 ? `<br><span style="color:#FFE2A8">Pulls ${m.pullBrake < 0 ? 'left' : 'right'} when braking</span>` : ''}</div></div></div>`;
  $('#gauge').innerHTML = h;
}

/* ================= panic stop chart ================= */
function drawStop() {
  const r = S.stop, rv = reveal(), d = S.dx;

  document.querySelectorAll('#surf button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === S.surf));
  const X0 = 34, X1 = 326, Y0 = 12, Y1 = 132;
  let h = `<rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" fill="#0a0f14" stroke="#1D2732"/>`;
  if (!r || (lockedOut && !rv.stop)) {
    h += T(180, 70, lockedOut ? 'Road test (Case tab) runs a panic stop here' : 'Press Run for a 60–0 mph panic stop', 'svgt') + T(180, 88, lockedOut ? '' : 'Pick a surface and ABS on/off first', 'svgs');
    $('#svStop').innerHTML = h; $('#stopRes').innerHTML = ''; return;
  }
  const o = r.out, Tm = Math.max(1, r.time), pm = Math.max(500, r.pmax * 1.05);
  const sx = t => X0 + (t / Tm) * (X1 - X0), sy = v => Y1 - (v / 60) * (Y1 - Y0), sp = p => Y1 - (p / pm) * (Y1 - Y0);
  for (let v = 0; v <= 60; v += 20) h += `<line x1="${X0}" y1="${sy(v)}" x2="${X1}" y2="${sy(v)}" stroke="#141c25"/>` + T(X0 - 4, sy(v) + 3.5, v, 'svgs', 'end');
  const tStep = Tm > 12 ? 5 : Tm > 5 ? 2 : 1;
  for (let t = 0; t <= Tm; t += tStep) h += T(sx(t), Y1 + 11, t + 's', 'svgs');
  h += T(X0 - 4, Y0 - 3, 'MPH', 'svgs', 'end') + T(X1 + 4, Y0 - 3, 'PSI', 'svgs', 'start') + T(X1 + 4, Y0 + 7, f0(pm), 'svgs', 'start');
  const upto = S.play ? S.play.i : o.length - 1, step = Math.max(1, Math.floor(o.length / 600));
  const pl = (fn) => { let s = ''; for (let i = 0; i <= upto; i += step) s += (s ? ' L' : 'M') + sx(o[i].t).toFixed(1) + ' ' + fn(o[i]).toFixed(1); return s; };
  // ABS mode band
  if (r.abs) { let band = ''; for (let i = 0; i <= upto; i++) { const f = o[i].f; if (f) band += `<rect x="${sx(o[i].t).toFixed(1)}" y="${Y1 - 5}" width="${((X1 - X0) / Tm * 0.01 + .4).toFixed(2)}" height="5" fill="${f === 2 ? '#FF5A4E' : '#FFB224'}"/>`; } h += band; }
  h += `<path d="${pl(q => sp(q.p))}" fill="none" stroke="#FFB224" stroke-width="1.4" opacity=".9"/>`;
  h += `<path d="${pl(q => sy(q.v))}" fill="none" stroke="#E6EDF3" stroke-width="2"/>`;
  h += `<path d="${pl(q => sy(q.w))}" fill="none" stroke="#2F9BE0" stroke-width="1.6"/>`;
  if (S.play) { const q = o[upto]; h += `<line x1="${sx(q.t)}" y1="${Y0}" x2="${sx(q.t)}" y2="${Y1}" stroke="#5A6773" stroke-dasharray="3 3"/>`; }
  h += `<g transform="translate(${X0 + 6} 150)"><line x1="0" y1="0" x2="14" y2="0" stroke="#E6EDF3" stroke-width="2"/>${T(18, 3.5, 'Car speed', 'svgs', 'start')}<line x1="80" y1="0" x2="94" y2="0" stroke="#2F9BE0" stroke-width="2"/>${T(98, 3.5, 'LF wheel', 'svgs', 'start')}<line x1="152" y1="0" x2="166" y2="0" stroke="#FFB224" stroke-width="2"/>${T(170, 3.5, 'LF pressure', 'svgs', 'start')}${r.abs ? `<rect x="232" y="-3" width="8" height="6" fill="#FFB224"/>${T(243, 3.5, 'hold', 'svgs', 'start')}<rect x="266" y="-3" width="8" height="6" fill="#FF5A4E"/>${T(277, 3.5, 'dump', 'svgs', 'start')}` : ''}</g>`;
  $('#svStop').innerHTML = h;
  if (S.play) { const q = o[upto]; $('#stopRes').innerHTML = `<span><b>${q.v.toFixed(0)} mph</b> · ${f0(q.x)} ft</span>${r.abs ? `<span>LF valves: ${q.f === 2 ? 'inlet <b>closed</b>, outlet <b>open</b> → dump' : q.f === 1 ? 'inlet <b>closed</b>, outlet closed → hold' : 'inlet <b>open</b>, outlet closed → apply'}</span>` : ''}`; return; }
  const surf = { 0.95: 'dry', 0.6: 'wet', 0.15: 'ice' }[r.mu] || '';
  let res = `<span>Stopped in <b>${f0(r.dist)} ft</b> (${r.time.toFixed(1)} s, ${surf}, ${r.abs ? 'ABS on' : 'ABS off'})</span>`;
  if (r.abs) res += `<span class="chip ok">No lockup · steering kept</span><span class="dim">LF cycled ${r.cycles}×</span>`;
  else if (r.rearFirst) res += `<span class="chip bad">Rears locked first: car can spin</span>`;
  else if (r.steerLost) res += `<span class="chip ${S.mode === 'diagnose' ? 'warn' : 'bad'}">Fronts locked: no steering</span>`;
  else res += `<span class="chip ok">No lockup</span>`;
  $('#stopRes').innerHTML = res;
}
function runStop(animate = true) {
  if (S.play) cancelAnimationFrame(S.play.raf);
  const r = panic(S.c, { mu: SURF[S.surf], abs: S.abs });
  S.stop = Object.assign(r, { surf: S.surf, fault: S.c.fault });
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { S.play = null; S.playAbs = null; renderViews(); checkGoal(); return r; }
  const speed = r.time > 6 ? r.time / 6 : 1, t0 = performance.now();
  S.play = { i: 0 };
  const tick = () => {
    const tt = (performance.now() - t0) / 1000 * speed;
    S.play.i = Math.min(r.out.length - 1, Math.floor(tt / 0.01));
    S.playAbs = r.abs ? { LF: r.out[S.play.i].f } : null;
    drawStop(); drawSys(mNow());
    if (S.play.i < r.out.length - 1) S.play.raf = requestAnimationFrame(tick);
    else { S.play = null; S.playAbs = null; renderViews(); checkGoal(); }
  };
  S.play.raf = requestAnimationFrame(tick);
  return r;
}

function renderViews() { const m = mNow(); drawSys(m); drawMC(m); drawChain(m); drawGauge(m); drawStop(); }

  { body: '', ctl: ['effort', 'cal'], goal: { mc: { q: 'Bigger caliper piston, same pedal effort. What changed?', opts: ['More clamp force, but more pedal travel: it takes more fluid to move a bigger piston', 'Less clamp force', 'Higher line pressure'], a: 0, why: 'More area means more force but more fluid volume. The pedal has to push farther. Nothing in hydraulics is free.' } } },
] },
{ id: 'leverage', title: 'Pedal ratio and the booster', sub: 'Where the force comes from', steps: [
  { body: 'The pedal is a <b>lever</b>. A 4:1 ratio turns 40 lb at your foot into 160 lb at the pushrod. The <b>vacuum booster</b> then adds about 3× more, using engine vacuum on one side of a diaphragm and outside air on the other.', setup: { reset: true, effort: 40 } },
  { body: 'Turn the <b>engine off</b>. With no vacuum, the booster can\'t help.', ctl: ['engine', 'effort'], goal: { check: () => !S.c.engine, hint: 'Engine: Off.' } },
  { body: '', ctl: ['engine', 'effort'], goal: { mc: { q: 'Same 40 lb push with the engine off. What happened?', opts: ['Pressure and stopping power dropped to about a quarter: the pedal feels hard', 'Nothing changed', 'The pedal went to the floor'], a: 0, why: 'Without assist, only the lever force reaches the master cylinder. A hard pedal with normal travel points to the booster or its vacuum supply.' } } },
  { body: 'Still engine off. Raise the <b>pedal ratio to 6:1</b> or more.', ctl: ['ratio', 'effort'], goal: { check: () => S.c.ratio >= 6, hint: 'Pedal ratio 6.0 : 1 or higher.' } },
  { body: '', ctl: ['ratio', 'effort'], goal: { mc: { q: 'More leverage gives more pressure from the same foot. What did it cost?', opts: ['More pedal travel for the same amount of fluid moved', 'Nothing, the extra force is free', 'Lower line pressure'], a: 0, why: 'A lever trades travel for force. Cars without a booster use a high pedal ratio (and often a smaller bore), and live with a longer pedal.' } } },
] },
{ id: 'bore', title: 'Master cylinder bore', sub: 'Pressure vs. pedal travel', steps: [
  { body: 'The master cylinder bore sets how much pressure a given pushrod force makes: <b>psi = force ÷ area</b>.', setup: { reset: true, effort: 40 } },
  { body: 'Pick a <b>1 1/8 in</b> bore.', ctl: ['bore', 'effort'], goal: { check: () => Math.abs(S.c.bore - 1.125) < 1e-6, hint: 'MC bore: 1 1/8.' } },
  { body: '', ctl: ['bore', 'effort'], goal: { mc: { q: 'Bigger bore. What happened?', opts: ['Lower pressure (same force, more area) but a shorter pedal: each inch of stroke moves more fluid', 'Higher pressure', 'No change'], a: 0, why: 'A big bore gives a short, firm, hard-working pedal; a small bore gives more pressure and more travel.' } } },
  { body: 'Now pick a <b>3/4 in</b> bore.', ctl: ['bore', 'effort'], goal: { check: () => Math.abs(S.c.bore - 0.75) < 1e-6, hint: 'MC bore: 3/4.' } },
  { body: '', ctl: ['bore', 'effort'], goal: { mc: { q: 'Small bore. Why does a replacement master cylinder have to match the original bore size?', opts: ['The bore is engineered with the pedal ratio and booster; the wrong size changes pressure, pedal travel and brake balance', 'It only changes the color', 'Bore size doesn\'t matter if the outlets fit'], a: 0, why: 'Engineers balance pedal ratio, booster, bore and wheel piston sizes together. Always match the original part.' } } },

{ id: 'split', title: 'Split systems and the warning lamp', sub: 'Two circuits, so one leak can\'t take all the brakes', steps: [
  { body: 'A <b>tandem</b> master cylinder has two pistons feeding two separate circuits (A and B). If one circuit leaks, the other still stops the car.', setup: { reset: true, effort: 40, layout: 'fr' } },
  { body: 'A front brake line just ruptured: <b>circuit A (the front brakes on this car) is empty</b>. Look at the pedal, the gauges and the dash lamp.', setup: { reset: true, effort: 40, layout: 'fr', fault: 'leak', circuit: 'A' }, goal: { mc: { q: 'What does the driver notice?', opts: ['A lower pedal, the red BRAKE lamp, and much weaker stopping: only the rear brakes work', 'Nothing until all the fluid is gone', 'A harder pedal'], a: 0, why: 'The primary piston travels until it pushes the secondary piston directly. That costs pedal travel. The pressure-differential switch (and the level sensor) light the red BRAKE lamp.' } } },

  { body: '', ctl: ['layout', 'effort'], goal: { mc: { q: 'Why do most front-drive cars use a diagonal split?', opts: ['Each circuit keeps one front brake, and the fronts do most of the stopping, so half the system still stops reasonably well', 'It needs less brake line', 'Rear brakes do most of the stopping'], a: 0, why: 'Front-drive cars carry most of their weight up front. A diagonal split keeps one front brake on either circuit. The steering geometry (negative scrub radius) keeps the pull small.' } } },

{ id: 'prop', title: 'Proportioning and weight transfer', sub: 'Why the rear gets less pressure', steps: [
  { body: 'In a hard stop, weight shifts <b>forward</b>. The rear tires lose grip just when you need it. The <b>proportioning valve</b> limits rear pressure above its split point (450 psi on this car).', setup: { reset: true, effort: 30 } },

{ id: 'fluid', title: 'Brake fluid and fade', sub: 'Water lowers the boiling point', steps: [

function curStep() { return S.lesson ? S.lesson.steps[S.step] : null; }
function applySetup(su) {

}

function checkGoal() {

}
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets up the car, tells you what to change and watch, and checks your answer.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;

}

/* ================= notebook / modes ================= */
const TABS = { explore: [['ctl', 'Controls']], guided: [['les', 'Lessons']], diagnose: [['case', 'Case']] };
function renderPanel() {

  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');

function stopAnims() { if (S.play) cancelAnimationFrame(S.play.raf); S.play = null; S.playAbs = null; if (S.holdAnim) clearInterval(S.holdAnim); S.holdAnim = null; }
function setMode(m) {

}
let toastT;

function onAct(e) {

    case 'warm': c.warm = v === '1'; renderPanel(); changed(); break;
    case 'fault': setFault(v); renderPanel(); changed(); break;
    case 'side': c.side = v; renderPanel(); changed(); break;
    case 'circ': c.circuit = v; renderPanel(); changed(); break;
    case 'bleed': if (c.fault === 'air') c.fault = null; c.pumped = false; toast(c.hot && bp(c.water) < 330 ? 'Bled, but the fluid will boil again when hot. Flush it.' : 'Brakes bled: air removed.', 'good'); renderPanel(); changed(); break;
    case 'flush': c.water = 0.5; if (c.fault === 'boil') c.fault = null; if (c.fault === 'air') c.fault = null; toast('Fresh fluid: boiling point ' + bp(c.water) + ' °F.', 'good'); renderPanel(); changed(); break;
    case 'reset': S.c = BASEC(); S.hold = 0; renderPanel(); changed(); break;
    case 'test': runTest(v); break;
    case 'dx': S.dx.pick = v; S.dx.pside = null; S.dx.wrong = null; renderPanel(); break;
    case 'dxs': S.dx.pside = v; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('brakes.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#pbody').addEventListener('input', e => {

  const o = $('#o-' + k);
  if (o) o.textContent = k === 'effort' ? v + ' lb' : k === 'ratio' ? v.toFixed(1) + ' : 1' : k === 'cal' ? v.toFixed(3) + ' in' : k === 'water' ? v.toFixed(1) + ' %' : v;

  if (k === 'effort') { if (S.holdAnim) { clearInterval(S.holdAnim); S.holdAnim = null; } S.hold = 0; if (v === 0) c.pumped = false; }

});
$('#pbody').addEventListener('change', e => { if (e.target.dataset.c) renderPanel(); });

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Lab Scope</title>
<meta name="description" content="A virtual automotive lab scope. Set range, timebase and trigger yourself on known-good and faulty crank, cam, injector, ignition, CAN, O2, wheel speed and PWM waveforms, then diagnose mystery cases.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. The scope screen itself
   follows a common PC-scope layout: light graticule, blue Ch A, red Ch B, trigger bar at the bottom. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --chA:#4EA8FF; --chB:#FF6B6B; --chM:#3DDC97; --trg:#F5A400;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.35;cursor:not-allowed}
.seg.mini{padding:2px}.seg.mini button{padding:5px 7px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,400px);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
/* ---- scope ---- */
.tbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px}
.tbar.top{border-bottom:1px solid var(--line)}
.tbar.bot{border-top:1px solid var(--line)}
.lbl{font:600 10px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
select,.num{background:var(--raise);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:5px 6px;font:500 12px/1.1 var(--f-mono);height:28px}
.num{width:76px}
select:hover,.num:hover{border-color:#3a4a5c}
.runb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;font:700 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;background:#173a26;border:1px solid #2b6c50;color:#C9F7E2}
.runb.stopped{background:#3a1717;border-color:#7a2e2e;color:#FFD2CD}
.runb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chg{display:inline-flex;align-items:center;gap:5px;padding:2px 6px 2px 2px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);border-left:3px solid var(--c)}
.chon{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 12px/1 var(--f-label);background:var(--c);color:#06101a}
.chon[aria-pressed="false"]{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line-2)}
.chon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chg .pd{font:500 10.5px/1 var(--f-mono);color:var(--dim);min-width:52px}
.chg .seg,.tbar .seg{flex-wrap:nowrap}
.ovr{font:700 9px/1 var(--f-label);letter-spacing:.12em;color:#fff;background:var(--fail);padding:3px 5px;border-radius:5px}
.tog{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.tog i{width:10px;height:10px;border-radius:3px}
.tog[aria-pressed="true"]{color:var(--fg);border-color:#3a4a5c;background:#17222d}
.tog[aria-pressed="false"] i{opacity:.25}
.tog[disabled]{opacity:.35;cursor:not-allowed}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{flex:1}
.screen{flex:1;min-height:240px;position:relative;padding:8px 10px}
.screen canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:none}
.stat{padding:4px 8px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft);white-space:nowrap}
.stat.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}.stat.wait{border-color:rgba(255,178,36,.55);color:#FFE2A8}.stat.off{border-color:rgba(255,90,78,.5);color:#FFD2CD}
.pre{display:inline-flex;align-items:center;gap:6px}
.pre input{width:90px;accent-color:var(--trg)}
.pre output{font:500 11px/1 var(--f-mono);color:var(--soft);min-width:30px}
.meas{padding:0 10px 8px;overflow-x:auto}
.meas table{width:100%;border-collapse:collapse;font:500 11.5px/1.2 var(--f-mono);color:var(--soft)}
.meas th{font:600 9.5px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
.meas td{padding:4px 6px;text-align:right;border-bottom:1px solid #121a22;white-space:nowrap}
.meas th:first-child,.meas td:first-child{text-align:left}
.meas td i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* ---- notebook ---- */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.pbody ul{margin:0 0 8px;padding-left:18px}
.pbody li{margin:2px 0}
.dim{color:var(--dim);font-size:13px}
.sl{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:8px;align-items:center;margin:3px 0}
.sl label{font-size:12.5px;color:var(--dim)}
.sl output{font:500 12px/1 var(--f-mono);text-align:right;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.grp{font:700 9.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:8px 0 2px}
.conn{display:grid;gap:4px;margin:4px 0 8px}
.conn div{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:12.5px;color:var(--soft)}
.conn i{width:22px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 10.5px/1 var(--f-label);font-style:normal;color:#06101a}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.msg.warn{border-color:rgba(255,178,36,.45);color:#FFE2A8}
.msg ul{margin:4px 0 0;padding-left:18px}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:12px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.steps{display:grid;gap:4px;margin:10px 0 4px}
.steps div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.steps div i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 var(--f-label);background:var(--line-2);color:var(--fg);font-style:normal}
.steps div.done{color:#C9F7E2}.steps div.done i{background:var(--ok);color:#06140d}
.steps div.cur{color:var(--fg)}.steps div.cur i{background:var(--accent)}
table.tips{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
table.tips th{font:600 9.5px/1.15 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
table.tips td{padding:5px 3px;border-bottom:1px solid #151d26;color:var(--soft);vertical-align:top}
table.tips td:not(:first-child){font:500 11px/1.3 var(--f-mono)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .scope .screen{height:420px;flex:none}
  .main>.panel.nb{height:640px}
}
@media (max-width: 640px){ .scope .screen{height:300px;padding:6px} .brand p{display:none} .chg .pd{display:none} .tbar{padding:7px 8px} }
/* back to the tools hub (site root) */
.hublink{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);color:var(--soft);font:600 12px/1 var(--f-label);letter-spacing:.05em;text-decoration:none;white-space:nowrap;pointer-events:auto}
.hublink:hover{color:var(--fg);border-color:#3a4a5c}
.hublink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hublink{padding:0 8px}.hublink span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <a class="hublink" href="../" title="All STECH student tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>All tools</span></a>
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M5 14h3l1.5-5 2.5 8 2-6 1 3h4"/></svg></div>
      <div><h1>Virtual Lab Scope</h1><p>Range · timebase · trigger · waveforms</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="guided">Guided</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <section class="panel scope" aria-label="Lab scope">
      <div class="tbar top" id="tbTop">
        <button class="runb" id="runBtn" title="Run / stop the scope">■ Stop</button>
        <span class="lbl">Timebase</span><select id="tbSel" aria-label="Timebase (time per division)"></select>
        <span class="chg" id="chgA" style="--c:var(--chA)"><button class="chon" data-ch="A" aria-pressed="true" title="Channel A on/off">A</button><select data-ch="A" aria-label="Channel A range"></select><span class="pd" id="pdA"></span><span class="seg mini" data-ch="A" data-k="cpl" aria-label="Channel A coupling"><button data-v="DC">DC</button><button data-v="AC">AC</button></span><span class="seg mini" data-ch="A" data-k="z" aria-label="Channel A zero position"><button data-v="mid" title="Zero line in the center">Ctr</button><button data-v="low" title="Zero line near the bottom (more room for positive signals)">Low</button></span><span class="ovr" id="ovA" hidden>Over range</span></span>
        <span class="chg" id="chgB" style="--c:var(--chB)"><button class="chon" data-ch="B" aria-pressed="true" title="Channel B on/off">B</button><select data-ch="B" aria-label="Channel B range"></select><span class="pd" id="pdB"></span><span class="seg mini" data-ch="B" data-k="cpl" aria-label="Channel B coupling"><button data-v="DC">DC</button><button data-v="AC">AC</button></span><span class="seg mini" data-ch="B" data-k="z" aria-label="Channel B zero position"><button data-v="mid" title="Zero line in the center">Ctr</button><button data-v="low" title="Zero line near the bottom">Low</button></span><span class="ovr" id="ovB" hidden>Over range</span></span>
        <span class="sp"></span>
        <button class="tog" id="mathBtn" aria-pressed="false" title="Math channel: A minus B"><i style="background:var(--chM)"></i>A − B</button>
        <button class="tog" id="rulBtn" aria-pressed="false" title="Time and signal rulers"><i style="background:#C5CFD9"></i>Rulers</button>
        <button class="tog" id="scrBtn" aria-pressed="true" title="Light or dark screen"><i style="background:#fff"></i>Light</button>
      </div>
      <div class="screen" id="screenBox"><canvas id="cv" role="img" aria-label="Scope screen"></canvas></div>
      <div class="tbar bot" id="tbBot">
        <span class="lbl">Trigger</span>
        <span class="seg mini" id="trMode" aria-label="Trigger mode"><button data-v="none">None</button><button data-v="auto">Auto</button><button data-v="repeat">Repeat</button><button data-v="single">Single</button></span>
        <span class="seg mini" id="trSrc" aria-label="Trigger source"><button data-v="A">Ch A</button><button data-v="B">Ch B</button></span>
        <span class="seg mini" id="trEdge" aria-label="Trigger edge"><button data-v="rise" title="Rising edge">↑ Rise</button><button data-v="fall" title="Falling edge">↓ Fall</button></span>
        <span class="pre"><span class="lbl">Level</span><input class="num" id="trLvl" type="number" step="any" aria-label="Trigger level"><span class="dim" id="trUnit" style="font-size:12px">V</span></span>
        <span class="pre"><span class="lbl">Pre</span><input type="range" id="trPre" min="0" max="90" step="5" aria-label="Pre-trigger percent"><output id="trPreO">10%</output></span>
        <span class="sp"></span>
        <span class="stat" id="trStat">—</span>
      </div>
      <div class="meas" id="meas"></div>
    </section>
    <section class="panel nb" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const TAU = Math.PI * 2;
const gauss = (x, m, s) => Math.exp(-0.5 * ((x - m) / s) ** 2);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const trim = n => (Math.abs(n) < 1e-12 ? '0' : String(+n.toPrecision(3)));
function fmtT(s) { const a = Math.abs(s); if (a < 0.9995e-3) return trim(s * 1e6) + ' µs'; if (a < 0.9995) return trim(s * 1e3) + ' ms'; return trim(s) + ' s'; }
function fmtU(v, u) { const a = Math.abs(v); if (u === 'V' && a < 1 && a > 0) return trim(v * 1e3) + ' mV'; if (u === 'A' && a < 1 && a > 0) return trim(v * 1e3) + ' mA'; return trim(v) + ' ' + u; }
const fmtHz = f => f >= 1000 ? trim(f / 1000) + ' kHz' : trim(f) + ' Hz';
const fmtR = (R, u) => '±' + fmtU(R, u);

/* ================= scope hardware (generic 2-channel PC scope) ================= */
const TBS = [1e-6, 2e-6, 5e-6, 1e-5, 2e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3, 2e-3, 5e-3, 1e-2, 2e-2, 5e-2, 0.1, 0.2, 0.5, 1, 2, 5];
const RANGES = { V: [0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500], A: [0.5, 1, 2, 5, 10, 20], kV: [5, 10, 20, 50] };
const visR = (R, z) => z === 'low' ? { lo: -R / 5, hi: 9 * R / 5 } : { lo: -R, hi: R };   // 10 vertical divisions

/* ================= engine / vehicle operating points ================= */
const RPM = {
  crank: { n: 'Cranking', rpm: 250, bp: 10.4, jit: 4, pw: 5.5e-3, dw: 4.0e-3 },
  idle:  { n: 'Idle', rpm: 750, bp: 14.2, jit: 0.4, pw: 2.9e-3, dw: 3.0e-3 },
  rev:   { n: '2500 rpm', rpm: 2500, bp: 14.3, jit: 0.1, pw: 3.6e-3, dw: 2.6e-3 },
};
const theta = (t, E) => E.w * t + E.jit * Math.sin(TAU * E.f2 * t);   // crank degrees (small speed ripple at firing frequency)

/* ================= CAN frames (500 kbps, 11-bit, stuffed) ================= */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canFrame(r, id) {
  const bits = [0], push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  const dlc = 2 + Math.floor(r() * 7);
  push(id ?? Math.floor(r() * 0x7FF), 11); bits.push(0, 0, 0); push(dlc, 4);
  for (let i = 0; i < dlc * 8; i++) bits.push(r() < 0.5 ? 1 : 0);
  for (let i = 0; i < 15; i++) bits.push(r() < 0.5 ? 1 : 0);
  const out = []; let run = 0, last = -1;
  for (const b of bits) { out.push(b); if (b === last) run++; else { run = 1; last = b; } if (run === 5) { out.push(1 - b); last = 1 - b; run = 1; } }
  out.push(1, 0, 1, 1, 1, 1, 1, 1, 1, 1);   // CRC delimiter, ACK slot (dominant), ACK delimiter, EOF
  return out;
}
const CANB = 2e-6;
const CAN = (() => { const r = rng(11); const frames = []; for (let i = 0; i < 12; i++) frames.push(canFrame(r)); return { frames, slot: 0.5e-3 }; })();
const BAB = (() => { const f = canFrame(rng(7), 0x010); return { frames: [f], slot: (f.length + 3) * CANB }; })();
function canState(t, bus) {
  const k = Math.floor(t / bus.slot), loc = t - k * bus.slot, Fr = bus.frames[mod(k, bus.frames.length)], x = loc / CANB, bi = Math.floor(x);
  const cur = bi < Fr.length ? Fr[bi] : 1, prv = bi >= 1 && bi - 1 < Fr.length ? Fr[bi - 1] : 1;
  return [cur === 0 ? 1 : 0, prv === 0 ? 1 : 0, (x - bi) * CANB];   // dominant now, dominant before, time since bit start
}

/* ================= ignition fault table ================= */
const IGN = {
  good:    { vpk: 340, vsl: 38, kpk: 10, ksl: 1.5, ds: 1.5e-3, osc: 1, slope: -0.15 },
  gap:     { vpk: 440, vsl: 58, kpk: 18, ksl: 2.6, ds: 0.95e-3, osc: 1, slope: -0.1 },
  fouled:  { vpk: 190, vsl: 28, kpk: 4.2, ksl: 0.9, ds: 2.2e-3, osc: 0.6, slope: -0.1 },
  open:    { vpk: 470, vsl: 85, kpk: 27, ksl: 4.2, ds: 0.35e-3, osc: 1.6, slope: 0 },
  shorted: { vpk: 210, vsl: 30, kpk: 6, ksl: 1.1, ds: 1.1e-3, osc: 0, slope: -0.1 },
  lean:    { vpk: 370, vsl: 42, kpk: 13, ksl: 1.5, ds: 1.25e-3, osc: 1, slope: 0.6 },
};

/* ================= signal library =================
   f(t, E, F, O) writes the clean channel values at stream time t into O[0], O[1] (channel units).
   Generic teaching waveforms; real values vary by make, model and sensor. */
const PRE = {
ckpMag: { name: 'Crank sensor: magnetic', group: 'Engine', op: 'rpm', icon: 'CKP',
  chs: [{ n: 'CKP signal', u: 'V', z: 'mid', probe: 'Back-probe the CKP signal wire at the sensor. Ground lead on engine ground.' }],
  about: 'A magnetic (variable-reluctance) sensor makes its own AC voltage as the reluctor teeth pass. This wheel has 36 teeth with one missing; the missing tooth tells the ECM where the crankshaft is.',
  good: ['An AC wave: one cycle per tooth, every tooth the same height.', 'A bigger, wider swing once per revolution, at the missing tooth.', 'Amplitude grows with speed: about 1 V peak cranking, 3 V at idle, 10 V at 2500 rpm.'],
  f(t, E, F, O) {
    const th = theta(t, E), p = mod(th, 360); let amp = E.rpm / 250; if (F === 'weak') amp *= 0.22;
    let v = 0;
    if (F !== 'open') {
      if (p >= 340) v = 1.6 * amp * Math.sin(TAU * (p - 340) / 20);
      else { v = amp * Math.sin(TAU * mod(p, 10) / 10); if (F === 'tooth' && Math.floor(p / 10) === 12) v *= 0.4; }
      if (F === 'reversed') v = -v;
      if (F === 'emi') { const q = mod(th, 180); if (q < 1.5) { const s = q / 0.3; v += 1.1 * Math.exp(-s) * Math.cos(5 * s); } }
    }
    O[0] = v;
  },
  nz: [0.03], needTrig: true, allowAC: true,
  period: E => 60 / E.rpm, tStep: E => 10 / E.w / 40, trigMod: E => 60 / E.rpm, span: E => 120 / E.rpm, tb: E => [60 / E.rpm, 300 / E.rpm],
  trigHint: 'It fires on every tooth, so the gap lands somewhere new each sweep. Raise the trigger level above the normal teeth but below the bigger swing at the missing tooth, so it fires once per revolution.',
  rec: (E, F) => ({ tr: { src: 'A', edge: 'rise', lvl: +(1.3 * E.rpm / 250 * (F === 'weak' ? 0.22 : 1)).toFixed(2), pre: 0.1 } }),
  faults: {
    weak: { n: 'Weak signal (excessive air gap)', rpm: 'crank', concern: 'Long crank before it starts, worse when hot. Sometimes it won’t start at all. Runs fine once it’s going.', dtc: 'P0335 Crankshaft position sensor A circuit (intermittent)', see: 'Same pattern and gap, but only about a quarter of the normal voltage. At cranking speed the ECM may not see it. Check the air gap, sensor seating and for debris on the tip.' },
    tooth: { n: 'Damaged reluctor tooth', concern: 'Random misfire codes and a slight stumble at idle.', dtc: 'P0300 Random/multiple cylinder misfire', see: 'One tooth (always the same one, the 12th after the gap) is much smaller than the rest. The ECM sees a speed glitch it reads as a misfire.' },
    reversed: { n: 'Sensor wires reversed (polarity)', concern: 'After a CKP sensor was replaced with a spliced connector, the engine feels down on power and timing looks wrong on the scan tool.', dtc: 'None stored (timing reads wrong)', see: 'The whole signal is upside down: at the gap it swings negative first. The ECM times off the wrong edge, so ignition timing is off.' },
    emi: { n: 'Ignition interference (wiring routed by the coils)', concern: 'Random stumble or stall at idle since recent engine work. Codes come and go.', dtc: 'P0336 Crankshaft position sensor A range/performance', see: 'Sharp spikes twice per revolution, right at the firing points: noise from the ignition coupling into the sensor wires. Reroute the harness away from the coils and check the shield.' },
    open: { n: 'Open circuit (sensor or wire)', rpm: 'crank', concern: 'Cranks, no start. The tach doesn’t move while cranking.', dtc: 'P0335 Crankshaft position sensor A circuit', see: 'A flat line at 0 V while the engine turns: no signal at all. Measure sensor resistance and check the wiring for an open.' },
  } },

ckpCmp: { name: 'Crank + cam sensors: Hall', group: 'Engine', op: 'rpm', icon: 'CMP',
  chs: [{ n: 'CKP signal (60-2)', u: 'V', z: 'low', probe: 'Ch A back-probes the CKP signal wire.' }, { n: 'CMP signal', u: 'V', z: 'mid', probe: 'Ch B back-probes the CMP (cam) signal wire.' }],
  about: 'Hall-effect sensors switch a 5 V signal on and off. The crank wheel has 60 teeth with 2 missing (one gap per revolution). The cam turns once per engine cycle (two crank turns), so its single pulse tells the ECM which revolution is the compression stroke.',
  good: ['Both signals: clean square waves between about 0 V and 5 V.', 'Crank: a long low spot (the two missing teeth) once per revolution.', 'Cam: one pulse every two crank revolutions, always in the same place relative to the crank gap.'],
  f(t, E, F, O) {
    const th = theta(t, E), p = mod(th, 360), idx = Math.floor(p / 6), hi = 4.85, lo = F === 'lowref' ? 1.15 : 0.15;
    let a = idx >= 58 ? lo : (mod(p, 6) < 3 ? hi : lo);
    if (F === 'dropout' && mod(Math.floor(th / 360), 3) === 1 && idx >= 20 && idx < 30) a = lo;
    const c = mod(th - (F === 'camtime' ? 18 : 0), 720);
    O[0] = a; O[1] = F === 'cmpdead' ? 4.92 : (c >= 60 && c < 150 ? 4.85 : 0.15);
  },
  nz: [0.02, 0.02], needTrig: true, allowAC: false,
  period: E => 120 / E.rpm, tStep: E => 1 / E.w, trigMod: E => 120 / E.rpm, span: E => 480 / E.rpm, tb: E => [120 / E.rpm, 480 / E.rpm],
  trigHint: 'Triggering on the crank teeth fires 58 times per revolution, so the cam pulse jumps around. Trigger on the cam signal (Ch B): it happens once per cycle.',
  rec: () => ({ tr: { src: 'B', edge: 'rise', lvl: 2.5, pre: 0.2 } }),
  faults: {
    camtime: { n: 'Cam timing off (chain jumped a tooth)', concern: 'Rough idle and low power. The timing chain rattled on cold starts for months.', dtc: 'P0016 Crankshaft/camshaft position correlation (bank 1, sensor A)', see: 'Both signals look healthy, but the cam pulse starts about 3 crank teeth later, relative to the crank gap, than on a good engine. The parts they read have moved relative to each other.' },
    cmpdead: { n: 'Cam sensor failed (no pulses)', concern: 'Long crank before it starts. Check engine light on.', dtc: 'P0340 Camshaft position sensor A circuit', see: 'The crank signal is fine. The cam channel sits flat at about 5 V (the pull-up voltage) with no pulses at all.' },
    lowref: { n: 'Poor sensor ground (high resistance)', concern: 'Stalls now and then once warm. Restarts after it cools down.', dtc: 'P0336 Crankshaft position sensor A range/performance', see: 'The crank signal’s low level only drops to about 1.1 V instead of near 0 V. Do a voltage-drop test on the sensor ground.' },
    dropout: { n: 'Intermittent dropout (chafed wire)', concern: 'The engine cuts out for a split second at random. The tach drops to zero for a moment.', dtc: 'P0335 / P0336 (intermittent)', see: 'Every few revolutions, about 10 crank pulses go missing, which looks like a second gap. Wiggle-test the harness while watching the scope.' },
  } },

injector: { name: 'Fuel injector: voltage + current', group: 'Engine', op: 'rpm', icon: 'INJ',
  chs: [{ n: 'Injector control pin', u: 'V', z: 'low', probe: 'Ch A back-probes the injector control (ECM) wire.' }, { n: 'Injector current', u: 'A', z: 'low', probe: 'Ch B: low-amp current clamp around the injector control wire.' }],
  about: 'The injector gets battery voltage all the time. The ECM grounds the other side (a low-side driver) to open it. Voltage shows when and how long; current shows that the coil and valve really worked.',
  good: ['Rest at battery voltage (about 14 V running).', 'Drops to near 0 V for the pulse width (about 2.9 ms at idle).', 'A flat-topped spike (about 60 V, the ECM clamp) at turn-off, then a small bump as the valve closes.', 'Current ramps up to about 1 A, with a small dip near 1 ms: the pintle opening.'],
  f(t, E, F, O) {
    const P = 120 / E.rpm, x = mod(t, P), pw = E.pw, bp = E.bp;
    if (F === 'open') { O[0] = 0; O[1] = 0; return; }
    let R = 13, L = 0.013, hump = 1, von = 0.25;
    if (F === 'shorted') { R = 4; L = 0.007; hump = 0; } else if (F === 'feedres') { R = 33; hump = 0.5; } else if (F === 'sticky') hump = 0; else if (F === 'gnd') { von = 2.6; R = 15.5; }
    const Im = (bp - von) / R, tau = L / R;
    const iAt = s => Im * (1 - Math.exp(-s / tau)) - hump * 0.09 * Im * gauss(s, 0.95e-3, 0.12e-3);
    if (x < pw) { const i = iAt(x); O[0] = von + 0.04 * i; O[1] = i; return; }
    const y = x - pw, Ie = iAt(pw), pk = Math.min(62, 18 + 48 * Ie), tc = 0.13e-3 * Math.min(3, Ie / 0.95) * (L / 0.013);
    O[0] = (y < tc ? pk : bp + (pk - bp) * Math.exp(-(y - tc) / 40e-6)) + hump * 1.4 * gauss(y, 0.8e-3 + tc, 0.11e-3);
    O[1] = Ie * Math.max(0, 1 - y / Math.max(tc, 30e-6));
  },
  nz: [0.06, 0.008], needTrig: true, allowAC: false,
  period: E => 120 / E.rpm, tStep: () => 20e-6, trigMod: E => 120 / E.rpm, span: E => 120 / E.rpm, tb: E => [E.pw + 2e-3, 25e-3],
  trigHint: 'Trigger on the moment the driver turns on: Ch A, falling edge, with the level between the on-voltage and battery voltage (about 7 V).',
  rec: () => ({ tb: 1e-3, tr: { src: 'A', edge: 'fall', lvl: 7, pre: 0.1 } }),
  faults: {
    shorted: { n: 'Shorted injector winding (low resistance)', concern: 'Misfire on cylinder 1 and a rough idle.', dtc: 'P0301 Cylinder 1 misfire, P0201 Injector 1 circuit', see: 'Current climbs to about 3 A instead of about 1 A, and there’s no pintle hump. An ohmmeter reads about 4 Ω (spec 12–16 Ω).' },
    open: { n: 'Open injector winding', concern: 'A dead miss on cylinder 1.', dtc: 'P0201 Injector 1 circuit, P0301', see: 'Flat at 0 V: no battery voltage gets through the open coil to the control pin, so the ECM has nothing to switch. Current stays at zero.' },
    sticky: { n: 'Injector stuck closed (mechanical)', concern: 'Cylinder 1 misfire, but no injector circuit code.', dtc: 'P0301 Cylinder 1 misfire (no circuit code)', see: 'Electrically normal, but there’s no pintle hump in the current and no closing bump after the spike: the valve isn’t moving.' },
    feedres: { n: 'High resistance in the injector feed', concern: 'Lean misfire on cylinder 1, worse under load.', dtc: 'P0301, P0171 System too lean', see: 'Current only reaches about 0.4 A and levels off early, and the turn-off spike is smaller. Rest voltage still reads B+ because no current flows then. A voltage-drop test with the injector pulsing finds the corroded connector.' },
    gnd: { n: 'ECM driver ground fault (high on-voltage)', concern: 'Lean codes and rough running. All cylinders look about the same.', dtc: 'P0171 / P0174 System too lean', see: 'When the driver turns on, the pin only drops to about 2.6 V instead of near 0 V. Voltage-drop test the ECM grounds.' },
  } },

ignition: { name: 'Ignition: primary + secondary', group: 'Engine', op: 'rpm', icon: 'IGN',
  chs: [{ n: 'Coil primary (10:1 probe)', u: 'V', z: 'mid', probe: 'Ch A: coil primary control wire, through a 10:1 attenuator (the spikes reach hundreds of volts).' }, { n: 'Secondary (kV probe)', u: 'kV', z: 'low', probe: 'Ch B: capacitive secondary pickup on the coil (reads kilovolts).' }],
  about: 'The ECM (or igniter) grounds the coil primary to build a magnetic field (dwell). When it lets go, the field collapses and the secondary jumps to thousands of volts to fire the plug. The secondary picture is the classic ignition pattern.',
  good: ['Primary: battery voltage, then about 1 V during dwell (about 3 ms), then a spike of about 340 V when it fires.', 'Secondary: a firing line of about 10 kV, then a fairly flat spark line about 1.5 kV high and 1.5 ms long.', 'After the spark: 3 to 5 coil oscillations (a healthy coil rings).'],
  f(t, E, F, O) {
    const P = 120 / E.rpm, x = mod(t, P), d = E.dw, bp = E.bp, K = IGN[F] || IGN.good;
    if (x < d) { O[0] = 0.8 + 0.9 * x / d; O[1] = -0.9 * Math.exp(-x / 0.12e-3) * Math.cos(TAU * 6000 * x) - 0.12; return; }
    const y = x - d;
    if (y < K.ds) {
      const g = 1 + K.slope * y / K.ds, sl = K.vsl * g, ks = K.ksl * g;
      O[0] = sl + (K.vpk - sl) * Math.exp(-y / 22e-6) + 1.5 * Math.sin(TAU * 7000 * y);
      O[1] = ks + (K.kpk - ks) * Math.exp(-y / 16e-6) + 0.06 * Math.sin(TAU * 11000 * y);
      return;
    }
    const z = y - K.ds, e = Math.exp(-z / 0.3e-3) * Math.cos(TAU * 3500 * z);
    O[0] = bp + K.osc * 45 * e; O[1] = -K.osc * 1.3 * e;
  },
  nz: [1.2, 0.05], needTrig: true, allowAC: false,
  period: E => 120 / E.rpm, tStep: () => 4e-6, trigMod: E => 120 / E.rpm, span: E => 120 / E.rpm, tb: E => [E.dw + 2.5e-3, 25e-3],
  trigHint: 'Trigger on the firing line: Ch B, rising edge, with the level above the coil oscillations (about 3 kV). Give it some pre-trigger so the dwell shows too.',
  rec: () => ({ tb: 1e-3, tr: { src: 'B', edge: 'rise', lvl: 3, pre: 0.45 } }),
  faults: {
    gap: { n: 'Worn spark plug (wide gap)', concern: 'Misfire on cylinder 1 under hard acceleration.', dtc: 'P0301 Cylinder 1 misfire', see: 'Firing line about 18 kV (normal is about 10) and a short spark line (about 1 ms): it takes more voltage to jump the worn gap, leaving less energy for the spark.' },
    fouled: { n: 'Fouled spark plug', concern: 'Misfire on cylinder 1 at idle. The engine uses some oil.', dtc: 'P0301 Cylinder 1 misfire', see: 'Low firing line (about 4 kV) and a long, low spark line: current leaks across the deposits instead of jumping the gap.' },
    open: { n: 'Open / high resistance in the coil boot', concern: 'Misfire on cylinder 1, worse in damp weather. The coil boot looks burned.', dtc: 'P0301 Cylinder 1 misfire', see: 'Very tall firing line (about 27 kV) and almost no spark line: the spark can’t get through to the plug.' },
    shorted: { n: 'Coil with shorted windings', concern: 'Misfire on cylinder 1 that gets worse as the engine warms up.', dtc: 'P0351 Ignition coil A primary/secondary, P0301', see: 'Low firing line and NO coil oscillations after the spark line. A healthy coil rings 3 to 5 times.' },
    lean: { n: 'Lean cylinder (restricted injector)', concern: 'Slight stumble. Cylinder 1 runs lean.', dtc: 'P0301 (intermittent), P0171', see: 'The spark line slopes upward and the firing line is a little taller: a lean mixture is harder to ionize.' },
  } },

can: { name: 'CAN bus: H + L', group: 'Network', op: null, icon: 'CAN',
  chs: [{ n: 'CAN H (DLC pin 6)', u: 'V', z: 'mid', probe: 'Ch A on DLC pin 6 (CAN H) with a breakout box. Ground lead on DLC pin 4/5.' }, { n: 'CAN L (DLC pin 14)', u: 'V', z: 'mid', probe: 'Ch B on DLC pin 14 (CAN L).' }],
  about: 'High-speed CAN uses two wires that move in opposite directions. Modules read the difference between them, which is why noise that hits both wires equally doesn’t matter. 500 kbps means each bit lasts 2 µs.',
  good: ['Idle (recessive): both wires at about 2.5 V.', 'Dominant bits: CAN H up to about 3.5 V, CAN L down to about 1.5 V, mirror images.', 'Messages (frames) with short quiet gaps between them. Clean, square edges.'],
  f(t, E, F, O) {
    if (F === 'babble') { const [d] = canState(t, BAB); O[0] = 2.5 + d; O[1] = 2.5 - d; return; }
    const [d, dp, ts] = canState(t, CAN);
    let m = d !== dp && ts < 0.12e-6 ? dp + (d - dp) * ts / 0.12e-6 : d;
    if (F === 'term') {
      let ring = 0; m = d;
      if (d !== dp) { ring = 0.4 * Math.exp(-ts / 0.25e-6) * Math.sin(TAU * ts / 0.2e-6) * (d > dp ? 1 : -1); if (d < dp) m = Math.exp(-ts / 0.35e-6); else m = ts < 0.12e-6 ? ts / 0.12e-6 : 1; }
      O[0] = 2.5 + 1.25 * m + ring; O[1] = 2.5 - 1.25 * m - ring; return;
    }
    if (F === 'shortHL') { O[0] = O[1] = 2.5 - 0.06 * m; return; }
    if (F === 'hgnd') { O[0] = 0.02; O[1] = 0.25 + 0.03 * m; return; }
    let n = 0; if (F === 'noise') n = 0.5 * Math.sin(TAU * 230e3 * t) + 0.3 * Math.sin(TAU * 910e3 * t + 1);
    O[0] = 2.5 + m + n; O[1] = 2.5 - m + n;
  },
  nz: [0.02, 0.02], needTrig: true, allowAC: false,
  period: () => 1e-3, tStep: () => 0.4e-6, trigMod: () => 0, span: () => CAN.slot * CAN.frames.length, tb: () => [50e-6, 500e-6],
  trigHint: 'Trigger on Ch A rising at about 3 V (the start of a dominant bit).',
  rec: () => ({ tb: 2e-5, tr: { src: 'A', edge: 'rise', lvl: 3, pre: 0.1 } }),
  faults: {
    term: { n: 'Open terminating resistor', concern: 'Intermittent communication codes from several modules. Gauges glitch now and then.', dtc: 'U0100 / U0121 Lost communication (intermittent)', see: 'Slightly taller signals with ringing on every edge (reflections). Key off, DLC pins 6–14 read about 120 Ω instead of 60 Ω.' },
    shortHL: { n: 'CAN H shorted to CAN L', concern: 'The scan tool can’t talk to anything. Lots of warning lights.', dtc: 'No communication (bus off)', see: 'Both lines sit at about 2.5 V and look identical: no difference between them, so no messages. Pins 6–14 read near 0 Ω.' },
    hgnd: { n: 'CAN H shorted to ground', concern: 'No start, no communication, dash lit up like a Christmas tree.', dtc: 'No communication (bus off)', see: 'CAN H is flat at 0 V and CAN L is pulled down near 0 V too. Unplug modules (or open bus splices) one at a time to find the short.' },
    noise: { n: 'Common-mode noise (untwisted repair)', concern: 'Intermittent communication codes since a remote starter was installed.', dtc: 'U0140 Lost communication with body control module (intermittent)', see: 'Both lines carry the same noise. Math A − B is still clean, which is why CAN tolerates it, but the untwisted splice should be fixed before it gets worse.' },
    babble: { n: 'Babbling module (bus flooded)', concern: 'Battery dies overnight. Modules never go to sleep and the scan tool is slow.', dtc: 'Various U-codes, high bus load', see: 'No quiet gaps between frames: one module transmits nonstop. Unplug modules one at a time until the bus goes quiet.' },
  } },

o2: { name: 'O2 sensors: upstream + downstream', group: 'Emissions', op: null, icon: 'O2',
  chs: [{ n: 'Upstream O2 (B1S1)', u: 'V', z: 'low', probe: 'Ch A back-probes the upstream (before the catalyst) O2 signal wire.' }, { n: 'Downstream O2 (B1S2)', u: 'V', z: 'low', probe: 'Ch B back-probes the downstream (after the catalyst) O2 signal wire.' }],

function tipsHTML() {
  let h = `<h3>Setting up a scope</h3>
  <p><b>1. Range (volts):</b> make the biggest part of the signal as tall as you can without running off the screen. Start big, then go smaller. “Over range” means part of the signal is cut off. The screen is 10 divisions tall, so ±5 V is 1 V per division.</p>
  <p><b>2. Zero:</b> Ctr puts 0 V in the middle. Low puts it one division from the bottom, which gives positive-only signals (most sensors) nearly the whole screen.</p>
  <p><b>3. Timebase:</b> screen time = 10 × time/div. Show one to a few events. Too fast and you only see a slice; too slow and the detail squashes together.</p>
  <p><b>4. Trigger:</b> the scope starts drawing when the signal crosses the <b>level</b> in the chosen <b>direction</b> on the <b>source</b> channel. That’s what makes the picture hold still. Pick an edge that happens once per event.</p>
  <ul><li><b>Repeat:</b> redraws every time it triggers (the normal setting).</li><li><b>Auto:</b> like Repeat, but free-runs if nothing triggers. Use it to find out if there’s any signal at all.</li><li><b>Single:</b> grabs one capture and stops. Use it for one-off glitches.</li><li><b>None:</b> no trigger. At 100 ms/div or slower it rolls like a chart recorder (O2 sensors).</li></ul>
  <p><b>5. Coupling:</b> almost always DC in automotive work. AC removes the DC level; use it only for AC sensors or small ripple on top of a big DC voltage.</p>
  <p><b>6. Rulers and measurements:</b> drag the dashed rulers to measure time (pulse width, period) and voltage. The table under the screen measures each channel automatically.</p>
  <h4>Starting points (idle, known good)</h4><table class="tips"><tr><th>Signal</th><th>Ranges</th><th>Time/div</th><th>Trigger</th></tr>`;
  for (const [k, P] of Object.entries(PRE)) {

  }

}

/* ================= diagnose ================= */
const CASE_POOL = Object.entries(PRE).flatMap(([pk, P]) => Object.keys(P.faults).map(f => pk + ':' + f));
/* Shuffle bag: every case comes up once per round, in a random order, before any repeat.
   A case counts once it's solved. A new round reshuffles and never opens with the case that closed
   the last one. Saved per browser. */
const BAG_KEY = 'scope-dx-bag-v1';
let BAG = null;
try { BAG = JSON.parse(store.get(BAG_KEY)); } catch (e) {}
if (!(BAG && Array.isArray(BAG.order) && BAG.order.length === CASE_POOL.length && CASE_POOL.every(t => BAG.order.includes(t)) && BAG.res && BAG.i >= 0)) BAG = { order: shuffled(CASE_POOL), i: 0, round: 1, res: {} };
const saveBag = () => store.set(BAG_KEY, JSON.stringify(BAG));
function shuffled(ids, avoidFirst) {
  const a = ids.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (avoidFirst && a.length > 1 && a[0] === avoidFirst) { const j = 1 + Math.floor(Math.random() * (a.length - 1)); [a[0], a[j]] = [a[j], a[0]]; }
  return a;
}
function bagNext() {
  if (BAG.i >= BAG.order.length) BAG = { order: shuffled(CASE_POOL, BAG.order[BAG.order.length - 1]), i: 0, round: BAG.round + 1, res: {} };
  saveBag(); return BAG.order[BAG.i];
}
function bagSolved(type, tries) { if (BAG.order[BAG.i] === type && !BAG.res[type]) { BAG.res[type] = tries; BAG.i++; saveBag(); } }
function bagHTML() {
  const n = BAG.order.length, first = Object.values(BAG.res).filter(r => r === 1).length;
  return `<div class="mprog"><span>Round ${BAG.round} · ${BAG.i} of ${n} cases solved</span><div class="mdots" aria-label="Round progress">${BAG.order.map((t, k) => {
    const r = BAG.res[t];
    return `<i class="${r ? (r === 1 ? 'r' : 't') : k === BAG.i ? 'cur' : ''}" title="Case ${k + 1} of ${n}${r ? (r === 1 ? ': correct, first try' : `: correct in ${r} tries`) : ''}"></i>`;
  }).join('')}</div></div>${BAG.i >= n ? `<div class="msg ok" style="margin-top:8px"><b>Set complete!</b> You’ve solved all ${n} cases once. Correct on the first try: ${first} of ${n}. The next round uses a new shuffled order.</div>` : ''}`;
}
function scramble() {
  const P = P_(), E = S.E, ops = ['tb'], extra = [Math.random() < 0.5 ? 'rSmall' : 'rBig'];
  if (P.needTrig) extra.push(Math.random() < 0.5 ? 'tNone' : 'tLvl');
  if (!P.allowAC) extra.push('ac');
  if (nCh() > 1) extra.push('bOff');
  ops.push(...shuffled(extra).slice(0, Math.random() < 0.5 ? 1 : 2));
  const [mn, mx] = P.tb(E), i0 = TBS.indexOf(S.tb);
  for (const o of ops) {
    if (o === 'tb') { const bad = TBS.map((t, i) => i).filter(i => (10 * TBS[i] < mn || 10 * TBS[i] > mx) && Math.abs(i - i0) >= 3 && Math.abs(i - i0) <= 6); const pool = bad.length ? bad : TBS.map((t, i) => i).filter(i => 10 * TBS[i] < mn || 10 * TBS[i] > mx); S.tb = TBS[pool[Math.floor(Math.random() * pool.length)]]; }
    else if (o === 'rSmall' || o === 'rBig') { const u = unitOf('A'), L = RANGES[u], j = L.indexOf(S.sc.A.r); S.sc.A.r = L[clamp(j + (o === 'rSmall' ? -3 : 3), 0, L.length - 1)]; }
    else if (o === 'tNone') S.tr.mode = 'none';
    else if (o === 'tLvl') { const si = chI(S.tr.src), g = ENVG[si]; S.tr.lvl = +(g.max + 0.35 * (g.max - g.min)).toPrecision(3); S.tr.mode = Math.random() < 0.5 ? 'auto' : 'repeat'; }
    else if (o === 'ac') S.sc.A.cpl = 'AC';

}
function newCase() {

  const r = computeRec(pk, F, S.rpmKey); S.sc = r.sc; S.tb = r.tb; S.tr = r.tr; S.math = false; S.rul.on = false;

}
function checkSetup() {

}

function caseHTML() {

  if (!d.setupOk) {

}

{ id: 'o2', title: 'O2 sensors and the catalyst', sub: 'Slow signals, roll mode', steps: [
  { body: '', setup: { p: 'o2' }, goal: { mc: { q: 'Blue is the upstream O2 sensor at 2500 rpm, switching between about 0.1 V and 0.9 V roughly once per second. What does that mean?', opts: ['Closed-loop fuel control is working: the ECM keeps nudging the mixture rich, then lean', 'The sensor is bad', 'The engine runs rich'], a: 0, why: 'Above 0.45 V means rich; below means lean. Fast, full-height switching is a healthy sensor.' } } },
  { body: '', goal: { mc: { q: 'Red, the downstream sensor, stays steady around 0.6–0.7 V. Why?', opts: ['The catalyst stores oxygen and evens out the exhaust: a sign it’s working', 'The sensor is dead', 'It’s unplugged'], a: 0, why: 'A working catalyst smooths the switching out.' } } },
  { body: 'Break it: set the condition to <b>Failed catalytic converter</b>.', ctl: ['cond'], conds: ['good', 'cat'], goal: { check: () => S.F === 'cat', hint: 'Condition: Failed catalytic converter.' } },
  { body: '', ctl: ['cond'], conds: ['good', 'cat'], goal: { mc: { q: 'What happened?', opts: ['The downstream sensor now copies the upstream switching: the catalyst can’t store oxygen anymore (P0420)', 'The upstream sensor stopped switching', 'Nothing'], a: 0, why: 'This is how the ECM grades the catalyst: it compares downstream activity to upstream activity.' } } },
  { body: 'Set the timebase to <b>1 ms/div</b>.', goal: { check: () => S.tb <= 1e-2, hint: 'Timebase 10 ms/div or faster.' } },
  { body: '', goal: { mc: { q: 'Why is this setting useless here?', opts: ['The O2 signal changes about once per second, so 10 ms of it is just a flat slice. Match the timebase to how fast the signal changes', 'The range is wrong', 'The trigger is off'], a: 0, why: 'Slow signals: seconds per division with Trigger None (roll mode). Fast signals: µs or ms per division with a trigger.' } } },
] },
{ id: 'wss', title: 'Wheel speed sensors', sub: 'Passive vs. active', steps: [
  { body: 'Passive (magnetic) sensors: LF on blue, RF on red, at 20 mph. Raise the <b>vehicle speed</b> to 40 mph or more and watch.', setup: { p: 'wssP' }, ctl: ['speed'], goal: { check: () => S.mph >= 40, hint: 'Speed 40 mph or more.' } },
  { body: '', ctl: ['speed'], goal: { mc: { q: 'What happened?', opts: ['Both frequency and amplitude went up (fix the range if it clips)', 'Only the frequency went up', 'Only the amplitude went up'], a: 0, why: 'A magnetic sensor makes its own voltage, so it gets weaker as the wheel slows. That’s why it can’t read near 0 mph.' } } },
  { body: 'Now an active sensor. Change the speed to <b>10 mph or less</b>.', setup: { p: 'wssA' }, ctl: ['speed'], goal: { check: () => S.mph <= 10, hint: 'Speed 10 mph or less.' } },
  { body: '', ctl: ['speed'], goal: { mc: { q: 'What changes with speed on an active sensor?', opts: ['Only the frequency: the square wave stays the same height at any speed, even near 0 mph', 'Both frequency and height', 'Neither'], a: 0, why: 'Active sensors are powered by the ABS module and switch their current between two levels (about 7 and 14 mA). Many also report direction.' } } },
] },
{ id: 'pwm', title: 'Duty cycle (PWM)', sub: 'Fixed frequency, variable on-time', steps: [
  { body: '', setup: { p: 'pwm' }, goal: { mc: { q: 'This is an EVAP purge solenoid that the ECM pulses at 20 Hz. When is the solenoid ON?', opts: ['When the blue trace is low: the ECM grounds it (low-side driver)', 'When it’s high', 'During the spike'], a: 0, why: 'Same idea as an injector: B+ on one side, the ECM switches the ground.' } } },
  { body: 'Raise the commanded <b>duty cycle</b> to 70% or more.', ctl: ['duty'], goal: { check: () => S.duty >= 70, hint: 'Purge duty ≥ 70%.' } },
  { body: '', ctl: ['duty'], goal: { mc: { q: 'What changed?', opts: ['The on-time (low part) got longer while the frequency stayed at 20 Hz', 'The frequency doubled', 'The voltage went up'], a: 0, why: 'PWM means a fixed frequency with a variable on-time. The average current sets how far the valve opens.' } } },
  { body: '', ctl: ['duty'], goal: { mc: { q: 'The measurements table shows “+Duty” about 30% while the ECM commands 70%. Why?', opts: ['+Duty measures the HIGH part. With a low-side driver the ON time is the low part: 100% − 30% = 70%', 'The scope is broken', 'The ECM is lying'], a: 0, why: 'Know which side the driver switches before you read duty cycle.' } } },
] },
];
function curStep() { return S.lesson ? S.lesson.steps[S.step] : null; }
function applySetup(su) {
  if (!su) return;
  S.p = su.p; S.F = su.F || 'good'; S.rpmKey = su.rpm || 'idle'; S.mph = 20; S.duty = 30; refreshEnv();
  const r = computeRec(S.p, S.F, S.rpmKey); S.sc = r.sc; S.tb = r.tb; S.tr = r.tr; S.math = false; S.rul.on = false; S.run = true;
  if (su.set) su.set();
  changed('sig');
}
function enterStep() { const st = curStep(); if (!st) return; S.mcPick = []; S.stepOk = !st.goal; applySetup(st.setup); renderPanel(); }
function checkGoal() { const g = curStep()?.goal; if (S.mode !== 'guided' || !g || S.stepOk || !g.check) return; if (g.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderPanel(); } }
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets up the scope, tells you what to change and look for, and checks your work.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;
    else h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Done.' : '◎ ' + g.hint}</div>`;
  }
  if (st.ctl) { if (st.ctl.includes('cond')) h += `<h4>Condition</h4>${condHTML(st.conds)}`; h += opHTML(st.ctl); }
  h += `<div class="nav"><button class="btn small" data-act="nav:back"${S.step ? '' : ' disabled'}>Back</button><button class="btn small" data-act="nav:list">All lessons</button><span class="sp"></span><button class="btn small primary" data-act="nav:next"${S.stepOk ? '' : ' disabled'}>${S.step === L.steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['sig', 'Signals'], ['tips', 'Scope tips']], guided: [['les', 'Lessons']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'sig' ? sigHTML() : S.tab === 'tips' ? tipsHTML() : S.tab === 'les' ? lessonsHTML() : caseHTML();
  b.scrollTop = keep;
}
function setMode(m) {
  if (S.mode === m) return;
  if (S.mode === 'diagnose' && S.dx && !S.dx.solved) S.dxSnap = { sc: JSON.parse(JSON.stringify(S.sc)), tb: S.tb, tr: { ...S.tr }, math: S.math };
  S.mode = m;
  $$('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'explore') { S.lesson = null; S.F = 'good'; S.rpmKey = 'idle'; refreshEnv(); applyRec(); }
  if (m === 'guided') { S.lesson = null; S.F = 'good'; refreshEnv(); applyRec(); }
  if (m === 'diagnose') {
    if (!S.dx || S.dx.solved) newCase();
    else { const d = S.dx; S.p = d.pk; S.F = d.F; S.rpmKey = PRE[d.pk].faults[d.F].rpm || 'idle'; S.mph = 20; S.duty = 30; refreshEnv(); if (S.dxSnap) { S.sc = S.dxSnap.sc; S.tb = S.dxSnap.tb; S.tr = S.dxSnap.tr; S.math = S.dxSnap.math; } changed('sig'); }
  }
  renderPanel();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function afterUser() { if (S.mode === 'diagnose' && S.dx && S.dx.issues) { /* keep the list until they check again */ } }
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'sig': S.p = v; S.F = 'good'; S.rpmKey = 'idle'; S.mph = 20; S.duty = 30; refreshEnv(); applyRec(); renderPanel(); break;
    case 'cond': S.F = v; refreshEnv(); changed(); renderPanel(); checkGoal(); break;
    case 'rpm': S.rpmKey = v; refreshEnv(); changed('tb'); renderPanel(); break;
    case 'rec': applyRec(); renderPanel(); break;
    case 'chk': checkSetup(); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('scope.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#pbody').addEventListener('input', e => {
  const t = e.target, k = t.dataset.op; if (!k) return;
  S[k] = +t.value; const o = $('#o-' + k); if (o) o.textContent = k === 'mph' ? t.value + ' mph' : t.value + '%';
  refreshEnv(); S.hist = []; measure(); renderMeas(); checkGoal();
});

/* ================= loop ================= */
let lastWall = performance.now(), lastAcq = 0, lastGoal = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastWall) / 1000); lastWall = now; S.tNow += dt;
  const iv = S.tb * 10 >= 1 ? 100 : 60;
  if (now - lastAcq >= iv) {
    lastAcq = now;
    if (S.run) { acquire(now); renderMeas(); }
    if (!drag) draw();
    syncStat();
    if (now - lastGoal > 300) { lastGoal = now; checkGoal(); }
  }
  requestAnimationFrame(loop);
}
S.light = store.get('scope.light') !== '0';
refreshEnv(); applyRec(); renderPanel();
new ResizeObserver(fit).observe($('#screenBox')); fit();
requestAnimationFrame(loop);
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__LS = { S, PRE, LESSONS, CASE_POOL, setMode, newCase, setupIssues, computeRec, refreshEnv, changed, acquire, stableNow, checkSetup, submitDx, curStep, get ENV() { return ENV; }, get FLAT() { return FLAT; }, get BAG() { return BAG; },
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; } };
})();
</script>

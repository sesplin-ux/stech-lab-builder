}
function openWhy(items){
  const id = items.find(i => !itemPresent(i));
  if (!id) return '';
  const it = ITEM[id];
  if (it.open && !(it.faultOpen && !showFault())) return typeof it.open === 'function' ? it.open() : it.open;
  if (it.k === 'switch') return `${cap(it.n)} is off, so it’s open.`;
  if (it.k === 'fuse') return `${cap(it.n)} is ${S.fuse[it.fuse] === 'blown' ? 'blown' : 'pulled'}, so it’s open.`;
  if (it.k === 'conn' && it.plug && !S.plug[it.plug]) return /^L\d/.test(it.plug) ? 'The lamp is unplugged.' : `Connector ${it.plug} is unplugged.`;
  return 'The path is broken somewhere between your probes.';
}
const list = items => items.map(i => ITEM[i].n.replace(/^the /,'')).join(', ');
const OHM_TXT = {
  lamp:'A cold tungsten filament reads about a tenth of its lit resistance. That’s normal. A burned-out bulb reads OL.',
  coil:'A relay coil is a long, thin winding, so it reads tens of ohms (typically 50–120 Ω). OL means an open coil: the relay can’t click.',
  horn:'A horn coil reads a couple of ohms. OL means the horn is open.',
  motor:'A blower motor reads a fraction of an ohm through its brushes and armature. OL means the brushes aren’t touching the commutator (a dead spot) or the armature is open.',
};

function interpV(V, rT, bT){
  const rn = TP[rT].n, bn = TP[bT].n;
  if (rn === bn) return {t:'Both probes on one point', p:'Same point, same voltage: 0 V. Put the probes on two different points.'};
  const pair = [rn, bn].sort().join();
  if (pair === 'BN,BP') return {t:'Battery voltage', p:`${fmtV(Math.abs(V))} V at the posts. A charged battery at rest reads about 12.6 V; with loads on, it dips a little.${V < 0 ? ' The reading is negative because the leads are reversed.' : ''}`};
  const sp = spanOf(rn, bn);
  if (!sp) return {t:`${nm(rT)} to ${nm(bT)}`, p:'These points aren’t on the same current path. The meter shows the difference between their voltages.'};
  if (sp.ch.loads) return interpSeries(V, rT, bT, sp);
  const L = sp.ch.load, nodes = sp.ch.nodes, IMIN = C.iMin ?? .02;
  const hasLoad = L >= sp.lo && L < sp.hi;
  const rev = V < -.05 ? ' The reading is negative because the red lead is on the lower-voltage side.' : '';
  if (hasLoad){
    if (sp.lo === L && sp.hi === L + 1){
      const I = itemI(sp.items[0]);
      if (I < IMIN && Math.abs(V) > 1) return {t:`Voltage across ${ITEM[sp.items[0]].n}`, p:`${fmtV(Math.abs(V))} V with no current flowing. Full voltage across a load that draws nothing means the load itself is open.${rev}`};
      return {t:`Voltage across ${ITEM[sp.items[0]].n}`, p:`${fmtV(Math.abs(V))} V reaches ${ITEM[sp.items[0]].n} itself: the source voltage minus every drop on the power and ground sides.${rev}`};
    }
    const powerTP = sp.redLow ? rT : bT;
    const I = itemI(sp.ch.items[L]);
    const below = BATT_V - Math.abs(V);
    if (I > IMIN * 2.5) return {t:`Available voltage at ${nm(powerTP)}`, chip:[`${below.toFixed(2)} V below battery`,'info'], p:`Measured across the load and its ground path with ${fmtA(I)} A flowing. Close to battery voltage means the power side is delivering. A low reading means voltage is being lost before this point; find it with voltage drop tests.${rev}`};
    if (Math.abs(V) < .5) return {t:`No voltage at ${nm(powerTP)}`, p:`0 V with no current flowing: voltage isn’t reaching this point. Work back toward the battery to find where it stops, at an open or a switch that’s off.`};
    return {t:`Available voltage at ${nm(powerTP)}`, chip:['no current','info'], p:`No current is flowing, so nothing drops any voltage yet. This proves voltage is present, not that the circuit can carry current. Check again with the circuit loaded.${rev}`};
  }
  const side = (L < 0 || sp.hi <= L) ? 'power' : 'ground';
  const I = itemI(sp.items[0]);
  if (C.fuseDrop && sp.items.length === 1 && ITEM[sp.items[0]].k === 'fuse' && I >= IMIN){
    const it = ITEM[sp.items[0]], rf = FUSE_R[it.fuse], est = Math.abs(V) / rf;
    return {t:`Voltage drop across ${it.n}`, chip:[`≈ ${est < 1 ? Math.round(est * 1000) + ' mA' : est.toFixed(2) + ' A'}`,'info'], p:`${(Math.abs(V) * 1000).toFixed(2)} mV across the fuse. A ${C.fuseRating[it.fuse]} A fuse is a tiny resistor (about ${(rf * 1000).toFixed(1)} mΩ), so this drop means about ${est < 1 ? Math.round(est * 1000) + ' mA' : est.toFixed(2) + ' A'} is flowing through it. Comparing fuse drops finds the circuit carrying a draw without pulling fuses or waking modules.`};
  }
  if (C.fuseDrop && sp.items.length === 1 && ITEM[sp.items[0]].k === 'fuse' && Math.abs(V) < .0005 && itemPresent(sp.items[0])) return {t:`Voltage drop across ${ITEM[sp.items[0]].n}`, chip:['≈ 0 mA','info'], p:'No measurable drop across this fuse, so its circuit isn’t carrying the draw.'};
  if (I < IMIN){
    if (side === 'ground' && Math.abs(V) < .5 && GROUND_N.includes(sp.ch.nodes[sp.hi])) return {t:`No voltage at ${nm(sp.redLow ? rT : bT)}`, p:'0 V to ground with no current flowing. This point has a path to ground, but nothing is pushing current through it. If the load should be on, the open is between this point and the power source.'};
    if (Math.abs(V) > 1) return {t:'Voltage across an open', p:`${openWhy(sp.items)} With no current flowing, nothing else drops any voltage, so the full source voltage appears across the open.${rev}`};
    return {t:'No current flowing', p:'A voltage drop test needs current through the section. With no current, even a badly corroded connection reads 0 V. Turn the circuit on.'};
  }
  if (sp.items.some(i => ITEM[i].k === 'res')){
    const only = sp.items.every(i => ITEM[i].k === 'res');
    const rs = sp.items.filter(i => ITEM[i].k === 'res');
    return {t:only ? `Voltage across ${list(rs)}` : `Voltage drop · ${side} side, including ${list(rs)}`, chip:['resistors drop voltage on purpose','info'], p:`${fmtV(Math.abs(V))} V dropped with ${fmtA(I)} A flowing. Resistors in a circuit drop voltage on purpose: speed resistors slow a motor, a dimmer dims the lamps. Test the wires and connections on their own to judge them.${rev}`};
  }
  const single = sp.items.length === 1;
  const totP = side === 'power' && sp.lo === 0 && (sp.hi === L || sp.hi === L - 1);
  const totG = side === 'ground' && (sp.lo === L + 1 || sp.lo === L + 2) && sp.hi === nodes.length - 1;
  const lim = single ? SPEC.item : side === 'power' ? SPEC.power : SPEC.ground;
  const pass = Math.abs(V) <= lim;
  const t = single ? `Voltage drop across ${ITEM[sp.items[0]].n}` : totP ? 'Voltage drop · whole power side' : totG ? 'Voltage drop · whole ground side' : `Voltage drop · ${side}-side section`;
  let p = `${fmtV(Math.abs(V))} V lost with ${fmtA(I)} A flowing.`;
  if (!single) p += ` Covers ${list(sp.items)}.`;
  if (!single && !totP && !totG) p += ` This section has to fit inside the ${lim.toFixed(2)} V ${side}-side limit.`;
  if (!pass) p += single ? ' Too much for one part: this is excessive resistance.' : ' Too much: split this section into smaller pieces to find the bad spot.';
  return {t, chip:[`${pass ? 'Pass' : 'Fail'} · ≤ ${lim.toFixed(2)} V`, pass ? 'pass' : 'fail'], p:p + rev};
}

function interpR(Rth, rT, bT, ohmE){
  const rn = TP[rT].n, bn = TP[bT].n, ol = Rth >= OL_R;
  if (rn === bn) return {t:'Probes on one point', p:S.dmm.rel ? 'Leads zeroed. Readings now leave out the test leads.' : 'This is the resistance of the test leads themselves. Press REL now to subtract it from every reading.'};
  const sp = spanOf(rn, bn);
  const leadNote = (!ol && !S.dmm.rel && Rth < 3) ? ' Includes about 0.20 Ω of test-lead resistance (touch the probes together and press REL).' : '';
  if (!sp){
    if (ol) return {t:'OL · no continuity', p:'There is no path between these points. Two separate circuits should read OL to each other.'};
    return {t:`${nm(rT)} to ${nm(bT)}`, p:`These points are connected. Two separate circuits should read OL to each other, so look for a short between them, or a shared path such as two bulbs that are both still plugged in and share a ground.${leadNote}`};
  }
  const L = sp.ch.load;
  const toGround = (GROUND_N.includes(rn) || GROUND_N.includes(bn)) && (L < 0 || sp.lo <= L) && (L < 0 || sp.hi > L);
  const items = sp.items, single = items.length === 1, it = ITEM[items[0]];
  let spanR = 0;
  for (const id of items) for (const p of parts(id)){
    const e = ohmE.find(x => x.id === p);
    spanR += e ? e.r : Infinity;
  }
  if (toGround){
    if (ol) return {t:'OL to ground', chip:['No short to ground','pass'], p:'No continuity to ground: this wire is not shorted to ground.'};
    if (!isFinite(spanR) || Rth < spanR * .85) return {t:'Continuity to ground', chip:['Short to ground','fail'], p:`A reading this low to ground, with the load out of the path, means a short to ground somewhere in this section.${leadNote}`};
    return {t:'Reading through the load', p:`You’re measuring through ${ITEM[sp.ch.items[L]] ? ITEM[sp.ch.items[L]].n : 'the load'} to ground, not checking for a short. To test a wire for a short to ground, unplug the load first.${leadNote}`};
  }
  if (ol){
    const why = openWhy(items);
    if (single && (it.k === 'wire' || it.k === 'cable')) return {t:`${cap(it.n)}: OL`, chip:[`Fail · ≤ ${SPEC.wire.toFixed(1)} Ω`,'fail'], p:`OL means open: ${it.n} is broken.`};
    if (single && it.k === 'res') return {t:`${cap(it.n)}: OL`, chip:['Open','fail'], p:`${why || 'No continuity.'} A resistor in the circuit must still have continuity.`};
    return {t:'OL · open', p:`${why || 'No continuity between the probes.'} OL means infinite resistance.`};
  }
  const parallel = !isFinite(spanR) || Rth < spanR * .85;
  const parNote = parallel ? ' This reads lower than the parts between your probes, so another path is connected in parallel. Unplug or disconnect to isolate the part.' : '';
  if (single && it.k === 'load') return {t:`${cap(it.n)}${it.ohm === 'lamp' ? ', cold' : ''}`, chip:it.nom ? [`rated ≈ ${it.nom} Ω`,'info'] : null, p:`${OHM_TXT[it.ohm] || ''}${parNote}${leadNote}`};
  if (single && it.k === 'res') return {t:cap(it.n), chip:[`rated ≈ ${it.nom.toFixed(2)} Ω`,'info'], p:`This resistor is supposed to have resistance; it drops voltage on purpose (to slow a motor or dim a lamp). Compare the reading with the rated value. OL means open.${parNote}${leadNote}`};
  if (single){
    const pass = Rth <= SPEC.wire;
    const good = it.k === 'wire' || it.k === 'cable' ? 'A good wire reads well under 1.0 Ω end to end.' : 'A good connection, switch, or fuse reads close to 0 Ω.';
    return {t:`${cap(it.n)}${it.k === 'wire' ? ' end to end' : ''}`, chip:[`${pass ? 'Pass' : 'Fail'} · ≤ ${SPEC.wire.toFixed(1)} Ω`, pass ? 'pass' : 'fail'], p:`${good}${parNote}${leadNote}`};
  }
  return {t:`${nm(rT)} to ${nm(bT)}`, p:`Covers ${list(items)}.${parNote}${leadNote}`};
}

function interpA(I, rT, bT){
  const rn = TP[rT].n, bn = TP[bT].n;
  if (Math.abs(I) < .005) return {t:'No current through the meter', p:'An ammeter has to be part of the path. Break the circuit and bridge the gap with the leads: pull a fuse and put one probe on each fuse terminal.'};
  const pr = [rn, bn].sort().join();
  const par = R.E.find(e => e.id !== 'dmm' && [e.a, e.b].sort().join() === pr);
  let o = C.drawSpec(pr, I) || {t:'Current through the meter', p:`${fmtA(Math.abs(I))} A flows through the meter.`};
  o = {...o};
  if (par) o.p += ` ${par.prot && C.fuseRating[par.dev] ? 'Fuse ' + par.dev : 'Another part'} is still connected across the same points, so the current splits between it and the meter. Remove it to read the full current.`;
  if (I < 0) o.p += ' The reading is negative: current is entering the black lead. Swap the leads.';
  return o;
}

function readMeter(){
  const d = S.dmm, r = S.tips.dmmR, b = S.tips.dmmB, both = !!(r && b);
  const o = {val:'', unit:'', ann:[], sub:'', it:null, warn:null, ol:false};
  o.sub = both ? `+ ${nm(r)}   − ${nm(b)}` : (r || b) ? `${r ? '+ ' + nm(r) : '− ' + nm(b)} · place the other probe` : 'Probes in the tray';
  if (d.knob === 'OFF'){ o.off = true; o.sub = 'Meter off'; return o; }
  o.ann.push(['AUTO','on']);
  if (d.knob === 'V'){
    o.ann.push(['DC','on'], ['V','on']); o.unit = 'V';
    if (d.jack === 'A'){
      o.val = '0.000';
      o.warn = 'The red lead is in the 10 A jack. In that jack the meter is a near-zero-ohm shunt, so across any voltage it acts like a jumper wire. Move it to VΩ.';
      o.it = {t:'Red lead in the wrong jack', p:'With the red lead in the 10 A jack, the meter can’t read voltage.'};
      return o;
    }
    const V = both ? R.v[TP[r].n] - R.v[TP[b].n] : 0;
    o.num = V; o.val = fmtV(V);
    if (Math.abs(V) < .6 && Math.abs(V) >= .00001){ o.val = (V * 1000).toFixed(Math.abs(V) < .06 ? 2 : 1); o.unit = 'mV'; }
    o.it = both ? interpV(V, r, b) : {t:'Voltage', p:'Voltmeter: probes in parallel, circuit powered. Put black on a good ground and red on the point you want to check, or one probe at each end of a section for a voltage drop test.'};
    return o;
  }
  if (d.knob === 'R'){
    o.ann.push(['Ω','on']); if (d.rel) o.ann.push(['REL','on']); o.unit = 'Ω';
    if (d.jack === 'A'){
      o.val = 'OL'; o.ol = true;
      o.warn = 'The red lead is in the 10 A jack. Ohms is read through the VΩ jack.';
      o.it = {t:'Red lead in the wrong jack', p:'Move the red lead to VΩ to measure resistance.'};
      return o;
    }
    if (!both){ o.val = 'OL'; o.ol = true; o.it = {t:'Resistance', p:'Ohmmeter: circuit off, part isolated. Zero the leads first: touch both probes to one point and press REL.'}; return o; }
    const voc = R.v[TP[r].n] - R.v[TP[b].n];
    if (Math.abs(voc) > .02){
      o.live = true; o.val = '-.--'; o.ann.push(['LIVE','warn']);
      o.it = {t:'Voltage present', p:`There is ${fmtV(Math.abs(voc))} V between your probes. An ohmmeter supplies its own small current, so any voltage already in the circuit makes the reading meaningless and can damage some meters. Turn the circuit off (pull the fuse) and isolate the part.`, warn:true};
      return o;
    }
    const om = solveOhm(TP[r].n, TP[b].n);
    const shown = om.R >= OL_R ? om.R : om.R + LEAD_R - d.rel;
    o.rawR = om.R + LEAD_R; o.ol = om.R >= OL_R;
    const [vv, uu] = fmtR(shown); o.val = vv; o.unit = uu; o.num = shown;
    o.it = interpR(om.R, r, b, om.E);
    return o;
  }
  o.ann.push(['DC','on'], ['A','on']); o.unit = 'A';
  if (d.jack === 'V'){
    o.val = '0.00';
    o.warn = 'To measure amps, move the red lead to the 10 A jack.';
    o.it = {t:'Red lead in the VΩ jack', p:'No current can flow through the meter from this jack. The ammeter shunt is behind the 10 A jack.'};
    return o;
  }
  if (d.blown){
    o.val = '0.00';
    o.it = {t:'Meter fuse blown', p:'The meter can’t read current until its internal fuse is replaced.', warn:true};
    return o;
  }
  const I = both ? (R.I.dmm || 0) : 0;
  o.num = I; o.val = Math.abs(I) < .0005 ? '0.000' : Math.abs(I) < 6 ? I.toFixed(3) : I.toFixed(2);
  o.it = both ? interpA(I, r, b) : {t:'Current', p:'Ammeter: in series, never across a voltage. Pull the fuse and put one probe on each fuse terminal, or use the amp clamp.'};
  return o;
}

function pathEnds(d){
  const tk = d.match(/[MHVL]|-?\d+(\.\d+)?/g); let x = 0, y = 0, cmd = '', first = null; const pts = [];
  for (let i = 0; i < tk.length; i++){
    const t = tk[i];
    if (/[MHVL]/.test(t)){ cmd = t; continue; }
    if (cmd === 'M' || cmd === 'L'){ x = +t; y = +tk[++i]; }
    else if (cmd === 'H') x = +t; else if (cmd === 'V') y = +t;
    if (!first) first = [x, y];
    pts.push([x, y]);
  }
  return {a:first, b:pts[pts.length - 1]};
}
function el(tag, attrs, parent){

}

  }
  return `<rect x="10" y="546" width="980" height="52" rx="12" class="tray"/>
    ${lab(114, 'DMM', 'leads → meter')}${sep(176)}
    ${lab(266, 'TEST LIGHT', '≈ 0.25 A')}${sep(344)}
    ${ldIcon}${lab(424, 'LOAD TOOL', '2.1 A bulb')}${sep(508)}
    ${lab(568, 'POWER PROBE', '8 A breaker')}${sep(656)}
    ${jIcon}${lab(734, 'FUSED JUMPER', '10 A fuse')}${sep(828)}
    ${lab(886, 'AMP CLAMP', 'no circuit break')}${spots}`;
}

/* tip shapes, drawn pointing at (0,0) with the body toward -y */
function tipShape(id){
  const t = TIPS[id];
  if (t.kind === 'probe') return `<line x1="0" y1="0" x2="0" y2="-13" stroke="#D7DEE6" stroke-width="1.6" stroke-linecap="round" pointer-events="none"/>
    <g class="tbody"><path d="M-2.6 -13 L2.6 -13 L4.4 -18 L4.4 -42 Q4.4 -46 0 -46 Q-4.4 -46 -4.4 -42 L-4.4 -18 Z" fill="${t.fill}" stroke="${t.edge}" stroke-width="1"/>
    <rect x="-6" y="-22" width="12" height="3" rx="1.5" fill="${t.fill}" stroke="${t.edge}" stroke-width=".8"/></g>`;
  if (t.kind === 'tlight'){
    const b = R.bright.tl || 0;
    return `<line x1="0" y1="0" x2="0" y2="-12" stroke="#D7DEE6" stroke-width="1.6" stroke-linecap="round" pointer-events="none"/>
      <circle cx="0" cy="-31" r="${10 + 10 * Math.min(1, b)}" fill="url(#gGlow)" opacity="${Math.min(1, b * 1.2)}" pointer-events="none"/>
      <g class="tbody"><path d="M-3 -12 L3 -12 L5.6 -18 L5.6 -46 Q5.6 -50 0 -50 Q-5.6 -50 -5.6 -46 L-5.6 -18 Z" fill="rgba(255,197,77,.16)" stroke="#FFC54D" stroke-width="1.1"/>
      <circle cx="0" cy="-31" r="3.4" fill="${b > .03 ? '#FFE7A8' : '#3A3322'}"/></g>`;
  }
  if (t.kind === 'clip') return `<g class="tbody"><path d="M-5.5 -3 L0 2.5 L5.5 -3 L5 -16 L-5 -16 Z" fill="#AEB9C5" stroke="#5c6875" stroke-width=".8"/>
    <path d="M-3 -5 L3 -5 M-3.5 -9 L3.5 -9" stroke="#5c6875" stroke-width=".8"/>
    <path d="M-5.4 -16 L5.4 -16 L4.4 -34 Q4.4 -36 0 -36 Q-4.4 -36 -4.4 -34 Z" fill="${t.fill}" stroke="${t.edge}" stroke-width="1"/></g>`;
  if (t.kind === 'pprobe'){
    const led = S.ppTrip ? '#5A4020' : S.pp === 'B' ? '#FF4D5E' : S.pp === 'G' ? '#3DDC97' : '#2A2F36';
    return `<line x1="0" y1="0" x2="0" y2="-14" stroke="#D7DEE6" stroke-width="1.8" stroke-linecap="round" pointer-events="none"/>
      <g class="tbody"><path d="M-3 -14 L3 -14 L6.5 -21 L6.5 -52 Q6.5 -56 0 -56 Q-6.5 -56 -6.5 -52 L-6.5 -21 Z" fill="#2A2140" stroke="#B48CFF" stroke-width="1.1"/>
      <circle cx="0" cy="-42" r="2.8" fill="${led}"/>${S.pp !== 'off' && !S.ppTrip ? `<circle cx="0" cy="-42" r="6" fill="${led}" opacity=".3"/>` : ''}</g>`;
  }
  return `<g class="tbody"><circle cx="0" cy="0" r="10.5" fill="none" stroke="#8CCBF3" stroke-width="3"/>
    <path d="M-6 -10 L6 -10 L5 -40 Q5 -42 0 -42 Q-5 -42 -5 -40 Z" fill="#14283A" stroke="#8CCBF3" stroke-width="1"/></g>`;
}
function tipXY(id){
  const t = TIPS[id];
  if (drag && drag.id === id && drag.moved) return {x:drag.x, y:drag.y, ang:t.ang, out:true};
  const at = S.tips[id];
  if (at){
    const p = t.kind === 'clamp' ? CLAMP[at] : tpPos(at);
    if (p) return {x:p.x, y:p.y, ang:t.ang, out:true};
  }
  return {x:t.home[0], y:t.home[1], ang:0, out:false};
}
function backOf(id, p){
  const L = TIPS[id].L, a = p.ang * Math.PI / 180;
  return [p.x + L * Math.sin(a), p.y - L * Math.cos(a)];
}
function cablePath(b, ang, end, endDir){
  const a = ang * Math.PI / 180, ux = Math.sin(a), uy = -Math.cos(a);
  const c1 = [b[0] + ux * 44, b[1] + uy * 44];
  const c2 = endDir ? [end[0] + endDir[0], end[1] + endDir[1]] : [end[0], end[1] - 70];
  return `M${b[0].toFixed(1)} ${b[1].toFixed(1)} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${end[0].toFixed(1)} ${end[1].toFixed(1)}`;
}
function drawTips(){
  let cab = '', tips = '';
  const P = {};
  for (const id in TIPS) P[id] = tipXY(id);
  for (const id of ['dmmR','dmmB','ppTip','clamp']) if (P[id].out) cab += `<path d="${cablePath(backOf(id, P[id]), P[id].ang, ANCHOR[id])}" class="cable" stroke="${CABLE_COL[id]}"/>`;
  if (P.tlTip.out || P.tlClip.out){
    const a = backOf('tlTip', P.tlTip), b = backOf('tlClip', P.tlClip);
    cab += `<path d="${cablePath(b, P.tlClip.ang, a, [0, -40])}" class="cable" stroke="${CABLE_COL.tlClip}"/>`;
  }
  for (const [A, B, kind] of [['ldA','ldB','ld'], ['jA','jB','jmp']]){
    if (!P[A].out && !P[B].out) continue;
    const a = backOf(A, P[A]), b = backOf(B, P[B]);
    const m = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 26];
    cab += `<path d="${cablePath(a, P[A].ang, m, [0, 30])}" class="cable" stroke="${CABLE_COL[A]}"/><path d="${cablePath(b, P[B].ang, m, [0, 30])}" class="cable" stroke="${CABLE_COL[B]}"/>`;
    if (kind === 'ld'){
      const br = R.bright.ld || 0;
      cab += `<g transform="translate(${m[0].toFixed(1)} ${m[1].toFixed(1)})"><circle r="${16 + 16 * Math.min(1, br)}" fill="url(#gGlow)" opacity="${Math.min(1, br * 1.2)}"/>
        <circle r="8" fill="${br > .02 ? 'rgba(255,214,140,' + (0.15 + 0.3 * Math.min(1, br)) + ')' : '#12171D'}" stroke="#FF9B42" stroke-width="1.3"/>
        <path d="M-4 3 L-2.5 -2 L-1 2 L1 -2 L2.5 2 L4 3" fill="none" stroke="${br > .004 ? '#FFE7A8' : '#5A5340'}" stroke-width="1.2"/></g>`;
    } else {
      cab += `<g transform="translate(${m[0].toFixed(1)} ${m[1].toFixed(1)})"><rect x="-8" y="-4.5" width="16" height="9" rx="2.5" fill="${S.jmpBlown ? '#2A1512' : '#134A44'}" stroke="${S.jmpBlown ? '#FF5A4E' : '#5FD4C4'}"/>${S.jmpBlown ? '<path d="M-4 0 H-1 M1 0 H4" stroke="#FF5A4E" stroke-width="1.2"/>' : '<path d="M-5 0 H5" stroke="#5FD4C4" stroke-width="1.2"/>'}</g>`;
    }
  }
  G.cables.innerHTML = cab;
  const order = ['clamp','jA','jB','ldA','ldB','tlClip','tlTip','ppTip','dmmB','dmmR'];
  for (const id of order){
    const p = P[id];
    const cls = 'tip' + (S.sel === id ? ' sel' : '') + (drag && drag.id === id ? ' dragging' : '');
    const where = S.tips[id] ? ' on ' + (TIPS[id].kind === 'clamp' ? (CLAMP[S.tips[id]] || {}).nm : nm(S.tips[id])) : ' in tray';
    tips += `<g class="${cls}" data-tip="${id}" tabindex="0" role="button" aria-label="${TIPS[id].nm}${where}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.ang})">
      ${tipShape(id)}<rect x="-10" y="${-TIPS[id].L}" width="20" height="${TIPS[id].L - (TIPS[id].kind === 'clamp' ? 12 : 9)}" fill="transparent"/></g>`;
  }
  G.tips.innerHTML = tips;
}
function drawTPs(){
  const near = drag && drag.snap, armed = !!(S.sel || (drag && drag.moved));
  const kindClamp = (drag && TIPS[drag.id].kind === 'clamp') || (S.sel && TIPS[S.sel].kind === 'clamp');
  let h = '';
  for (const id of TP_IDS){
    const t = TP[id], p = tpPos(id), v = R.v[t.n];
    const fill = S.colors ? vcol(v) : '#8A98A8';
    const spot = SPOT.has('tp:' + id);
    h += `<g class="tp${near === id ? ' near' : ''}${armed && !kindClamp ? ' armed' : ''}" data-tp="${id}" tabindex="0" role="button" aria-label="Test point ${t.nm}" transform="translate(${p.x} ${p.y})">
      <circle class="tph" r="12"/>${spot ? '<circle class="spotring" r="10"/>' : ''}<circle class="tpring" r="9"/><circle class="tpd" r="4.6" fill="${fill}"/></g>`;
    if (t.l){ const lx = (t.lx ?? t.x) + (p.x - t.x), ly = (t.ly ?? (t.y + 18)) + (p.y - t.y); h += `<text x="${lx}" y="${ly}" text-anchor="${t.a || 'middle'}" class="t-tp">${t.l}</text>`; }
  }
  if (kindClamp) for (const id in CLAMP){
    const c = CLAMP[id];
    h += `<g class="tp${near === id ? ' near' : ''} armed" data-clamp="${id}" transform="translate(${c.x} ${c.y})"><circle class="tph" r="13"/><circle class="tpring" r="10" style="opacity:.6;stroke-dasharray:3 3"/></g>`;
  }
  for (const s of SPOT) if (s.startsWith('cl:') && CLAMP[s.slice(3)] && S.tips.clamp !== s.slice(3)){ const c = CLAMP[s.slice(3)]; h += `<circle class="spotring" cx="${c.x}" cy="${c.y}" r="14"/>`; }
  G.tp.innerHTML = h;
}

/* ================= render ================= */
function paintWires(){
  for (const w of WIRES){
    const va = R.v[w.a] ?? 0, vb = R.v[w.b] ?? 0;
    const ca = S.colors ? vcol(va) : NEUTRAL, cb = S.colors ? vcol(vb) : NEUTRAL;
    const brk = w.brk && S.fault === w.brk.f;
    const f = brk ? w.brkF : .5;
    const mid = S.colors ? vcol((va + vb) / 2) : NEUTRAL;
    const cols = brk ? [ca, ca, cb, cb] : [ca, mid, mid, cb];
    [0, f, f, 1].forEach((o, i) => { w.stops[i].setAttribute('offset', o); w.stops[i].setAttribute('stop-color', cols[i]); });
    if (w.flow){
      const I = (R.I[w.el] || 0) * (w.sign || 1);
      w.I = I;
      w.flow.style.opacity = (S.colors && Math.abs(I) > .01) ? Math.min(.95, .35 + Math.abs(I) / 3) : 0;
    }
  }
}
function render(){
  paintWires();
  G.parts.innerHTML = C.parts();
  G.fault.innerHTML = S.fault && showFault() ? C.fault() : '';
  G.tray.innerHTML = trayStatic();
  drawTPs();
  drawTips();
  renderMeter();
  $('#ctrls').innerHTML = C.ctrls();
  renderNote();
  renderSpots();
  $('#legend').classList.toggle('off', !S.colors);
  $('#cHint').textContent = S.sel ? `Now click a test point for the ${TIPS[S.sel].nm}` : 'Drag a tool from the tray onto a test point';
}

function renderMeter(){

  if (S.tips.ppTip) chips.push(`<span class="tchip"><i style="background:var(--pp)"></i>Power probe <b>${S.ppTrip ? 'tripped' : S.pp === 'B' ? '+B on' : S.pp === 'G' ? 'GND on' : 'off'}</b></span>`);
  if (S.tips.jA && S.tips.jB) chips.push(`<span class="tchip"><i style="background:var(--jmp)"></i>Fused jumper <b>${S.jmpBlown ? 'blown' : Math.abs(R.I.jmp || 0).toFixed(2) + ' A'}</b></span>`);

function renderSpots(){
  document.querySelectorAll('.spot').forEach(n => n.classList.remove('spot'));
  for (const s of SPOT){
    if (s.startsWith('#')){ const n = $(s); if (n) n.classList.add('spot'); }
    else if (s.startsWith('ctl:')){ const n = document.querySelector(`#ctrls [data-act="${s.slice(4)}"]`); if (n) n.classList.add('spot'); }
  }
}

/* ================= animation ================= */
let lastT = 0;
function tick(t){
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (!reduceMotion && R){
    if (S.colors) for (const w of WIRES){
      if (!w.flow || !w.I || Math.abs(w.I) < .01) continue;
      const sp = Math.min(120, 26 * Math.sqrt(Math.abs(w.I)) + 8);
      w.off -= Math.sign(w.I) * sp * dt;
      w.flow.style.strokeDashoffset = w.off.toFixed(1);
    }
    if (R.rpm > 30){
      FAN.a = (FAN.a + R.rpm / 22 * dt * 6) % 360;
      const f = svg.querySelector('#fan');
      if (f) f.setAttribute('transform', `rotate(${FAN.a.toFixed(1)} 690 170)`);
    }
  }
  requestAnimationFrame(tick);
}

/* ================= update cycle ================= */
function update(o = {}){
  let r = solveRun();
  if (r){ R = r; if (C.after && C.after()){ const ev = r.ev; r = solveRun(); if (r){ r.ev = ev.concat(r.ev); R = r; } } }
  if (!r){ toast('Circuit could not settle. Resetting.', 'bad'); bench(C.start); R = solveRun(); }
  for (const [m, c] of R.ev) toast(m, c);
  if (o.keepNote){ paintWires(); renderMeter(); G.parts.innerHTML = C.parts(); G.fault.innerHTML = S.fault && showFault() ? C.fault() : ''; drawTips(); drawTPs(); return; }
  render();
}
function toast(msg, cls = ''){
  const box = $('#toasts'), n = document.createElement('div');
  n.className = 'toast ' + cls; n.innerHTML = `<i></i><span>${msg}</span>`;
  box.appendChild(n);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 450); }, 4200);
}

/* ================= bench state ================= */
function setFault(id, r){
  S.fault = id || null;
  const f = id && FBY[id];
  S.faultR = r ?? (f && f.adj) ?? 0;
  if (C.onFault) C.onFault(S.fault);
  for (const k in S.fuse) if (S.fuse[k] === 'blown') S.fuse[k] = 'in';
  NLC = {};
}
function bench(o = {}){
  const d = C.defaults;
  S.sw = {...d.sw}; S.fuse = {...d.fuse}; S.plug = {...d.plug}; S.ign = !!d.ign; S.speed = d.speed || 'OFF';
  S.fault = null; S.faultR = 0; S.pp = 'off'; S.ppTrip = false; S.jmpBlown = false;
  S.stuck = false; S.stops = 0; S.motRun = false; S.pad = !!d.pad; S.relayOn = false; S.clickAt = 0; S.dim = d.dim || 0; S.door = false; S.glove = false; S.tmin = 0; S.lost = false;
  S.dmm = {knob:'V', jack:'V', rel:0, blown:false};
  S.tips = Object.fromEntries(Object.keys(TIPS).map(k => [k, null]));
  S.sel = null; NLC = {};
  for (const k in o){
    if (k in S.sw) S.sw[k] = o[k];
    else if (k in S.fuse) S.fuse[k] = o[k];
    else if (k in S.plug) S.plug[k] = o[k];
  }
  if (o.ign != null) S.ign = o.ign;
  if (o.pad != null) S.pad = o.pad;
  if (o.dim != null) S.dim = o.dim;
  if (o.speed) S.speed = o.speed;
  if (o.fault) setFault(o.fault, o.fr);
  if (o.knob) S.dmm.knob = o.knob;
  if (o.jack) S.dmm.jack = o.jack;
  if (o.tips) Object.assign(S.tips, o.tips);
}
function loadCircuit(id){
  C = CIRCUITS[id] || LAMP; S.cid = C.id;
  TP = C.TP; TP_IDS = Object.keys(TP); CLAMP = C.CLAMP; WIRES = C.WIRES; FAULTS = C.FAULTS; ITEM = C.ITEM; FTYPES = C.FTYPES;
  FBY = Object.fromEntries(FAULTS.map(f => [f.id, f]));
  $('#pickName').textContent = C.name; $('#pickSub').textContent = C.sub;
  $('#circuit').setAttribute('aria-label', `${C.name} schematic with test points and tool tray`);
  drawStatic();
}
function switchCircuit(id){
  if (id === S.cid) return;
  loadCircuit(id);
  S.lesson = null; S.step = 0; S.snaps = {}; S.answered = {}; SPOT = new Set();
  if (S.mode === 'mystery'){ S.mystery = null; S.colors = false; }
  bench(C.start);
  try { history.replaceState(null, '', '#' + id); } catch (_) {}
  syncBar(); update();
}

/* ================= actions ================= */
function act(a){
  const [k, v] = a.split(':');
  if (C.act && C.act(k, v)){ update(); return; }
  if (k === 'sw') S.sw[v] = !S.sw[v];
  else if (k === 'fuse'){
    if (S.fuse[v] === 'in') S.fuse[v] = 'out';
    else { if (S.fuse[v] === 'blown') toast(`New ${v} installed.`, 'ok'); S.fuse[v] = 'in'; }
  }
  else if (k === 'plug') S.plug[v] = !S.plug[v];
  else if (k === 'ign') S.ign = v === 'toggle' ? !S.ign : v === '1';
  else if (k === 'spd') S.speed = v;
  else if (k === 'dim') S.dim = +v;
  else if (k === 'pad') S.pad = v === 'toggle' ? !S.pad : v === '1';
  else if (k === 'tap'){
    if (S.fault === 'dead' && S.stuck){ S.stuck = false; toast('You tapped the motor. The armature moved off the dead spot.', 'ok'); }
    else toast('You tapped the motor.');
  }
  else if (k === 'pp'){ if (v === 'reset') S.ppTrip = false; else S.pp = v; }
  else if (k === 'meterfuse'){ S.dmm.blown = false; toast('Meter fuse replaced.', 'ok'); }
  update();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b && !svg.contains(b)) act(b.dataset.act);
});

/* ---------- dragging tools ---------- */
let drag = null;
function svgPt(e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function nearest(id, x, y){
  let best = null, bd = 22;
  if (TIPS[id].kind === 'clamp'){
    for (const c in CLAMP){ const d = Math.hypot(CLAMP[c].x - x, CLAMP[c].y - y); if (d < bd){ bd = d; best = c; } }
  } else for (const t of TP_IDS){ const p = tpPos(t), d = Math.hypot(p.x - x, p.y - y); if (d < bd){ bd = d; best = t; } }
  return best;
}
function place(id, spot){ S.tips[id] = spot; S.sel = null; update(); }
svg.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-tip]');
  if (g){
    e.preventDefault();
    const id = g.dataset.tip, p = svgPt(e);
    drag = {id, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false, snap:null};
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  const tp = e.target.closest('[data-tp],[data-clamp]');
  if (tp && S.sel){
    const isClamp = TIPS[S.sel].kind === 'clamp';
    if (isClamp && tp.dataset.clamp) place(S.sel, tp.dataset.clamp);
    else if (!isClamp && tp.dataset.tp) place(S.sel, tp.dataset.tp);
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a){ act(a.dataset.act); return; }
  if (S.sel){
    const p = svgPt(e);
    if (p.y > 546){ S.tips[S.sel] = null; S.sel = null; update(); }
    else { S.sel = null; render(); }
  }
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = svgPt(e);
  if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) < 4) return;
  drag.moved = true; drag.x = p.x; drag.y = p.y;
  const sn = nearest(drag.id, p.x, p.y);
  if (sn){ const q = TIPS[drag.id].kind === 'clamp' ? CLAMP[sn] : tpPos(sn); drag.x = q.x; drag.y = q.y; }
  if (sn !== drag.snap){ drag.snap = sn; drawTPs(); }
  drawTips();
});
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moved){ S.sel = S.sel === d.id ? null : d.id; render(); return; }
  S.tips[d.id] = d.snap || null; S.sel = null;
  update();
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') { if (e.key === 'Escape' && S.sel){ S.sel = null; render(); } return; }
  const g = e.target.closest('[data-tip]'), tp = e.target.closest('[data-tp]'), a = e.target.closest('[data-act]');
  e.preventDefault();
  if (g){ S.sel = S.sel === g.dataset.tip ? null : g.dataset.tip; render(); const n = svg.querySelector(`[data-tip="${g.dataset.tip}"]`); if (n) n.focus(); }
  else if (tp && S.sel && TIPS[S.sel].kind !== 'clamp'){ const id = tp.dataset.tp; place(S.sel, id); const n = svg.querySelector(`[data-tp="${id}"]`); if (n) n.focus(); }
  else if (a) act(a.dataset.act);
});

/* ================= lessons ================= */
/* Each step saves the bench as the student found it, so Back and Redo step put it back exactly. */
const SNAP_KEYS = ['sw','fuse','plug','ign','speed','pad','relayOn','dim','door','glove','tmin','lost','fault','faultR','pp','ppTrip','jmpBlown','stuck','stops','motRun','dmm','tips'];
const snap = () => JSON.parse(JSON.stringify(Object.fromEntries(SNAP_KEYS.map(k => [k, S[k]]))));
function restore(o){ const c = JSON.parse(JSON.stringify(o)); for (const k of SNAP_KEYS) S[k] = c[k]; NLC = {}; S.sel = null; }
function enterStep(i, reset){
  const L = C.lessons[S.lesson];
  S.step = Math.max(0, Math.min(L.steps.length - 1, i));
  const st = L.steps[S.step];
  if (reset && S.snaps[S.step]) restore(S.snaps[S.step]);
  else {
    if (st.set) bench(st.set);
    else if (reset){
      let j = S.step; while (j > 0 && !L.steps[j].set) j--;
      bench(L.steps[j].set || C.start);
      for (let k = j; k < S.step; k++) if (L.steps[k].mod) L.steps[k].mod();
    }
    if (st.mod) st.mod();
    S.snaps[S.step] = snap();
  }
  SPOT = new Set(st.spot || []);
  update();
}

function renderTabs(){
  const main = S.mode === 'guided' ? 'Lesson' : S.mode === 'mystery' ? 'Mystery' : 'Faults';
  const tabs = [['main', main], ['guide', 'Field guide'], ['log', `Readings${S.log.length ? ' (' + S.log.length + ')' : ''}`]];
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b){ S.tab = b.dataset.tab; renderTabs(); renderNote(); } });

function renderNote(){
  const nb = $('#nbody'), top = nb.scrollTop;

  else if (S.tab === 'log') nb.innerHTML = logHTML();

function mysteryHTML(){
  const M = S.mystery;
  if (!M) return `<div class="myst"><div class="nsec"><h3>Mystery fault · ${C.name}</h3><span>Diagnose it like a real car</span></div>
    <p class="fine" style="font-size:13.5px;color:var(--soft)">The bench picks a random fault and hides it. Voltage colors and current dots turn off, so the only things you can see are the loads, the fuses, and your tools. Read the customer concern, test, record your readings, then make the call.</p>
    <div class="row"><button type="button" class="btn primary" data-my="new">Start a mystery fault</button></div></div>`;
  const f = FBY[M.fault];
  let h = `<div class="myst"><div class="concern"><small>Customer concern</small><p>${f.concern}</p></div>
    <p class="fine">Readings recorded: <b style="color:var(--fg)">${S.log.length - M.log0}</b>. Use <b style="color:var(--fg)">Record</b> on the meter to log each test.</p>`;
  if (!M.revealed){
    h += `<label class="gk" for="diag">Your diagnosis</label><select id="diag"><option value="">Choose the fault…</option>${FTYPES.map(t => `<optgroup label="${t.n}">${FAULTS.filter(x => x.t === t.k).map(x => `<option value="${x.id}" ${M.pick === x.id ? 'selected' : ''}>${x.n}</option>`).join('')}</optgroup>`).join('')}</select>
      <div class="row"><button type="button" class="btn primary" data-my="check">Check diagnosis</button><button type="button" class="btn small" data-my="reveal">Show me</button></div>`;
    if (M.wrong) h += `<div class="result no">Not that. Those symptoms could fit, but the readings will tell them apart. Keep testing.</div>`;
  } else {
    h += `<div class="result ${M.right ? 'ok' : 'no'}">${M.right ? '<b>Correct.</b> ' : ''}The fault was <b>${f.n}</b>${f.rng ? ` (${faultVal()})` : ''}. It’s now shown on the circuit, and voltage colors are back on.${M.tries > 1 ? ` Tries: ${M.tries}.` : ''}</div>
      <div class="row"><button type="button" class="btn primary" data-my="new">Next mystery fault</button></div>`;
  }
  return h + '</div>';
}
function mysteryAct(a){
  const M = S.mystery;
  if (a === 'new'){
    const f = FAULTS[Math.floor(Math.random() * FAULTS.length)];
    bench(C.mystStart);
    let r;
    if (f.myst){ const [lo, hi] = f.myst, st = f.rng[2]; r = Math.round((lo + Math.random() * (hi - lo)) / st) * st; r = +r.toFixed(3); }
    setFault(f.id, r);
    S.mystery = {fault:f.id, revealed:false, tries:0, log0:S.log.length};
    S.colors = false;
  } else if (a === 'check'){
    const v = $('#diag').value; if (!v){ toast('Choose a fault first.', 'warn'); return; }
    M.tries++; M.pick = v;
    if (v === M.fault){ M.revealed = true; M.right = true; S.colors = true; toast('Correct diagnosis.', 'ok'); }
    else M.wrong = true;
  } else if (a === 'reveal'){ M.revealed = true; M.right = false; S.colors = true; }
  syncBar(); update();
}

const GUIDE_HTML = `

    <h4>Excessive resistance</h4><p><b>Symptom:</b> dim lamp, slow motor, hot connector. <b>V:</b> voltage drop over spec under load. <b>Ω:</b> over 1.0 Ω end to end. <b>A:</b> lower than normal. Causes: corrosion, loose or spread terminals, damaged wire, a bad ground.</p>
    <h4>Open</h4><p><b>Symptom:</b> doesn’t work at all. <b>V:</b> voltage up to the open, none after it; full voltage across the open. An open ground puts battery voltage on the ground side of the load. <b>Ω:</b> OL. <b>A:</b> 0.</p>
    <h4>Short to ground</h4><p><b>Symptom:</b> fuse blows or breaker trips. <b>Find it:</b> test light or short finder in the fuse cavity, then unplug sections until it goes out. <b>Ω:</b> near 0 Ω from an isolated power wire to ground (unplug the load first). Don’t hunt it with an ammeter.</p>
    <h4>Shorted together</h4><p><b>Short to power:</b> load runs with its switch off; battery drain. <b>Cross-feed:</b> one switch runs two loads. <b>Find it:</b> pull fuses and unplug connectors to see where the power gets in. <b>Ω:</b> two isolated circuits should read OL to each other.</p>
    <h4>Can’t carry the load</h4><p>A wire down to a few strands, or a terminal barely touching. Passes no-load voltage and ohms, and a test light may still light. <b>Find it:</b> load the circuit (the real part or a load tool) and measure voltage drop under load.</p></div>
  <div class="gcard"><span class="gk">Tools</span><ul>
    <li><b>Test light</b> (about 0.25 A): quick power and ground checks; stands in for a fuse when hunting shorts. Its light draw can give false positives. Don’t use it on computer or sensor circuits.</li>
    <li><b>Load tool</b>: a bulb on alligator clips (about 2 A). Proves a circuit can carry real current.</li>
    <li><b>Power probe</b>: applies battery voltage (+B) or ground to a point, with an 8 A breaker. Use it on load circuits, never on module or sensor circuits.</li>
    <li><b>Fused jumper</b>: bypasses a switch or suspect wire to prove a section. Always fused.</li>
    <li><b>Amp clamp</b>: reads current without breaking the circuit.</li></ul></div>`;
const guideHTML = () => `<div class="guide">${C.guide}${GUIDE_HTML}</div>`;

/* ================= boot ================= */
const hash = location.hash.replace('#', '');
const hm = hash.match(/^(lamp|blower|relay|series|draw)?-?(?:lesson(\d))?$/) || [];
loadCircuit(hm[1] || 'lamp');
bench(C.start);
if (hm[2] && C.lessons[+hm[2] - 1]){ S.mode = 'guided'; S.lesson = +hm[2] - 1; enterStep(0); }
else if (hash === 'guided') S.mode = 'guided';
else if (hash === 'mystery') S.mode = 'mystery';
syncBar();
update();
requestAnimationFrame(tick);
addEventListener('hashchange', () => { const m = location.hash.replace('#', '').match(/^(lamp|blower|relay|series|draw)/); if (m) switchCircuit(m[1]); });

/* test hook */
window.__etb = {S, update, bench, setFault, act, setMode, enterStep, switchCircuit, get C(){ return C; }, get R(){ return R; }, get RD(){ return RD; }, get LESSONS(){ return C.lessons; },
  probe(r, b, knob, jack){ S.tips.dmmR = r; S.tips.dmmB = b; if (knob) S.dmm.knob = knob; if (jack) S.dmm.jack = jack; update(); return {val:RD.val, unit:RD.unit, t:RD.it && RD.it.t, chip:RD.it && RD.it.chip && RD.it.chip[0], p:RD.it && RD.it.p}; }};
})();
</script>

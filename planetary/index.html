<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planetary Gear Sandbox</title>
<meta name="description" content="Pick the input, held and output members of a planetary gearset and see the ratio, direction and lever diagram. Then follow power flow through a GM 4L60-E and a ZF 8HP-style 8-speed with live apply charts, and diagnose failed clutches and bands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Same single-theme dark "instrument" look as the other STECH tools. 2D views:
   gearset face view(s), lever diagram(s), result, combination / apply chart, notebook. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0; --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --sun:#4FA3E3; --car:#3DDC97; --ring:#FFB224; --pin:#9FB3C8;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);color:var(--accent)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:7px;font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg.mini{padding:2px}.seg.mini button{padding:5px 8px;font-size:10px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 9px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:10px}
.views{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead span{font-size:11.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.vbox{flex:1;min-height:0;padding:0 8px 8px}
.vbox svg{width:100%;height:100%;display:block}
#pGear{grid-column:1/3}
#pChart{grid-column:2/4}
.svgt{font:600 10.5px var(--f-label);fill:#8A98A8;letter-spacing:.04em}
.svgs{font:600 9px var(--f-label);fill:#5A6773;letter-spacing:.08em;text-transform:uppercase}
.svgv{font:500 11px var(--f-mono);fill:#E6EDF3}
.ro{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 6px}
.big b{font:600 26px/1 var(--f-mono)}
.chip{padding:3px 7px;border-radius:999px;font:700 10px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--soft)}
.chip.ok{border-color:rgba(61,220,151,.5);color:#C9F7E2}
.chip.warn{border-color:rgba(255,178,36,.55);color:#FFE2A8}
.chip.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
.chip.info{border-color:rgba(47,155,224,.55);color:#CFE8F8}
table.rt{width:100%;border-collapse:collapse;font:500 12px/1.2 var(--f-mono)}
table.rt th{font:600 9.5px/1.15 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.rt td{text-align:center;padding:5px 3px;border-bottom:1px solid #151d26;color:var(--soft)}
table.rt th:first-child,table.rt td:first-child{text-align:left;font-family:var(--f-ui);font-size:12.5px;color:var(--dim)}
table.rt td.r,table.rt th.r{text-align:right}
table.rt tr.sel td{background:rgba(47,155,224,.12)}
table.rt tr.click{cursor:pointer}
table.rt tr.click:hover td{background:rgba(255,255,255,.03)}
table.rt td.A{color:#fff;font-weight:700}
table.rt td.A span,table.rt td.H span,table.rt td.O span{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:5px;padding:0 3px}
table.rt td.A span{background:var(--accent)}
table.rt td.H span{background:#2b6c50;color:#C9F7E2}
table.rt td.O span{border:1px dashed var(--line-2);color:var(--dim)}
table.rt td.X span{background:rgba(255,90,78,.25);color:#FFD2CD}
.flowtxt{font-size:12.5px;color:var(--soft);margin:6px 0 0;padding-left:16px}
.flowtxt li{margin:2px 0}
.locked{padding:14px;border:1px dashed var(--line-2);border-radius:10px;color:var(--dim);font-size:13px;text-align:center;margin:4px 0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font-size:14px;color:var(--soft)}
.pbody p{margin:0 0 9px}
.pbody h3{margin:2px 0 8px;font:600 17px/1.2 var(--f-label);color:var(--fg)}
.pbody h4{margin:14px 0 7px;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim);font-size:13px}
.sl{display:grid;grid-template-columns:90px minmax(0,1fr) 54px;gap:8px;align-items:center;margin:3px 0}
.sl label{font-size:12.5px;color:var(--dim)}
.sl output{font:500 12px/1 var(--f-mono);text-align:right;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.rowb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rowb .lbl{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);min-width:64px}
.rowb .lbl.sun{color:var(--sun)}.rowb .lbl.car{color:var(--car)}.rowb .lbl.ring{color:var(--ring)}
.els{display:grid;gap:5px}
.el{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--raise);font-size:13px}
.el[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26);color:var(--fg)}
.el small{color:var(--dim);font-size:11.5px}
.cards{display:grid;gap:6px}
.card{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.card:hover{border-color:#3a4a5c}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,#132433,#101b26)}
.card b{color:var(--fg);font:600 14px/1.25 var(--f-label)}
.card span{font-size:12.5px;color:var(--dim)}
.msg{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);color:var(--soft);margin:6px 0}
.msg.ok{border-color:rgba(61,220,151,.45);color:#C9F7E2}
.msg.bad{border-color:rgba(255,90,78,.45);color:#FFD2CD}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font:700 13px/1 var(--f-label);color:var(--fg)}
.lcard.done .n{background:var(--ok);color:#06140d}
.lcard b{display:block;color:var(--fg);font:600 14px/1.25 var(--f-label)}
.lcard span span{font-size:12.5px;color:var(--dim)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lhead .k{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:#2b6c50}.dots i.on{background:var(--accent)}
.goal{padding:9px 11px;border-radius:10px;border:1px dashed rgba(47,155,224,.5);background:rgba(47,155,224,.07);color:#CFE8F8;font-size:13.5px;margin:6px 0 10px}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07);color:#C9F7E2}
.qq{color:var(--fg)}
.mc{display:grid;gap:6px;margin:6px 0 10px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover:not([disabled]){border-color:#3a4a5c;color:var(--fg)}
.mc button.right{border-color:var(--ok);background:rgba(61,220,151,.1);color:#C9F7E2}
.mc button.wrong{border-color:rgba(255,90,78,.6);background:rgba(255,90,78,.08);color:#FFD2CD}
.mc button[disabled]{cursor:default}
.why{padding:9px 11px;border-radius:10px;background:#0b1a14;border:1px solid rgba(61,220,151,.3);color:#BFEBD6;font-size:13.5px;margin:0 0 10px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav .sp{flex:1}
.case{padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121b24,#0e151c)}
.case p{margin:4px 0 0}
.qk{display:inline-block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.score div{padding:7px 8px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.score small{display:block;font:600 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 16px/1.3 var(--f-mono);color:var(--fg)}
.mprog{display:grid;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.mprog>span{font:700 9.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdots{display:flex;gap:4px;flex-wrap:wrap}
.mdots i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}
.mdots i.r{background:var(--ok)} .mdots i.t{background:var(--warn)} .mdots i.cur{background:var(--accent)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:6px 0}
.tests .btn{white-space:normal;text-align:center;line-height:1.2;padding:8px 8px}
.tests .btn.used{border-color:rgba(61,220,151,.4);color:#C9F7E2}
.find{display:grid;gap:6px;margin:6px 0}
.find .f{padding:8px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px}
.find .f > b{display:block;font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.find .f div{margin:2px 0}
.find .f .bad{color:#FFC2BC}.find .f .warn{color:#FFE2A8}.find .f .ok{color:#BFEBD6}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:10px;font:600 13px/1.2 var(--f-ui);background:#13202b;border:1px solid var(--line-2);max-width:min(520px,calc(100% - 32px));text-align:center}
#toast.good{border-color:rgba(61,220,151,.6);color:#C9F7E2}
#toast.bad{border-color:rgba(255,90,78,.6);color:#FFD2CD}
@media (max-width: 1099px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .views{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #pGear{grid-column:1/-1;height:380px}
  #pChart{grid-column:1/-1;height:auto;min-height:260px}
  #pLever,#pRes{height:300px}
  .main>.panel{height:640px}
}
@media (max-width: 640px){ .views{grid-template-columns:minmax(0,1fr)} #pGear{height:280px} .brand p{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="6.2" r="2.4"/><circle cx="7" cy="15" r="2.4"/><circle cx="17" cy="15" r="2.4"/></svg></div>
      <div><h1>Planetary Gear Sandbox</h1><p>Ratios · power flow · apply charts</p></div>
    </div>
    <div class="seg modes" id="modes" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="trans">Transmissions</button><button data-m="guided">Guided</button><button data-m="diagnose">Diagnose</button></div>
  </header>
  <div class="main">
    <div class="views">
      <section class="panel" id="pGear" aria-label="Gearsets"><div class="phead"><h2 id="gTitle">Gearset</h2><span id="gSub"></span><div class="r"><span class="seg mini" id="spd" role="group" aria-label="Animation speed"><button data-v="0">Pause</button><button data-v="1" aria-pressed="true">Slow</button><button data-v="2.5">Fast</button></span></div></div><div class="vbox"><svg id="svGear" viewBox="0 0 640 320" role="img" aria-label="Face view of the planetary gearset(s): sun, planet pinions on the carrier, and ring gear, turning at their true relative speeds"></svg></div></section>
      <section class="panel" id="pLever" aria-label="Lever diagram"><div class="phead"><h2>Lever diagram</h2><span id="lSub">speed at each member</span></div><div class="vbox"><svg id="svLever" viewBox="0 0 300 300" role="img" aria-label="Lever analogy: each gearset is a lever; arrow length shows each member's speed"></svg></div></section>
      <section class="panel" id="pRes" aria-label="Result"><div class="phead"><h2>Result</h2><span id="rSub"></span></div><div class="ro" id="res"></div></section>
      <section class="panel" id="pChart" aria-label="Chart"><div class="phead"><h2 id="cTitle">Combinations</h2><span id="cSub"></span></div><div class="ro" id="chart"></div></section>
    </div>
    <section class="panel" aria-label="Notebook"><div class="tabs" id="tabs" role="tablist"></div><div class="pbody" id="pbody"></div></section>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const f0 = n => (Math.round(n) || 0).toLocaleString('en-US');
const r3 = n => (Math.abs(n) < 5e-4 ? 0 : n).toFixed(3);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

/* ================= kinematics: gearsets + constraints → member speeds (input = 1) ================= */
// Willis equation per simple gearset: ωs·S + ωr·R = ωc·(S + R)
function solve(nodes, sets, cons) {
  const idx = Object.fromEntries(nodes.map((n, i) => [n, i])), N = nodes.length, rows = [];
  for (const g of sets) { const r = Array(N + 1).fill(0); r[idx[g.s]] += g.S; r[idx[g.r]] += g.R; r[idx[g.c]] -= g.S + g.R; rows.push(r); }
  for (const k of cons) { const r = Array(N + 1).fill(0); if (k.t === 'hold') r[idx[k.a]] = 1; else if (k.t === 'join') { r[idx[k.a]] += 1; r[idx[k.b]] -= 1; } else if (k.t === 'in') { r[idx[k.a]] = 1; r[N] = 1; } rows.push(r); }
  const M = rows.map(r => r.slice()), piv = []; let row = 0;
  for (let col = 0; col < N && row < M.length; col++) {
    let p = row; for (let i = row; i < M.length; i++) if (Math.abs(M[i][col]) > Math.abs(M[p][col])) p = i;
    if (Math.abs(M[p][col]) < 1e-9) continue;
    [M[row], M[p]] = [M[p], M[row]];
    for (let i = 0; i < M.length; i++) if (i !== row) { const f = M[i][col] / M[row][col]; for (let j = col; j <= N; j++) M[i][j] -= f * M[row][j]; }
    piv.push(col); row++;
  }
  for (let i = row; i < M.length; i++) if (Math.abs(M[i][N]) > 1e-6) return { bind: true, v: {} };
  const v = {}, free = new Set(nodes.map((_, i) => i).filter(i => !piv.includes(i)));
  piv.forEach((col, r) => { let det = true; for (let j = 0; j < N; j++) if (j !== col && Math.abs(M[r][j]) > 1e-9 && free.has(j)) det = false; v[nodes[col]] = det ? M[r][N] / M[r][col] : null; });
  for (const i of free) v[nodes[i]] = null;
  return { v, bind: false };
}

/* ================= transmissions ================= */
const TRANS = {
  '4l60e': {
    name: 'GM 4L60-E', sub: '4-speed RWD · two simple gearsets',
    nodes: ['in', 'out', 'is', 'irc', 'rs'],
    names: { in: 'Input shaft', out: 'Output shaft', is: 'Input sun', irc: 'Input ring / reaction carrier', rs: 'Reaction sun' },
    sets: [{ id: 'Input set', s: 'is', c: 'out', r: 'irc', S: 34, R: 70, cs: 'Input sun', cc: 'Input carrier → output', cr: 'Input ring = reaction carrier' },
           { id: 'Reaction set', s: 'rs', c: 'irc', r: 'out', S: 34, R: 78, cs: 'Reaction sun', cc: 'Reaction carrier = input ring', cr: 'Reaction ring → output' }],
    els: [
      { k: 'band', n: '2-4 band', t: 'hold', a: 'rs', d: 'holds the reaction sun' },
      { k: 'rev', n: 'Reverse input clutch', t: 'join', a: 'in', b: 'rs', d: 'drives the reaction sun' },
      { k: 'ovr', n: 'Overrun clutch', t: 'join', a: 'in', b: 'is', d: 'drives the input sun (bypasses the sprag; engine braking)' },
      { k: 'fwd', n: 'Forward clutch + sprag', t: 'join', a: 'in', b: 'is', ow: 'drive', d: 'drives the input sun through the forward sprag' },
      { k: 'c34', n: '3-4 clutch', t: 'join', a: 'in', b: 'irc', d: 'drives the input ring / reaction carrier' },
      { k: 'roll', n: 'Lo roller clutch', t: 'hold', a: 'irc', ow: 'hold', d: 'holds the reaction carrier (one-way)' },
      { k: 'lr', n: 'Low/reverse clutch', t: 'hold', a: 'irc', d: 'holds the reaction carrier' },
    ],

  { body: 'Set: <b>Carrier = Input</b>, <b>Sun = Held</b>, <b>Ring = Output</b>.', setup: { reset: true, role: { s: 'free', c: 'free', r: 'free' } }, ctl: true, goal: { check: () => isRoles('held', 'in', 'out'), hint: 'Carrier Input · Sun Held · Ring Output.' } },
  { body: '', ctl: true, goal: { mc: { q: 'What is the ring doing?', opts: ['Turning the same way, faster than the input: overdrive, ratio = R ÷ (S + R), below 1', 'Turning slower', 'Turning backward'], a: 0, why: 'Carrier in → overdrive. Lower engine rpm at highway speed. The 4L60-E\'s 4th gear works this way in its reaction set.' } } },
] },
{ id: 'rev', title: 'Reverse', sub: 'Carrier held', steps: [
  { body: 'Set: <b>Carrier = Held</b>, <b>Sun = Input</b>, <b>Ring = Output</b>.', setup: { reset: true, role: { s: 'free', c: 'free', r: 'free' } }, ctl: true, goal: { check: () => isRoles('in', 'held', 'out'), hint: 'Sun Input · Carrier Held · Ring Output.' } },
  { body: '', ctl: true, goal: { mc: { q: 'Look at the lever diagram and the gears. Why does the ring turn backward?', opts: ['With the carrier held, the planets are just idler gears: sun one way, planets the other, ring the same way as the planets', 'The input is reversed', 'It\'s slipping'], a: 0, why: 'Carrier held → reverse. Ratio = −R ÷ S (a reduction in reverse).' } } },
  { body: 'Now lock it up: set <b>Clutch = Lock sun to carrier</b> and the <b>Carrier to Free</b>.', ctl: true, goal: { check: () => S.sb.lock && role().c !== 'held', hint: 'Clutch: Lock sun to carrier; Carrier: not Held.' } },
  { body: '', ctl: true, goal: { mc: { q: 'Two members locked together. What do you get?', opts: ['Direct drive 1:1: the whole set turns as one unit', 'Reverse', 'Neutral'], a: 0, why: 'Lock any two members and the third must follow. That\'s how most transmissions make 3rd (or 6th) gear: 1:1.' } } },
] },
{ id: 'lever', title: 'The lever diagram', sub: 'How techs draw power flow', steps: [
  { body: 'The <b>lever analogy</b> turns a gearset into a straight lever: ring at the top, carrier in the middle, sun at the bottom. Arrow length = speed. Because speeds fall on a straight line, holding one point and driving another sets the third.', setup: { reset: true } },
  { body: '', goal: { mc: { q: 'Where is the carrier on the lever?', opts: ['Closer to the ring: the ring–carrier distance is the sun\'s tooth count, and the carrier–sun distance is the ring\'s', 'Exactly in the middle', 'At the end'], a: 0, why: 'That spacing is why holding the ring and driving the sun gives a big reduction: the carrier sits close to the held end.' } } },
  { body: 'Make the <b>sun bigger</b>: 40 teeth or more.', ctl: true, goal: { check: () => S.sb.S >= 40, hint: 'Sun slider ≥ 40 T.' } },
  { body: '', ctl: true, goal: { mc: { q: 'With a bigger sun (ring held, sun in), what happened to the ratio?', opts: ['Smaller reduction: (S + R) ÷ S gets closer to 1', 'Bigger reduction', 'No change'], a: 0, why: 'Engineers pick tooth counts (and stack gearsets) to get the ratios they want.' } } },
] },
{ id: 'l60', title: '4L60-E power flow', sub: 'Two simple sets, one apply chart', view: 'trans', steps: [
  { body: 'The 4L60-E uses two simple gearsets. The <b>input carrier</b> and <b>reaction ring</b> are both splined to the output. The <b>input ring</b> and <b>reaction carrier</b> are one piece. Pick range <b>D1</b>.', setup: { tk: '4l60e', applied: [] }, ctl: 'trans', goal: { check: () => S.tk === '4l60e' && sameSet(S.applied, ['fwd', 'roll']), hint: 'Range: D1.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'In D1, what is held, and by what?', opts: ['The reaction carrier (= input ring), held by the lo roller clutch, while the forward sprag drives the input sun', 'The reaction sun, by the 2-4 band', 'Nothing'], a: 0, why: 'Sun in, ring held, carrier out: the input set makes a big reduction (3.06:1).' } } },
  { body: 'Pick <b>D2</b>.', ctl: 'trans', goal: { check: () => sameSet(S.applied, ['band', 'fwd']), hint: 'Range: D2.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'What changed from 1st to 2nd?', opts: ['The 2-4 band now holds the reaction sun; the lo roller clutch overruns', 'The 3-4 clutch applied', 'Reverse input applied'], a: 0, why: 'Only one element applied. The one-way clutch released by itself: a smooth, simple shift.' } } },
  { body: 'Pick <b>D4</b> and look at the forward sprag column.', ctl: 'trans', goal: { check: () => sameSet(S.applied, ['band', 'fwd', 'c34']), hint: 'Range: D4.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'The forward clutch is still applied in 4th. Why doesn\'t it fight the other elements?', opts: ['The input sun spins faster than the input, so the forward sprag overruns (O)', 'It\'s actually released', 'The band slips'], a: 0, why: 'The 3-4 clutch drives the reaction carrier, the band holds the reaction sun: the reaction set overdrives (0.70:1).' } } },
  { body: 'Now break the rules: turn on the <b>Low/reverse clutch</b> while in D4.', ctl: 'trans', goal: { check: () => S.applied.includes('lr') && S.applied.includes('c34') && S.applied.includes('band'), hint: 'Turn on Low/reverse clutch with D4 applied.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'What does the result show?', opts: ['A tie-up: the 3-4 clutch drives the same part the low/reverse clutch holds', 'A new gear', 'Neutral'], a: 0, why: 'A stuck valve or a dragging clutch can cause a "tie-up" like this: harsh shifts, a bound-up feel, burnt clutches.' } } },
] },
{ id: 'zf', title: '8-speed apply chart', sub: 'Three of five, one swap per shift', view: 'trans', steps: [
  { body: 'The ZF 8HP uses four simple gearsets and only <b>five</b> shift elements: brakes A and B, clutches C, D and E. Pick gear <b>1</b>.', setup: { tk: '8hp', applied: [] }, ctl: 'trans', goal: { check: () => S.tk === '8hp' && sameSet(S.applied, ['A', 'B', 'C']), hint: 'Range: 1.' } },
  { body: 'Step up through gears <b>2</b>, <b>3</b> … to <b>8</b> and watch the chart. Stop on <b>8</b>.', ctl: 'trans', goal: { check: () => sameSet(S.applied, ['A', 'D', 'E']), hint: 'Range: 8.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'What pattern do you see?', opts: ['Three elements are applied in every gear, and each upshift swaps just one of them', 'Every element changes every shift', 'Only one element per gear'], a: 0, why: 'A single swap per shift keeps shift timing simple and smooth. Five elements make eight forward gears plus reverse.' } } },
  { body: 'Add a fourth element: turn on <b>Clutch C</b> while in 8th.', ctl: 'trans', goal: { check: () => sameSet(S.applied, ['A', 'C', 'D', 'E']), hint: 'Turn on Clutch C with gear 8 applied.' } },
  { body: '', ctl: 'trans', goal: { mc: { q: 'Why is that a problem?', opts: ['Four elements over-constrain the gear train: it binds (tie-up)', 'It makes 9th gear', 'Nothing happens'], a: 0, why: 'Each gear needs exactly enough constraints. One extra and the parts fight each other.' } } },
  { body: 'Diagnosis trick: a car has <b>no 1st, 2nd, 7th, 8th or reverse</b>, but 3rd–6th are fine. Look at the chart.', ctl: 'trans', goal: { mc: { q: 'Which element failed?', opts: ['Brake A: it\'s in every missing gear and in none of the working ones', 'Clutch D', 'Brake B'], a: 0, why: 'That\'s the apply-chart method. Use it in Diagnose mode.' } } },
] },
];
function curStep() { return S.lesson ? S.lesson.steps[S.step] : null; }
function applySetup(su) {
  if (!su) return;
  if (su.reset) S.sb = SB();
  if (su.role) S.sb.role = { ...su.role };
  if (su.tk) S.tk = su.tk;
  if (su.applied) S.applied = su.applied.slice();
}
function enterStep() { const st = curStep(); if (!st) return; S.mcPick = []; S.stepOk = !st.goal; applySetup(st.setup); renderPanel(); renderViews(); }
function checkGoal() {
  const g = curStep()?.goal; if (S.mode !== 'guided' || !g || S.stepOk || !g.check) return;
  if (g.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderPanel(); }
}
function lessonsHTML() {
  if (!S.lesson) {
    let h = `<p>Short guided lessons. Each one sets things up, tells you what to change and watch, and checks your answer.</p><div class="cards">`;
    LESSONS.forEach((l, i) => { h += `<button class="lcard${S.done.has(l.id) ? ' done' : ''}" data-act="les:${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span></button>`; });
    return h + '</div>';
  }
  const L = S.lesson, st = curStep(), g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${LESSONS.indexOf(L) + 1} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g) {
    if (g.mc) h += `<p class="qq">${g.mc.q}</p><div class="mc">${g.mc.opts.map((o, i) => `<button data-act="mc:${i}" class="${S.stepOk && i === g.mc.a ? 'right' : S.mcPick.includes(i) ? 'wrong' : ''}"${S.stepOk ? ' disabled' : ''}>${o}</button>`).join('')}</div>${S.stepOk ? `<div class="why">${g.mc.why}</div>` : ''}`;
    else h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? '✓ Done.' : '◎ ' + g.hint}</div>`;
  }
  h += `<div class="nav"><button class="btn small" data-act="nav:back"${S.step ? '' : ' disabled'}>Back</button><button class="btn small" data-act="nav:list">All lessons</button><span class="sp"></span><button class="btn small primary" data-act="nav:next"${S.stepOk ? '' : ' disabled'}>${S.step === L.steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  if (st.ctl === 'trans') h += `<h4>Controls</h4>` + transCtl(true);
  else if (st.ctl) h += `<h4>Controls</h4>` + sandCtl();
  return h;
}

/* ================= notebook / modes ================= */
const TABS = { explore: [['ctl', 'Controls']], trans: [['tctl', 'Controls']], guided: [['les', 'Lessons']], diagnose: [['case', 'Case']] };
function renderPanel() {
  const list = TABS[S.mode]; if (!list.some(t => t[0] === S.tab)) S.tab = list[0][0];
  $('#tabs').innerHTML = list.map(([k, n]) => `<button role="tab" data-act="tab:${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  const b = $('#pbody'), keep = b.scrollTop;
  b.innerHTML = S.tab === 'ctl' ? sandCtl() : S.tab === 'tctl' ? transCtl() : S.tab === 'les' ? lessonsHTML() : caseHTML();
  b.scrollTop = keep;
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m; S.ang = {};
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
  if (m === 'explore') S.sb = SB();
  if (m === 'trans') { S.applied = TRANS[S.tk].rows.find(r => r.g === (S.tk === '8hp' ? '1' : 'D1')).els.slice(); }
  if (m === 'guided') { S.lesson = null; S.sb = SB(); }
  if (m === 'diagnose') { if (!S.dx || S.dx.solved) newCase(); else { S.tk = S.dx.tk; } }
  renderPanel(); renderViews();
}
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function changed() { renderViews(); checkGoal(); }
function setRole(k, r) {
  const sb = S.sb;
  if (r === 'in' || r === 'out' || r === 'held') for (const o of ['s', 'c', 'r']) if (o !== k && sb.role[o] === r) sb.role[o] = 'free';
  sb.role[k] = r;
  if (r === 'held' && sb.lock && (k === 's' || k === 'c')) sb.lock = false;
}
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const p = b.dataset.act.split(':'), a = p[0], v = p[1];
  switch (a) {
    case 'tab': S.tab = v; renderPanel(); break;
    case 'role': setRole(p[1], p[2]); renderPanel(); changed(); break;
    case 'lock': S.sb.lock = v === '1'; if (S.sb.lock) for (const k of ['s', 'c']) if (S.sb.role[k] === 'held') S.sb.role[k] = 'free'; renderPanel(); changed(); break;
    case 'sbreset': S.sb = SB(); renderPanel(); changed(); break;
    case 'tk': S.tk = v; S.applied = TRANS[v].rows.find(r => r.g === (v === '8hp' ? '1' : 'D1')).els.slice(); S.ang = {}; renderPanel(); changed(); break;
    case 'row': { const r = T_().rows.find(x => x.g === p.slice(1).join(':')); S.applied = r.els.slice(); renderPanel(); changed(); break; }
    case 'el': S.applied = S.applied.includes(v) ? S.applied.filter(x => x !== v) : [...S.applied, v]; renderPanel(); changed(); break;
    case 'test': runTest(v); break;
    case 'air': airTest(v); break;
    case 'dx': S.dx.pick = v; S.dx.wrong = null; renderPanel(); break;
    case 'dxsubmit': submitDx(); break;
    case 'newcase': newCase(); break;
    case 'les': S.lesson = LESSONS.find(l => l.id === v); S.step = 0; S.ang = {}; enterStep(); break;
    case 'nav':
      if (v === 'list') { S.lesson = null; renderPanel(); renderViews(); }
      else if (v === 'back' && S.step > 0) { S.step--; enterStep(); }
      else if (v === 'next' && S.stepOk) {
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); store.set('planet.done', JSON.stringify([...S.done])); toast(`✓ Lesson complete: ${S.lesson.title}`, 'good'); S.lesson = null; renderPanel(); renderViews(); }
      }
      break;
    case 'mc': { const g = curStep()?.goal?.mc; if (!g || S.stepOk) break; const n = +v; if (n === g.a) S.stepOk = true; else { if (!S.mcPick.includes(n)) S.mcPick.push(n); toast('Not quite. Try another answer.', 'bad'); } renderPanel(); break; }
  }
}
$('#modes').addEventListener('click', e => { const m = e.target.closest('button')?.dataset.m; if (m) setMode(m); });
$('#pbody').addEventListener('click', onAct);
$('#tabs').addEventListener('click', onAct);
$('#chart').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-combo], tr[data-row]'); if (!tr) return;
  if (tr.dataset.combo) { const [h, i, o] = tr.dataset.combo; S.sb.lock = false; S.sb.role = { s: 'free', c: 'free', r: 'free' }; S.sb.role[h] = 'held'; S.sb.role[i] = 'in'; S.sb.role[o] = 'out'; }
  else { const r = T_().rows.find(x => x.g === tr.dataset.row); S.applied = r.els.slice(); }
  renderPanel(); changed();
});
$('#pbody').addEventListener('input', e => {
  const t = e.target, k = t.dataset.c; if (!k) return;
  let v = +t.value;
  if (k === 'rpm') { S.rpm = v; $('#o-rpm').textContent = v; }
  else {
    S.sb[k] = v;                                   // both sliders step by 2 from even values, so ring − sun stays even
    if (S.sb.R - S.sb.S < 16) { if (k === 'S') S.sb.R = S.sb.S + 16; else S.sb.S = S.sb.R - 16; }
    $('#o-S').textContent = S.sb.S + ' T'; $('#o-R').textContent = S.sb.R + ' T';
  }
  S.ang = {}; changed();
});
$('#pbody').addEventListener('change', e => { if (e.target.dataset.c) renderPanel(); });

renderPanel(); renderViews();
const hm = location.hash.slice(1); if (TABS[hm]) setMode(hm);
window.__PG = { S, solve, transSolve, rowResult, rangeStatus, TRANS, sandSolve, setMode, newCase, runTest, airTest, testOut, LESSONS, CAUSES, curStep, renderViews, renderPanel, get BAG() { return BAG; },
  act(a) { const b = [...document.querySelectorAll('#pbody [data-act], #tabs [data-act]')].find(x => x.dataset.act === a); if (!b) return false; b.click(); return true; } };
})();
</script>

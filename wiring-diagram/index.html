  return h;
}
function susHtml(g, who, solved){
  let h = `<div class="nav"><button type="button" class="btn primary small" data-sus="${who}:check"${solved ? ' disabled' : ''}>Check</button><button type="button" class="btn small" data-sus="${who}:clear"${solved ? ' disabled' : ''}>Clear picks</button><span class="hint">${S.sus.size} picked</span>${!solved && S.susRes && !S.susRes.ok ? `<button type="button" class="btn small" data-sus="${who}:show">Show answer</button>` : ''}</div>`;
  if (S.susRes && !S.susRes.ok && !solved){
    const r = S.susRes;
    h += `<div class="why">${r.missing.length ? `<b>${r.missing.length} part${r.missing.length > 1 ? 's' : ''} missing.</b> ` : ''}${r.extra.length ? `<b>Can be ruled out:</b> ${r.extra.map(labelOf).join(', ')}. ` : ''}Adjust your picks and check again.</div>`;
  }
  if (solved) h += `<div class="why">${g.why}</div>`;
  return h;
}
function tabLessons(){

    LESSONS.forEach((l, i) => {
      if (l.dg !== lastDg){ lastDg = l.dg; h += `<h4>${DIAGRAMS[l.dg].name}</h4>`; }
      h += `<button type="button" class="lcard${S.done.has(l.id) ? ' done' : ''}" data-les="${l.id}"><span class="n">${S.done.has(l.id) ? '✓' : i + 1}</span><span><b>${l.title}</b><span>${l.sub} · ${l.steps.length} steps</span></span><span class="dg">${DIAGRAMS[l.dg].level}</span></button>`;
    });

  }
  const L = S.lesson, st = curStep(), n = LESSONS.indexOf(L) + 1, g = st.goal;
  let h = `<div class="lhead"><span class="k">Lesson ${n} · Step ${S.step + 1} of ${L.steps.length}</span><span class="dots">${L.steps.map((_, i) => `<i class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}"></i>`).join('')}</span></div><h3>${L.title}</h3>`;
  if (st.body) h += `<p>${st.body}</p>`;
  if (g){
    if (g.mc) h += mcHtml(g.mc, S.mcPick, S.stepOk, 'les');
    else if (g.sus) { h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? ICON_OK : ICON_GOAL}<span>${S.stepOk ? 'Correct.' : 'Tap parts on the diagram to pick them. Tap again to un-pick.'}</span></div>` + susHtml(g.sus, 'les', S.stepOk); }
    else {
      const prog = g.trace ? ` (${S.picks.length} of ${g.trace.length})` : '';
      h += `<div class="goal${S.stepOk ? ' ok' : ''}">${S.stepOk ? ICON_OK : ICON_GOAL}<span>${S.stepOk ? 'Done.' : (g.hint || 'Your turn.') + prog}</span></div>`;
    }
  }
  const last = S.step === L.steps.length - 1;
  h += `<div class="nav"><button type="button" class="btn small" data-nav="back"${S.step ? '' : ' disabled'}>Back</button><button type="button" class="btn small" data-nav="list">All lessons</button>${g && !S.stepOk && (g.trace || g.tap) ? '<button type="button" class="btn small" data-nav="show">Show me</button>' : ''}<span class="sp"></span><button type="button" class="btn primary" data-nav="next"${S.stepOk ? '' : ' disabled'}>${last ? 'Finish' : 'Next'}</button></div>`;
  return h;
}
function tabPractice(){
  const p = S.prac;
  if (!p || p.dg !== S.dg) { startPractice(); return tabPractice(); }
  let h = `<div class="score"><div><small>First try</small><b>${p.right} / ${p.total}</b></div><div><small>Streak</small><b>${p.streak}</b></div><div><small>Left</small><b>${p.bag.length + (p.cur != null && !p.answered ? 1 : 0)}</b></div></div>`;
  if (p.finished){
    const pct = p.total ? Math.round(p.right / p.total * 100) : 0;
    return h + `<h3>Set complete</h3><p>You got <b>${p.right} of ${p.total}</b> right on the first try (${pct}%). Best streak: <b>${p.best}</b>.</p><div class="nav"><button type="button" class="btn primary" data-prac="again">Start a new round</button></div>`;
  }
  const q = curQ();
  const kind = {find:'Find it', mc:'Read it', trace:'Trace it', sus:'What could cause it?'}[q.k];
  h += `<span class="qk">${kind}</span>`;
  if (q.k === 'mc') h += mcHtml(q, p.pick, p.answered, 'prac');
  else {
    h += `<p class="qq">${q.q}</p>`;
    if (q.k === 'find') h += `<div class="goal${p.answered ? ' ok' : ''}">${p.answered ? ICON_OK : ICON_GOAL}<span>${p.answered ? (p.tries ? 'Found it.' : 'Correct on the first try.') : p.tries ? `Try again (${p.tries} miss${p.tries > 1 ? 'es' : ''}).` : 'Tap it on the diagram.'}</span></div>`;
    if (q.k === 'trace') h += `<div class="goal${p.answered ? ' ok' : ''}">${p.answered ? ICON_OK : ICON_GOAL}<span>${p.answered ? (p.miss ? 'Traced, with a miss along the way.' : 'Traced perfectly.') : `Tap each wire and part in order (${S.picks.length} of ${q.path.length}).`}</span></div>`;
    if (q.k === 'sus') h += susHtml(q, 'prac', p.answered);
    if (p.answered && q.k !== 'sus' && q.why) h += `<div class="why">${q.why}</div>`;
  }
  h += `<div class="nav">${!p.answered && (q.k === 'find' || q.k === 'trace') && (p.tries >= 2 || p.miss) ? '<button type="button" class="btn small" data-prac="show">Show me</button>' : ''}<span class="sp"></span><button type="button" class="btn primary" data-prac="next"${p.answered ? '' : ' disabled'}>Next question</button></div>`;
  return h;
}
function renderNotebook(){
  renderTabs();
  const el = $('#nbody');
  el.innerHTML = S.tab === 'sym' ? tabSymbols() : S.tab === 'read' ? tabRead() : S.tab === 'les' ? tabLessons() : tabPractice();
  const vb = document.querySelector('[data-c="volt"]');
  const q = S.mode === 'practice' && curQ();
  vb.disabled = !!(q && !S.prac.answered && (q.noVolt));
}

/* ================= toasts & picker ================= */
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast' + (kind ? ' ' + kind : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2600);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
}
function openPicker(){
  const pop = $('#pop'), b = $('#pickBtn').getBoundingClientRect();
  pop.innerHTML = `<h4>Diagrams</h4><div class="lib">` + DG_ORDER.map(id => { const d = DIAGRAMS[id]; return `<button type="button" class="card${id === S.dg ? ' cur' : ''}" data-dg="${id}"><span class="tag${id === S.dg ? ' now' : ''}">${d.level}</span><b>${d.name}</b><span>${d.sub}</span></button>`; }).join('') +
    DG_SOON.map(d => `<div class="card" aria-disabled="true"><span class="tag">Coming</span><b>${d.name}</b><span>${d.sub}</span></div>`).join('') + '</div>';
  pop.hidden = false; pop.style.left = Math.max(16, Math.min(b.left, innerWidth - pop.offsetWidth - 16)) + 'px'; pop.style.top = (b.bottom + 8) + 'px';
  $('#pickBtn').setAttribute('aria-expanded', 'true');
}
function closePicker(){ $('#pop').hidden = true; $('#pickBtn').setAttribute('aria-expanded', 'false'); }

/* ================= events ================= */
function afterChange(){ render(); checkGoal(); renderInspector(); if (S.mode !== 'explore') renderNotebook(); }
function handleTap(id){
  S.sel = id || null;
  if (S.mode === 'guided' && S.lesson) lessonTap(id);
  if (S.mode === 'practice' && S.prac) pracTap(id);
  renderHalos(); renderInspector();
}
function setMode(m){
  S.mode = m; S.spot = []; S.picks = []; S.sus = new Set();
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  if (m === 'explore') { S.lesson = null; resetBench(); }
  if (m === 'guided') { S.lesson = null; }
  if (m === 'practice') { S.prac = null; resetBench(); }
  S.tab = null;
  render(); renderInspector(); renderNotebook();
  $('#dHint').textContent = m === 'explore' ? 'Tap any symbol, wire or connector' : m === 'guided' ? 'Follow the lesson on the right' : 'Answer on the diagram or in the notebook';
}
function syncColorBtns(){ document.querySelectorAll('#colors button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === S.color)); $('#legend').hidden = S.color !== 'volt'; }

function bind(){
  const svg = $('#dg'); let down = null;
  svg.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, vx:VIEW.x, vy:VIEW.y, moved:false, id:e.target.closest('.it')?.dataset.id || null}; try { svg.setPointerCapture(e.pointerId); } catch (_) {} });
  svg.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 6 && VIEW.w < 1000) { down.moved = true; svg.classList.add('panning'); }
    if (down.moved){ const k = VIEW.w / svg.getBoundingClientRect().width; VIEW.x = down.vx - dx * k; VIEW.y = down.vy - dy * k; clampView(); applyView(); }
  });
  svg.addEventListener('pointerup', () => { if (!down) return; const d = down; down = null; svg.classList.remove('panning'); if (!d.moved) handleTap(d.id); });
  svg.addEventListener('pointercancel', () => { down = null; svg.classList.remove('panning'); });
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = svgPt(e); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y); }, {passive:false});
  svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.it')) { e.preventDefault(); handleTap(e.target.closest('.it').dataset.id); } });
  $('#zIn').onclick = () => zoomAt(1.3); $('#zOut').onclick = () => zoomAt(1 / 1.3); $('#zFit').onclick = () => { VIEW = {x:0, y:0, w:1000, h:680}; applyView(); };

  $('#modes').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
  $('#colors').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; S.color = b.dataset.c; syncColorBtns(); afterChange(); };
  $('#resetBtn').onclick = () => {
    VIEW = {x:0, y:0, w:1000, h:680};
    if (S.mode === 'guided' && S.lesson) { resetBench(); enterStep(); }
    else if (S.mode === 'practice' && S.prac) { resetBench(); applySetup(curQ()?.setup); afterChange(); }
    else { resetBench(); afterChange(); }
    syncColorBtns();
  };
  $('#pickBtn').onclick = e => { e.stopPropagation(); $('#pop').hidden ? openPicker() : closePicker(); };
  $('#pop').onclick = e => {
    const c = e.target.closest('[data-dg]'); if (!c) return;
    closePicker(); if (c.dataset.dg === S.dg) return;
    switchDiagram(c.dataset.dg);
    if (S.mode === 'guided') S.lesson = null;
    if (S.mode === 'practice') S.prac = null;
    S.spot = []; S.picks = []; S.sus = new Set();
    render(); renderInspector(); renderNotebook();
    history.replaceState(null, '', '#' + S.dg);
  };
  document.addEventListener('click', e => { if (!$('#pop').hidden && !e.target.closest('#pop') && !e.target.closest('#pickBtn')) closePicker(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

  $('#ctrls').addEventListener('click', e => {
    if (e.target.closest('#hornBtn')) { S.ctl.horn = !S.ctl.horn; afterChange(); return; }
    const k = e.target.closest('[data-key]'); if (k) { S.key = k.dataset.key; afterChange(); return; }
    const gr = e.target.closest('[data-gear]'); if (gr) { S.gear = gr.dataset.gear; afterChange(); return; }
    const ls = e.target.closest('[data-lsw]'); if (ls) { S.lsw = ls.dataset.lsw; afterChange(); return; }
    if (e.target.closest('[data-act="clearf"]')) { S.open = new Set(); S.unplug = new Set(); afterChange(); }
  });
  $('#ctrls').addEventListener('input', e => { if (e.target.id === 'tempIn') { S.temp = +e.target.value; afterChange(); } });

  $('#ibody').addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a){
      const [act, id] = a.dataset.act.split(':');
      if (act === 'open') { S.open.has(id) ? S.open.delete(id) : S.open.add(id); }
      if (act === 'unplug') { S.unplug.has(id) ? S.unplug.delete(id) : S.unplug.add(id); }
      afterChange(); return;
    }
    const f = e.target.closest('[data-flip]'); if (f) { S.flip = f.dataset.flip === '1'; renderInspector(); checkGoal(); return; }
    const hf = e.target.closest('[data-half]'); if (hf) { const [c, i] = hf.dataset.half.split(':'); S.halfOf ??= {}; S.halfOf[c] = +i; renderInspector(); checkGoal(); return; }
    const pn = e.target.closest('[data-pin]'); if (pn) { handleTap(pn.dataset.pin); return; }
    const s = e.target.closest('[data-sel]'); if (s) { handleTap(s.dataset.sel); }
  });

  $('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; renderNotebook(); } };
  $('#nbody').addEventListener('click', e => {
    const l = e.target.closest('[data-les]'); if (l) { startLesson(l.dataset.les); return; }
    const nv = e.target.closest('[data-nav]');
    if (nv){
      const k = nv.dataset.nav;
      if (k === 'list') { S.lesson = null; S.spot = []; S.picks = []; S.sus = new Set(); render(); renderNotebook(); }
      if (k === 'back' && S.step > 0) { S.step--; enterStep(); }
      if (k === 'next'){
        if (S.step < S.lesson.steps.length - 1) { S.step++; enterStep(); }
        else { S.done.add(S.lesson.id); toast('Lesson complete', 'good'); S.lesson = null; S.spot = []; S.picks = []; S.sus = new Set(); render(); renderNotebook(); }
      }
      if (k === 'show'){ const g = curStep().goal; S.spot = g.tap ? g.tap : [].concat(g.trace[S.picks.length]); renderHalos(); }
      return;
    }
    const mc = e.target.closest('[data-mc]');
    if (mc){
      const [who, i] = mc.dataset.mc.split(':'), n = +i;
      if (who === 'les'){
        const m = curStep().goal.mc; S.mcPick = (S.mcPick || []).concat(n);
        if (n === m.a) { S.stepOk = true; } else toast('Not quite. Try again.', 'bad');
      } else {
        const p = S.prac, q = curQ(); p.pick = (p.pick || []).concat(n);
        if (n === q.a) { scoreQ(p.pick.length === 1); afterChange(); return; } else toast('Not quite. Try again.', 'bad');
      }
      renderNotebook(); return;
    }
    const su = e.target.closest('[data-sus]');
    if (su){
      const [who, act] = su.dataset.sus.split(':'), g = who === 'les' ? curStep().goal.sus : curQ();
      if (act === 'clear') { S.sus = new Set(); S.susRes = null; }
      if (act === 'check'){
        S.susRes = susCheck(g);
        if (S.susRes.ok){ if (who === 'les') S.stepOk = true; else scoreQ(!S.prac.miss); toast('✓ Correct', 'good'); }
        else if (who === 'prac') S.prac.miss = true;
      }
      if (act === 'show'){ S.sus = new Set(g.req); S.susRes = null; if (who === 'les') S.stepOk = true; else { S.prac.miss = true; scoreQ(false); } }
      renderHalos(); renderNotebook(); return;
    }
    const pr = e.target.closest('[data-prac]');
    if (pr){
      const k = pr.dataset.prac;
      if (k === 'next') nextQuestion();
      if (k === 'again') startPractice();
      if (k === 'show'){ const q = curQ(); S.spot = q.k === 'find' ? q.ans : [].concat(q.path[S.picks.length]); S.prac.miss = true; S.prac.tries = Math.max(S.prac.tries, 1); renderHalos(); }
    }
  });
}

/* ================= init ================= */
function init(){
  const h = location.hash.replace('#', '').split('-');
  const dg = DIAGRAMS[h[0]] ? h[0] : 'horn', mode = ['explore', 'guided', 'practice'].includes(h[1]) ? h[1] : 'explore';
  loadDiagram(dg); resetBench();
  $('#pickName').textContent = DG.name; $('#pickSub').textContent = DG.sub;
  syncColorBtns(); bind();
  setMode(mode);
}
init();
})();
</script>

</body>

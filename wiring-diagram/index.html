<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive wiring diagrams: decode symbols, wire labels and connector pin views, trace current, and find what is shared.">
<title>Wiring Diagram Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: diagram sheet (left, wide) | inspector over notebook (right). Same single-theme dark
   "instrument" look as the DTC Visualizer and Electrical Test Bench. The diagram itself is drawn on a
   light service-manual sheet, because that is what students read in real service information. */
:root{
  color-scheme: dark;
  --bg:#080B0F; --panel:#0E1319; --panel-2:#0B1015; --raise:#131A22; --line:#1D2732; --line-2:#2A3644;
  --fg:#E6EDF3; --soft:#C5CFD9; --dim:#8A98A8; --faint:#5A6773;
  --accent:#2F9BE0;           /* STECH blue #047BC1, lifted for a dark ground */
  --ok:#3DDC97; --warn:#FFB224; --fail:#FF5A4E;
  --paper:#F6F4EE; --ink:#1B2129; --ink-2:#4A5562; --ink-3:#7C8691;
  --f-ui:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-label:"Barlow Semi Condensed","Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;
  background:radial-gradient(1100px 520px at 18% -12%,rgba(47,155,224,.10),transparent 62%),radial-gradient(900px 500px at 100% 110%,rgba(47,155,224,.05),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:46px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#16222e,#0b1117);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.brand h1{margin:0;font:600 19px/1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
.brand p{margin:4px 0 0;font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.grp{display:flex;align-items:center;gap:7px}
.grp>label{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 11px;border-radius:7px;font:600 11.5px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[disabled]{opacity:.35;cursor:not-allowed}
.seg.mini{padding:2px;border-radius:8px}
.seg.mini button{padding:5px 8px;font-size:10px;border-radius:6px}
.modes button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font:600 11.5px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#3a4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 9px;font-size:10.5px}
.btn.lit{border-color:rgba(47,155,224,.6);background:rgba(47,155,224,.12);color:#BFE3FA}
.btn.danger{border-color:rgba(255,90,78,.5);color:#FFB3AC}
.btn.danger.lit{background:rgba(255,90,78,.14);border-color:var(--fail);color:#FFD2CD}

/* ---------- layout ---------- */
.bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:10px}
.side{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.05fr);gap:10px}
.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.phead{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px 8px;flex-wrap:wrap}
.phead h2{margin:0;font:600 12.5px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.phead>span{font-size:12.5px;color:var(--dim)}
.phead .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.hint{font-size:12px;color:var(--faint)}
.legend{margin-left:auto;display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--f-mono);color:var(--dim);white-space:nowrap}
.legend i{display:block;width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#2457B8,#14969F 17%,#D9A000 40%,#D62839)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px;margin-left:8px}
.legend em::before{content:"";width:16px;border-top:2px dashed #A0A7AF}

/* ---------- picker ---------- */
#pickBtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 11px;border-radius:9px;border:1px solid rgba(47,155,224,.45);background:linear-gradient(180deg,#132030,#0f1822);min-width:0;transition:border-color .15s}
#pickBtn:hover{border-color:var(--accent)}
#pickBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pickName{font:600 13.5px/1 var(--f-label);letter-spacing:.03em;white-space:nowrap}
#pickSub{font-size:12px;color:var(--dim);white-space:nowrap}
#pickBtn svg{color:var(--accent);flex:none}
.pop{position:fixed;z-index:30;padding:12px;border-radius:14px;background:rgba(13,18,24,.98);border:1px solid var(--line-2);box-shadow:0 30px 70px -20px rgba(0,0,0,.95);display:grid;gap:10px;width:min(460px,calc(100% - 32px))}
.pop h4{margin:0;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.card{all:unset;cursor:pointer;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--raise);display:grid;gap:4px;align-content:start;transition:border-color .15s,background .15s}
.card:hover{border-color:#3a4a5c}
.card.cur{border-color:var(--accent);background:linear-gradient(180deg,#132232,#101820)}
.card b{font:600 14.5px/1.15 var(--f-label);letter-spacing:.02em}
.card span{font-size:12px;color:var(--dim)}
.card[aria-disabled="true"]{cursor:default;opacity:.5}
.tag{justify-self:start;font:700 8.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;padding:3px 6px;border-radius:5px;color:var(--dim);background:#18212B;white-space:nowrap}
.tag.now{color:#fff;background:var(--accent)}

/* ---------- diagram sheet ---------- */
.sheetwrap{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px #d9d4c7}
#dg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#dg.panning{cursor:grabbing}
#dg text{font-family:var(--f-label)}
.zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.zoom button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.92);border:1px solid #cfc9bb;color:#2b333d;font:600 16px/1 var(--f-label);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.zoom button:hover{border-color:#8f9aa6}
.zoom button:focus-visible{outline:2px solid var(--accent)}
.zoom button.fit{font-size:9.5px;letter-spacing:.08em}

/* sheet drawing classes (light paper) */
.s-ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.s-thin{fill:none;stroke:var(--ink-2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.s-int{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round;stroke-linejoin:round}
.s-box{fill:rgba(27,33,41,.025);stroke:#7C8691;stroke-width:1.3;stroke-dasharray:7 5}
.s-mod{fill:rgba(255,255,255,.55);stroke:var(--ink);stroke-width:1.7}
.s-body{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.s-fill{fill:var(--ink)}
.t-ref{font-weight:700;font-size:12px;letter-spacing:.05em;fill:var(--ink)}
.t-nm{font-weight:600;font-size:10.5px;letter-spacing:.08em;fill:var(--ink)}
.t-sub{font-weight:500;font-size:9.5px;letter-spacing:.04em;fill:var(--ink-3)}
.t-bus{font-weight:700;font-size:10.5px;letter-spacing:.14em;fill:var(--ink)}
.t-pin{font-weight:700;font-size:9.5px;fill:var(--ink-2)}
.t-wl{font-weight:600;font-size:10px;letter-spacing:.03em;fill:var(--ink-2)}
.t-wl tspan.ck{fill:var(--ink-3);font-weight:500}
.t-box{font-weight:700;font-size:10px;letter-spacing:.18em;fill:#6B7480}
.t-live{font-family:var(--f-mono)!important;font-weight:600;font-size:9.5px;fill:#0F5E9C}
.t-tb{font-weight:700;font-size:11px;letter-spacing:.12em;fill:var(--ink)}
.t-tbs{font-weight:500;font-size:9px;letter-spacing:.04em;fill:var(--ink-3)}
.wbase{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.wedge{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.wcol{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wstripe{fill:none;stroke-width:3;stroke-dasharray:5 6;stroke-linecap:butt;stroke-linejoin:round}
.wtrace{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wfloat{stroke-dasharray:5 5}
.flow{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1.5 11;pointer-events:none;animation:flow .9s linear infinite}
.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-12.5}}
.hit{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.hitbox{fill:transparent;stroke:none}
.it:hover>.hitbox{fill:rgba(47,155,224,.08)}
.it{cursor:pointer;outline:none}
.it:hover .hov{stroke:rgba(47,155,224,.28)}
.hov{fill:none;stroke:transparent;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.it:focus-visible .hov{stroke:rgba(47,155,224,.45)}
.halo-sel{fill:none;stroke:rgba(47,155,224,.42);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.halo-net{fill:none;stroke:rgba(47,155,224,.16);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.halo-box{fill:rgba(47,155,224,.12);stroke:rgba(47,155,224,.65);stroke-width:1.6;pointer-events:none}
.halo-spot{fill:none;stroke:#F5A500;stroke-width:3;stroke-dasharray:6 5;pointer-events:none;animation:spot 1.4s ease-in-out infinite}
.halo-spotw{fill:none;stroke:rgba(245,165,0,.45);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;animation:spotw 1.4s ease-in-out infinite}
@keyframes spot{50%{stroke-opacity:.35}}
@keyframes spotw{50%{stroke-opacity:.12}}
.halo-sus{fill:rgba(255,120,40,.13);stroke:#E8641B;stroke-width:2;pointer-events:none}
.halo-susw{fill:none;stroke:rgba(232,100,27,.45);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.halo-bad{fill:none;stroke:rgba(214,40,57,.6);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;animation:bad .7s ease-out forwards}
.halo-badb{fill:rgba(214,40,57,.12);stroke:#D62839;stroke-width:2;pointer-events:none;animation:bad .7s ease-out forwards}
@keyframes bad{to{opacity:0}}
.halo-good{fill:none;stroke:rgba(31,150,90,.5);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.halo-goodb{fill:rgba(31,150,90,.1);stroke:#1F965A;stroke-width:2;pointer-events:none}
.badge circle{fill:#1F965A;stroke:#fff;stroke-width:1.5}
.badge text{fill:#fff;font-weight:700;font-size:10px;text-anchor:middle;dominant-baseline:central}
.brk line{stroke:#D62839;stroke-width:2.6;stroke-linecap:round}
.brk circle{fill:#fff;stroke:#D62839;stroke-width:1.6}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{fill:none;stroke:#D62839;stroke-width:1.6;stroke-linecap:round;animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{opacity:.25}to{opacity:1}}

/* ---------- controls under the diagram ---------- */
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 14px 11px;min-height:50px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl>label,.ctl>span.l{font:600 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.ctl input[type=range]{width:150px;accent-color:var(--accent)}
.ctl output{font:600 13px/1 var(--f-mono);color:var(--soft);min-width:58px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--raise);font:600 11px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn{border-color:rgba(255,178,36,.5);color:#FFD58A}
.chip.warn i{background:var(--warn)}
.chip.bad{border-color:rgba(255,90,78,.5);color:#FFB3AC}
.chip.bad i{background:var(--fail)}

/* ---------- inspector ---------- */
.ibody{flex:1;min-height:0;overflow:auto;padding:2px 14px 14px;display:grid;gap:10px;align-content:start}
.ibody::-webkit-scrollbar,.nbody::-webkit-scrollbar{width:9px}
.ibody::-webkit-scrollbar-thumb,.nbody::-webkit-scrollbar-thumb{background:#1f2a35;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.ititle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ititle b{font:600 18px/1.15 var(--f-label);letter-spacing:.02em}
.ititle span{font:600 10.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.itext{margin:0;font-size:13.5px;color:var(--soft)}
.itext b{color:var(--fg)}
.dec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dec div{padding:8px 9px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;gap:4px;min-width:0}
.dec small{font:700 9px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dec b{font:600 15px/1.1 var(--f-label);display:flex;align-items:center;gap:6px;min-width:0}
.dec span{font-size:11.5px;color:var(--dim);line-height:1.3}
.sw{display:inline-block;width:22px;height:9px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
.rows{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 10px;font-size:12.5px;border-top:1px solid var(--line)}
.rows div:first-child{border-top:0}
.rows dt{font:600 10px/1.5 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0}
.rows dd{margin:0;color:var(--soft)}
.live{display:flex;flex-wrap:wrap;gap:6px}
.live span{font:600 12px/1 var(--f-mono);padding:6px 8px;border-radius:8px;background:#0b1a26;border:1px solid #17384f;color:#9CD3F5}
.live span.z{color:var(--dim);background:var(--raise);border-color:var(--line)}
.live span.f{color:#C7CED6;background:var(--raise);border-color:var(--line);font-family:var(--f-ui)}
.cview{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px;display:grid;gap:8px}
.cview .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cview .ch b{font:600 13px/1 var(--f-label);letter-spacing:.04em}
.cview .ch span{font-size:11.5px;color:var(--dim)}
.cview svg{width:100%;height:auto;display:block}
.cview .note{font-size:11.5px;color:var(--dim);margin:0}
.ptab{width:100%;border-collapse:collapse;font-size:12px}
.ptab th{font:700 9px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.ptab td{padding:6px;border-bottom:1px solid var(--line);color:var(--soft);vertical-align:top}
.ptab tr.cur td{background:rgba(47,155,224,.1);color:var(--fg)}
.ptab tr{cursor:pointer}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{display:grid;gap:10px;color:var(--dim);font-size:13px}
.anat{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.anat div{flex:1 1 90px;padding:9px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;gap:3px}
.anat b{font:600 17px/1 var(--f-mono);color:var(--fg)}
.anat small{font-size:11.5px;color:var(--dim);line-height:1.3}

/* ---------- notebook ---------- */
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 11px 9px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.nbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 14px;display:grid;gap:11px;align-content:start}
.nbody h3{margin:0;font:600 16px/1.2 var(--f-label);letter-spacing:.02em}
.nbody h4{margin:4px 0 0;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.nbody p{margin:0;font-size:13.5px;color:var(--soft)}
.nbody p b{color:var(--fg)}
.nbody ul{margin:0;padding-left:18px;font-size:13px;color:var(--soft);display:grid;gap:4px}
.les{display:grid;gap:6px}
.lcard{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--raise)}
.lcard:hover{border-color:#3a4a5c}
.lcard:focus-visible{outline:2px solid var(--accent)}
.lcard .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#18212B;font:700 12px/1 var(--f-label);color:var(--dim)}
.lcard.done .n{background:rgba(61,220,151,.15);color:var(--ok)}
.lcard b{font:600 14px/1.2 var(--f-label);display:block}
.lcard span{font-size:12px;color:var(--dim)}
.lcard .dg{font:700 8.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lhead .k{font:700 10px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:#1f2a35}
.dots i.on{background:var(--accent)}
.dots i.done{background:#2b6b54}
.goal{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:10px;border:1px dashed rgba(245,165,0,.55);background:rgba(245,165,0,.07);font-size:13px;color:#FFE0A3}
.goal.ok{border-style:solid;border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.08);color:#B8F5D9}
.goal svg{flex:none;margin-top:2px}
.mc{display:grid;gap:6px}
.mc button{all:unset;cursor:pointer;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);font-size:13.5px;color:var(--soft);line-height:1.35}
.mc button:hover{border-color:#3a4a5c;color:var(--fg)}
.mc button:focus-visible{outline:2px solid var(--accent)}
.mc button.right{border-color:rgba(61,220,151,.6);background:rgba(61,220,151,.1);color:#CFFBE7}
.mc button.wrong{border-color:rgba(255,90,78,.55);background:rgba(255,90,78,.08);color:#FFC9C3}
.mc button[disabled]{cursor:default}
.why{padding:10px 12px;border-radius:10px;background:#0f1b26;border:1px solid #1d3346;font-size:13px;color:var(--soft)}
.why b{color:var(--fg)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .sp{flex:1}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score div{flex:1 1 80px;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;gap:3px}
.score small{font:700 9px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.score b{font:600 18px/1 var(--f-label)}
.qk{font:700 9.5px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:#18212B;color:var(--dim);justify-self:start}
.qq{font:600 16px/1.3 var(--f-label);letter-spacing:.01em;color:var(--fg);margin:0}
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sym{all:unset;cursor:default;border:1px solid var(--line);border-radius:11px;background:var(--raise);overflow:hidden;display:grid}
.sym svg{display:block;width:100%;height:auto;background:var(--paper)}
.sym div{padding:8px 10px;display:grid;gap:3px}
.sym b{font:600 13.5px/1.15 var(--f-label)}
.sym span{font-size:11.5px;color:var(--dim);line-height:1.35}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab td{padding:5px 6px;border-bottom:1px solid var(--line);color:var(--soft)}
.ctab td:first-child{font:600 12px var(--f-mono);color:var(--fg);width:62px}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;z-index:40;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{padding:10px 14px;border-radius:11px;background:rgba(17,24,32,.97);border:1px solid var(--line-2);font-size:13px;color:var(--soft);box-shadow:0 18px 40px -16px rgba(0,0,0,.9);animation:tin .2s ease-out}
.toast.good{border-color:rgba(61,220,151,.5)}
.toast.bad{border-color:rgba(255,90,78,.5)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

@media (max-width:1100px){
  .bench{grid-template-columns:1fr;grid-template-rows:auto auto}
  .app{height:auto;min-height:100%}
  .sheetwrap{aspect-ratio:1000/680;height:auto;flex:none}
  .side{grid-template-rows:auto auto}
  .side .panel{max-height:none}
  .ibody,.nbody{overflow:visible}
}
@media (max-width:640px){
  .brand p{display:none}
  .dec{grid-template-columns:1fr}
  .seg button{padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){
  .flow,.spin,.wave,.halo-spot,.halo-spotw{animation:none}
}
/* back to the tools hub (site root) */
.hublink{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);color:var(--soft);font:600 12px/1 var(--f-label);letter-spacing:.05em;text-decoration:none;white-space:nowrap;pointer-events:auto}
.hublink:hover{color:var(--fg);border-color:#3a4a5c}
.hublink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hublink{padding:0 8px}.hublink span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

  relay: {n:'Relay', what:'A switch worked by an electromagnet. A small current through the <b>coil</b> (control side, pins 85/86) closes the <b>contacts</b> (load side, pins 30/87) that carry the big current.'},
  coil:  {n:'Relay coil', what:'The control side of a relay (pins 86 and 85). About 0.15 A through the coil makes a magnetic field that pulls the contacts closed. Drawn as a box with a diagonal line.'},
  contacts:{n:'Relay contacts', what:'The load side of a relay (pins 30 and 87). A switch drawn in its <b>resting</b> position: normally open (NO) contacts are drawn open.'},

  ground:{n:'Ground', what:'Where a circuit connects to the vehicle body or engine block, which is wired back to the battery negative. The G-number points to its location in the service info.'},

let RES = null;      // last simulation result
let BB = {};         // id → bbox after render
let VIEW = {x:0, y:0, w:1000, h:680};

/* ================= model ================= */
const ECT_RPU = 2490, ECT_R0 = 3520, ECT_T0 = 293.15, ECT_B = 3950;   // same thermistor as the DTC Visualizer
const fToK = f => (f - 32) * 5 / 9 + 273.15, kToF = k => (k - 273.15) * 9 / 5 + 32;
const ectR = f => ECT_R0 * Math.exp(ECT_B * (1 / fToK(f) - 1 / ECT_T0));
const ectF = v => { const r = ECT_RPU * v / (5 - v); return kToF(1 / (1 / ECT_T0 + Math.log(r / ECT_R0) / ECT_B)); };
const FAN_ON = 220, FAN_OFF = 212;
const BATT = 12.6;

const swOn = c => c.ctl === 'gear' ? S.gear === 'pn' : !!S.ctl[c.ctl];
const keyRun = () => S.key === 'run' || S.key === 'start';

function buildEls(D, st){
  const E = [], open = S.open;
  const R = (id, a, b, r, kind) => { if (!open.has(id)) E.push({id, a, b, R:r, kind}); };
  const V = (id, a, b, v) => E.push({id, a, b, V:v});
  D.buses.forEach(b => { if (b.src === 'batt' || (b.src === 'run' && keyRun())) V(b.id, b.node, '0', BATT); });
  D.comps.forEach(c => {
    switch (c.type){
      case 'fuse': R(c.id, c.a, c.b, 0.005, 'fuse'); break;
      case 'relay':
        R(c.id + '.coil', c.n86, c.n85, c.coilR, 'coil');
        if (st.closed[c.id]) R(c.id + '.sw', c.n30, c.n87, 0.01, 'contacts');
        break;
      case 'clockspring': R(c.id, c.a, c.b, 0.1, 'cs'); break;
      case 'switch': if (swOn(c)) R(c.id, c.a, c.b, 0.02, 'switch'); break;
      case 'horn': case 'motor': case 'lamp': R(c.id, c.a, c.b, c.R, 'load'); break;
      case 'sensor': R(c.id, c.a, c.b, ectR(S.temp), 'sensor'); break;
      case 'ground': R(c.id, c.node, '0', 0.002, 'ground'); break;
      case 'battery':
        /* EMF behind a small internal resistance; a charging battery accepts current less readily */
        if (!open.has(c.id)) { V(c.id + '.emf', 'BATi', c.neg, BATT); R(c.id, 'BATi', c.pos, st.chg ? 0.06 : 0.012, 'battery'); }
        break;
      case 'starter':
        R(c.id + '.sol', c.nS, c.nG, 0.9, 'sol');
        if (st.closed[c.id]) R(c.id + '.sw', c.nB, c.nM, 0.0008, 'contacts');
        R(c.id + '.mot', c.nM, c.nG, 0.07, 'load');
        break;
      case 'alternator':
        R(c.id + '.fld', c.nI, c.nG, 40, 'alt');
        if (S.running && st.alt && !open.has(c.id)) { V(c.id + '.emf', 'ALTi', c.nG, 14.6); E.push({id:c.id + '.out', a:'ALTi', b:c.nB, R:0.015, kind:'alt'}); }
        break;
      case 'ignsw':
        if (keyRun()) R(c.id + '.run', c.nB, c.nR, 0.01, 'switch');
        if (S.key === 'start') R(c.id + '.st', c.nB, c.nS, 0.01, 'switch');
        break;
      case 'hsw':
        if (S.lsw !== 'off') R(c.id + '.park', c.n1, c.n3, 0.02, 'switch');
        if (S.lsw === 'head') R(c.id + '.head', c.n2, c.n3, 0.02, 'switch');
        break;
      case 'module': (c.kind === 'bcm' ? bcmEls : pcmEls)(R, V, st); break;
    }
  });
  D.wires.forEach(w => R(w.id, w.a, w.b, w.R || 0.004, w.kind || 'wire'));
  D.conns.forEach(c => { if (S.unplug.has(c.id)) return; c.pins.forEach(p => R(c.id + '.' + p.p, c.id + '.' + p.p + 'a', c.id + '.' + p.p + 'b', 0.002, 'pin')); });
  return E;
}
function pcmEls(R, V, st){
  const pcm = st.pcm;
  R('PCM.psu', 'C160.20b', 'PG', 30, 'mod');
  R('PCM.g1', 'PG', 'C160.1b', 0.001, 'mod'); R('PCM.g2', 'PG', 'C160.2b', 0.001, 'mod');
  R('PCM.pu', 'VREF', 'C160.47b', ECT_RPU, 'mod');
  R('PCM.lr', 'C160.48b', 'PG', 5, 'mod');
  if (pcm.drv) R('PCM.drv', 'C160.52b', 'PG', 0.15, 'mod');
  if (pcm.powered) V('PCM.vref', 'VREF', 'PG', 5);
}
function bcmEls(R, V, st){
  const b = st.bcm;
  R('BCM.psu', 'C140.1b', 'BG', 40, 'mod'); R('BCM.g', 'BG', 'C140.2b', 0.001, 'mod');
  R('BCM.pu20', 'BV5', 'C140.20b', 10000, 'mod'); R('BCM.pu21', 'BV5', 'C140.21b', 10000, 'mod');
  if (b.powered) V('BCM.vref', 'BV5', 'BG', 5);
  if (b.park) R('BCM.d12', 'C140.1b', 'C140.12b', 0.05, 'mod');
  if (b.head) { R('BCM.d10', 'C140.1b', 'C140.10b', 0.05, 'mod'); R('BCM.d11', 'C140.1b', 'C140.11b', 0.05, 'mod'); }
}

/* Modified nodal analysis: node voltages + voltage-source currents, Gaussian elimination. */
function solveNet(els){
  const idx = new Map(), names = [];
  const add = n => { if (n !== '0' && !idx.has(n)) { idx.set(n, names.length); names.push(n); } };
  els.forEach(e => { add(e.a); add(e.b); });
  const n = names.length, vs = els.filter(e => e.V != null), N = n + vs.length;
  const A = Array.from({length:N}, () => new Float64Array(N)), z = new Float64Array(N);
  const ix = nm => nm === '0' ? -1 : idx.get(nm);
  for (let i = 0; i < n; i++) A[i][i] += 1e-9;              // tiny leak so floating islands stay solvable
  els.forEach(e => {
    if (e.V != null) return;
    const g = 1 / e.R, a = ix(e.a), b = ix(e.b);
    if (a >= 0) A[a][a] += g; if (b >= 0) A[b][b] += g;
    if (a >= 0 && b >= 0) { A[a][b] -= g; A[b][a] -= g; }
  });
  vs.forEach((e, k) => {
    const r = n + k, a = ix(e.a), b = ix(e.b);
    if (a >= 0) { A[r][a] += 1; A[a][r] += 1; }
    if (b >= 0) { A[r][b] -= 1; A[b][r] -= 1; }
    z[r] = e.V;
  });
  for (let c = 0; c < N; c++){
    let p = c, mx = Math.abs(A[c][c]);
    for (let r = c + 1; r < N; r++) { const v = Math.abs(A[r][c]); if (v > mx) { mx = v; p = r; } }
    if (mx < 1e-18) continue;
    if (p !== c) { const t = A[p]; A[p] = A[c]; A[c] = t; const tz = z[p]; z[p] = z[c]; z[c] = tz; }
    for (let r = c + 1; r < N; r++){
      const f = A[r][c] / A[c][c]; if (!f) continue;
      for (let k = c; k < N; k++) A[r][k] -= f * A[c][k];
      z[r] -= f * z[c];
    }
  }
  const x = new Float64Array(N);
  for (let r = N - 1; r >= 0; r--){
    let s = z[r]; for (let k = r + 1; k < N; k++) s -= A[r][k] * x[k];
    x[r] = Math.abs(A[r][r]) < 1e-18 ? 0 : s / A[r][r];
  }
  const v = {'0':0}; names.forEach((nm, i) => v[nm] = x[i]);
  const I = {}; els.forEach(e => { if (e.V == null) I[e.id] = (v[e.a] - v[e.b]) / e.R; });
  /* nodes with no conductive path to chassis ground have no voltage reference ("floating") */
  const par = {}; const f = a => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
  ['0', ...names].forEach(nm => par[nm] = nm);
  els.forEach(e => { par[f(e.a)] = f(e.b); });
  const root = f('0'), fl = new Set(names.filter(nm => f(nm) !== root));
  return {v, I, fl};
}

function pcmLogic(res, prev){
  const pgRef = !res.fl.has('PG');
  const vIgn = (res.v['C160.20b'] ?? 0) - (res.v.PG ?? 0);
  const powered = pgRef && !res.fl.has('C160.20b') && vIgn > 9;
  if (!powered) return {powered:false, drv:false, ectV:null, ectF:null, fault:null};
  if (!prev.powered) return {powered:true, drv:false, ectV:null, ectF:null, fault:null};
  const ectV = (res.v['C160.47b'] ?? 0) - res.v.PG;
  let fault = null, tf = null;
  if (ectV > 4.85) fault = 'high'; else if (ectV < 0.15) fault = 'low'; else tf = ectF(ectV);
  const drv = fault ? true : (prev.drv ? tf > FAN_OFF : tf >= FAN_ON);
  return {powered:true, drv, ectV, ectF:tf, fault};
}

function bcmLogic(res, prev){
  const ref = !res.fl.has('BG'), vb = (res.v['C140.1b'] ?? 0) - (res.v.BG ?? 0);
  const powered = ref && !res.fl.has('C140.1b') && vb > 9;
  if (!powered) return {powered:false, park:false, head:false, inP:null, inH:null};
  if (!prev.powered) return {powered:true, park:false, head:false, inP:null, inH:null};
  const vin = n => res.fl.has(n) ? 5 : (res.v[n] ?? 5) - res.v.BG;
  const inP = vin('C140.20b'), inH = vin('C140.21b'), pReq = inP < 1.5, hReq = inH < 1.5;
  return {powered:true, park:pReq || hReq, head:hReq, inP, inH};
}

function simulate(){
  const D = DG;
  if (S.key === 'off') { S.running = false; S.cranked = false; }
  const st = {closed:{...S.relay}, pcm:{...S.pcm}, bcm:{...S.bcm}, alt:S.alt, chg:S.chg};
  let res = null;
  for (let it = 0; it < 16; it++){
    res = solveNet(buildEls(D, st));
    let changed = false;
    const flip = (obj, key, on) => { if (on !== !!obj[key]) { obj[key] = on; changed = true; } };
    D.comps.forEach(c => {
      if (c.type === 'relay'){ const i = Math.abs(res.I[c.id + '.coil'] || 0); flip(st.closed, c.id, st.closed[c.id] ? i > 0.03 : i > 0.07); }
      if (c.type === 'starter'){ const i = Math.abs(res.I[c.id + '.sol'] || 0); flip(st.closed, c.id, st.closed[c.id] ? i > 3 : i > 6); }
      if (c.type === 'alternator') flip(st, 'alt', !res.fl.has(c.nI) && (res.v[c.nI] - (res.v[c.nG] ?? 0)) > 8);
      if (c.type === 'battery') flip(st, 'chg', (res.I[c.id] || 0) < -0.5);
      if (c.type === 'module'){
        if (c.kind === 'bcm'){
          const nb = bcmLogic(res, st.bcm);
          if (nb.powered !== st.bcm.powered || nb.park !== st.bcm.park || nb.head !== st.bcm.head) changed = true;
          st.bcm = nb;
        } else {
          const np = pcmLogic(res, st.pcm);
          if (np.powered !== st.pcm.powered || np.drv !== st.pcm.drv) changed = true;
          st.pcm = np;
        }
      }
    });
    /* the engine starts once it has cranked and the key comes back to RUN */
    if (D.id === 'start'){
      if (S.key === 'start' && Math.abs(res.I['ST.mot'] || 0) > 50) S.cranked = true;
      if (S.key === 'run' && S.cranked && !S.running) { S.running = true; changed = true; }
    }
    if (!changed) break;
  }
  S.relay = st.closed; S.pcm = st.pcm; S.bcm = st.bcm; S.alt = st.alt; S.chg = st.chg;
  RES = {...res, pcm:st.pcm, bcm:st.bcm};
}
const battV = () => { const a = nodeV('BAT+'), b = nodeV('BAT-'); return a == null || b == null ? null : a - b; };

/* per-item live values */
const nodeV = n => RES.fl.has(n) ? null : RES.v[n] ?? null;
function wireLive(w){
  const va = nodeV(w.a), vb = nodeV(w.b);
  const cut = S.open.has(w.id);
  return {va, vb, cut, i: cut ? 0 : (RES.I[w.id] || 0)};
}

/* ================= registry ================= */
function loadDiagram(id){
  DG = DIAGRAMS[id]; S.dg = id;
  ITEMS = {}; NODE_DESC = {};
  const reg = (id, kind, d, parent) => ITEMS[id] = {id, kind, d, parent};
  DG.buses.forEach(b => { reg(b.id, 'bus', b); NODE_DESC[b.node] = b.label.toLowerCase().replace(/^./, c => c.toUpperCase()) + ' bus'; });
  DG.comps.forEach(c => {
    reg(c.id, 'comp', c);
    if (c.type === 'relay'){
      reg(c.id + '.coil', 'sub', {type:'coil', name:c.ref + ' coil', parent:c}, c.id);
      reg(c.id + '.sw', 'sub', {type:'contacts', name:c.ref + ' contacts', parent:c}, c.id);
      NODE_DESC[c.n86] = c.ref + ' pin 86 (coil feed)'; NODE_DESC[c.n85] = c.ref + ' pin 85 (coil ground side)';
      NODE_DESC[c.n30] = c.ref + ' pin 30 (contact feed)'; NODE_DESC[c.n87] = c.ref + ' pin 87 (switched output)';
    }
    if (c.type === 'starter'){
      reg('ST.sol', 'sub', {type:'solenoid', name:'Starter solenoid', parent:c}, c.id);
      reg('ST.sw', 'sub', {type:'stcontacts', name:'Solenoid main contacts', parent:c}, c.id);
      reg('ST.mot', 'sub', {type:'startmotor', name:'Starter motor', parent:c}, c.id);
      NODE_DESC[c.nB] = 'Starter B terminal'; NODE_DESC[c.nS] = 'Starter S terminal (solenoid)';
    }
    if (c.type === 'battery'){ NODE_DESC[c.pos] = 'Battery positive post'; NODE_DESC[c.neg] = 'Battery negative post'; }
    if (c.type === 'alternator') NODE_DESC[c.nB] = 'Generator B+ output stud';
    if (c.type === 'ignsw'){ NODE_DESC[c.nB] = 'Ignition switch BATT terminal'; NODE_DESC[c.nS] = 'Ignition switch START output'; NODE_DESC[c.nR] = 'Ignition switch RUN output'; }
    if (c.type === 'module' && c.kind === 'bcm'){
      reg('BCM.psu', 'sub', {type:'psu', txt:'bpsu', name:'BCM power supply', parent:c}, c.id);
      reg('BCM.in', 'sub', {type:'bcmin', name:'Switch inputs', parent:c}, c.id);
      reg('BCM.d10', 'sub', {type:'hdriver', name:'LH low beam driver (pin 10)', pin:'10', parent:c}, c.id);
      reg('BCM.d12', 'sub', {type:'hdriver', name:'Park lamp driver (pin 12)', pin:'12', parent:c}, c.id);
      reg('BCM.d11', 'sub', {type:'hdriver', name:'RH low beam driver (pin 11)', pin:'11', parent:c}, c.id);
    }
    if (c.type === 'module' && c.kind !== 'bcm'){
      reg('PCM.psu', 'sub', {type:'psu', name:'PCM power supply', parent:c}, c.id);
      reg('PCM.pu', 'sub', {type:'pullup', name:'5 V reference and pull-up', parent:c}, c.id);
      reg('PCM.drv', 'sub', {type:'driver', name:'Fan relay driver', parent:c}, c.id);
      reg('PCM.lr', 'sub', {type:'lowref', name:'Low reference', parent:c}, c.id);
    }
    if (c.type === 'splice') NODE_DESC[c.node] = 'Splice ' + c.id;
    if (c.type === 'ground') NODE_DESC[c.node] = 'Ground ' + c.id;
    if (c.type === 'fuse') NODE_DESC[c.b] = NODE_DESC[c.b] || c.ref + ' output';
    if (c.type === 'switch') { NODE_DESC[c.a] = c.name.toLowerCase().replace(/^./, x => x.toUpperCase()); NODE_DESC[c.b] = NODE_DESC[c.a]; }
  });
  DG.wires.forEach(w => reg(w.id, w.kind === 'trace' ? 'trace' : 'wire', w));
  DG.conns.forEach(c => {
    reg(c.id, 'conn', c);
    c.pins.forEach(p => { reg(c.id + '.' + p.p, 'pin', {conn:c, pin:p}, c.id); NODE_DESC[c.id + '.' + p.p + 'a'] = NODE_DESC[c.id + '.' + p.p + 'b'] = c.id + ' pin ' + p.p; });
  });
  NODE_DESC.F20o = NODE_DESC.F20o || 'F20 output'; NODE_DESC.F15o = NODE_DESC.F15o || 'F15 output'; NODE_DESC.J1 = 'F20 output';
  /* nets: wires and traces joined through connector cavities and splices */
  const par = {}; const f = a => { par[a] ??= a; while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
  const join = (a, b) => { par[f(a)] = f(b); };
  DG.wires.forEach(w => join(w.a, w.b));
  DG.conns.forEach(c => c.pins.forEach(p => join(c.id + '.' + p.p + 'a', c.id + '.' + p.p + 'b')));
  NET = {}; DG.wires.forEach(w => NET[w.id] = f(w.a));
  VIEW = {x:0, y:0, w:1000, h:680};
}
const wiresAt = node => DG.wires.filter(w => w.a === node || w.b === node);
function pinWires(c, p){
  const a = wiresAt(c.id + '.' + p + 'a'), b = wiresAt(c.id + '.' + p + 'b');
  return {a: a[0] || null, b: b[0] || null};
}
const isTop = id => !!ITEMS[id];
const topOf = id => ITEMS[id]?.parent || id;
/* tapped id satisfies goal id if it is that item or one of its parts */
const matches = (goal, tapped) => tapped === goal || tapped.startsWith(goal + '.');

/* ================= drawing ================= */
const P = pts => 'M' + pts.map(p => p[0] + ',' + p[1]).join('L');
function polyLen(pts){ let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
function polySplit(pts){
  const half = polyLen(pts) / 2; let acc = 0;
  for (let i = 1; i < pts.length; i++){
    const [x0, y0] = pts[i-1], [x1, y1] = pts[i], seg = Math.hypot(x1 - x0, y1 - y0);
    if (acc + seg >= half){
      const t = (half - acc) / seg, m = [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t];
      return [pts.slice(0, i).concat([m]), [m].concat(pts.slice(i)), m];
    }
    acc += seg;
  }
  return [pts, pts, pts[0]];
}
function vcol(v){
  if (v == null) return '#A0A7AF';
  const stops = [[0, [36,87,184]], [0.17, [20,150,159]], [0.4, [217,160,0]], [1, [214,40,57]]];
  const t = Math.max(0, Math.min(1, v / BATT));
  for (let i = 1; i < stops.length; i++){
    if (t <= stops[i][0]){
      const [t0, c0] = stops[i-1], [t1, c1] = stops[i], k = (t - t0) / (t1 - t0);
      return 'rgb(' + c0.map((c, j) => Math.round(c + (c1[j] - c) * k)).join(',') + ')';
    }
  }
  return 'rgb(214,40,57)';
}
const fmtV = v => v == null ? 'no reference' : (Math.abs(v) < 1 ? v.toFixed(2) : v.toFixed(1)) + ' V';
const fmtA = i => { const a = Math.abs(i); return a < 0.00005 ? '0 A' : a < 0.01 ? (a * 1000).toFixed(1) + ' mA' : a < 1 ? (a * 1000).toFixed(0) + ' mA' : a.toFixed(1) + ' A'; };
const T = (x, y, cls, s, anchor) => `<text class="${cls}" x="${x}" y="${y}"${anchor && anchor !== 'start' ? ` text-anchor="${anchor}"` : ''}>${s}</text>`;
const itOpen = (id, label) => `<g class="it" data-id="${id}" tabindex="0" role="button" aria-label="${esc(label)}">`;

function drawWire(w){
  const L = wireLive(w), mode = S.color, trace = w.kind === 'trace';
  let s = itOpen(w.id, trace ? 'Internal circuit' : `Wire ${w.size} ${w.color}, circuit ${w.ckt}`);
  s += `<path class="hov" d="${P(w.pts)}"/>`;
  const segs = L.cut ? polySplit(w.pts).slice(0, 2) : [w.pts];
  const vs = L.cut ? [L.va, L.vb] : [L.va != null && L.vb != null ? (L.va + L.vb) / 2 : (L.va ?? L.vb)];
  segs.forEach((pts, k) => {
    const d = P(pts);
    if (mode === 'volt'){
      const v = L.cut ? vs[k] : (L.va == null || L.vb == null ? null : vs[0]);
      if (v == null) s += `<path class="wcol wfloat" d="${d}" stroke="#A0A7AF" stroke-width="${trace ? 2 : 2.6}"/>`;
      else { if (!trace) s += `<path class="wedge" d="${d}" stroke-width="4.6"/>`; s += `<path class="wcol" d="${d}" stroke="${vcol(v)}" stroke-width="${trace ? 2.4 : 3}"/>`; }
    } else if (trace) s += `<path class="wtrace" d="${d}"/>`;
    else if (mode === 'plain') s += `<path class="wbase" d="${d}"/>`;
    else {
      const c = parseColor(w.color);
      s += `<path class="wedge" d="${d}"/><path class="wcol" d="${d}" stroke="${COLORS[c.main].hex}"/>`;
      if (c.stripe) s += `<path class="wstripe" d="${d}" stroke="${COLORS[c.stripe].hex}"/>`;
    }
  });
  if (mode === 'volt' && !L.cut && Math.abs(L.i) > 0.02 && !reduceMotion)
    s += `<path class="flow${L.i < 0 ? ' rev' : ''}" d="${P(w.pts)}"/>`;
  s += `<path class="hit" d="${P(w.pts)}"/>`;
  if (!trace && w.lab){
    const [x, y, an] = w.lab;
    s += `<text class="t-wl" x="${x}" y="${y}"${an ? ` text-anchor="${an}"` : ''}>${w.size} ${w.color} <tspan class="ck">${w.ckt}</tspan></text>`;
  }
  return s + '</g>';
}

function drawFuse(c){
  const {x, y1, y2} = c, t = y1 + 18, b = y1 + 54, blown = S.open.has(c.id);
  let s = itOpen(c.id, `Fuse ${c.ref} ${c.amps} amp`);
  s += `<rect class="hitbox" x="${x - 12}" y="${y1 + 4}" width="64" height="${b - y1 + 6}"/>`;
  s += `<path class="s-ln" d="M${x},${y1}V${t}M${x},${b}V${y2}"/><rect class="s-body" x="${x - 6}" y="${t}" width="12" height="36" rx="2"/>`;
  s += blown ? `<path class="s-ln" stroke="#D62839" d="M${x},${t}C${x + 6},${t + 6} ${x + 4},${t + 12} ${x + 2},${t + 15}M${x - 2},${b - 15}C${x - 4},${b - 12} ${x - 6},${b - 6} ${x},${b}"/>`
             : `<path class="s-ln" d="M${x},${t}C${x + 8},${t + 10} ${x - 8},${b - 10} ${x},${b}"/>`;
  s += T(x + 12, t + 12, 't-ref', c.ref) + T(x + 12, t + 25, 't-nm', c.amps + 'A') + T(x + 12, t + 37, 't-sub', c.name);
  return s + '</g>';
}

function drawRelay(c){
  const {x, y, w, h, cx, sx} = c, yb = y + h, ym = y + h / 2, closed = !!S.relay[c.id];
  const ci = Math.abs(RES.I[c.id + '.coil'] || 0), hot = ci > 0.03;
  let s = itOpen(c.id, `Relay ${c.ref} ${c.name}`);
  s += `<rect class="s-box" style="stroke-dasharray:4 3" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>`;
  s += T(x + w + 10, ym - 3, 't-ref', c.ref) + T(x + w + 10, ym + 11, 't-nm', c.name);
  /* coil */
  s += itOpen(c.id + '.coil', `${c.ref} coil, control side`);
  s += `<rect class="hitbox" x="${cx - 24}" y="${y + 2}" width="44" height="${h - 4}"/>`;
  s += `<path class="s-ln" d="M${cx},${y}V${y + 18}M${cx},${yb - 18}V${yb}"/>`;
  s += `<rect class="s-body" x="${cx - 10}" y="${y + 18}" width="20" height="${h - 36}" ${hot ? 'style="fill:#FFE39A"' : ''}/>`;
  s += `<path class="s-ln" d="M${cx - 10},${yb - 18}L${cx + 10},${y + 18}"/>`;
  s += T(cx - 14, y + 14, 't-pin', '86', 'end') + T(cx - 14, yb - 6, 't-pin', '85', 'end');
  s += '</g>';
  /* contacts */
  const px = sx, py = yb - 20, ex = closed ? sx : sx - 16, ey = closed ? y + 22 : y + 26;
  const k = (py - ym) / (py - ey), bx = px + (ex - px) * k;
  s += `<path class="s-thin" stroke-dasharray="3 3" d="M${cx + 10},${ym}H${bx - 2}"/>`;
  s += itOpen(c.id + '.sw', `${c.ref} contacts, load side`);
  s += `<rect class="hitbox" x="${sx - 26}" y="${y + 2}" width="46" height="${h - 4}"/>`;
  s += `<path class="s-ln" d="M${sx},${y}V${y + 20}M${sx},${yb}V${py}M${px},${py}L${ex},${ey}"/>`;
  s += `<circle class="s-fill" cx="${sx}" cy="${y + 20}" r="2.4"/><circle class="s-fill" cx="${px}" cy="${py}" r="2.4"/>`;
  s += T(sx + 8, y + 14, 't-pin', '30') + T(sx + 8, yb - 6, 't-pin', '87');
  s += '</g>';
  return s + '</g>';
}

function drawSwitch(c){
  const {x, y1, y2} = c, ym = (y1 + y2) / 2, ct = ym - 12, cb = ym + 12, on = swOn(c), bx = on ? x : x + 10;

  s += `<path class="s-ln" d="M${x},${y1}V${ct}M${x},${y2}V${cb}"/>`;
  s += `<circle class="s-body" cx="${x}" cy="${ct}" r="2.6"/><circle class="s-body" cx="${x}" cy="${cb}" r="2.6"/>`;
  s += `<path class="s-ln" d="M${bx},${ct - 4}V${cb + 4}M${bx},${ym}H${x + 26}M${x + 26},${ym - 6}V${ym + 6}"/>`;

function drawHorn(c){

  s += `<path class="s-int" d="M380,400V446M380,480V530"/>`;
  s += `<path class="s-ln" d="M366,450V476M352,463H366M366,456L380,446M366,470L380,480" ${p.drv ? 'stroke="#1F965A"' : ''}/>`;
  s += `<path class="s-fill" d="M380,480l-7,-1.5l3.5,-4.5z"/>`;
  s += T(388, 468, 't-sub', 'DRIVER') + T(388, 479, 't-sub', p.drv ? 'ON' : 'OFF');
  s += '</g>';
  /* pull-up */
  s += itOpen('PCM.pu', '5 volt reference and pull-up resistor');
  s += `<rect class="hitbox" x="416" y="420" width="106" height="42"/>`;
  s += `<circle class="s-body" cx="428" cy="440" r="3"/>` + T(428, 430, 't-sub', '5 V REF', 'middle');
  s += `<path class="s-ln" d="M431,440H438l4,-6l8,12l8,-12l8,12l8,-12l8,12l4,-6H520"/>` + T(462, 459, 't-sub', '2.49 kΩ', 'middle');
  s += '</g>';

  s += `<path class="s-int" d="M520,500H450V530"/>` + T(486, 494, 't-sub', 'LOW REF', 'middle');
  s += '</g>';
  return s + '</g>';
}

function drawConn(c){
  let s = '';
  const unp = S.unplug.has(c.id);
  c.pins.forEach(p => {
    const id = c.id + '.' + p.p, [dx, dy, an] = p.t || [7, 14, 'start'];
    s += itOpen(id, `${c.id} pin ${p.p}`);
    s += `<circle class="hitbox" cx="${p.x}" cy="${p.y}" r="9"/>`;
    if (c.kind === 'inline') s += `<path class="s-ln" d="M${p.x - 6},${p.y - 7}L${p.x},${p.y - 1}L${p.x + 6},${p.y - 7}M${p.x - 6},${p.y + 1}L${p.x},${p.y + 7}L${p.x + 6},${p.y + 1}"/>`;
    else s += `<circle class="s-body" cx="${p.x}" cy="${p.y}" r="3.6"/>`;
    s += T(p.x + dx, p.y + dy, 't-pin', p.p, an);
    if (unp) s += `<circle cx="${p.x}" cy="${p.y}" r="9" fill="none" stroke="#D62839" stroke-width="1.6" stroke-dasharray="3 3"/>`;
    s += '</g>';
  });
  const [lx, ly, an] = c.lab;
  s += itOpen(c.id, `Connector ${c.id}`) + T(lx, ly, 't-ref', c.id + (unp ? ' ✕' : ''), an) + '</g>';
  return s;
}

function drawIgnsw(c){
  const {x, y, w, h} = c, bx = x + 60, py = y + 26, cy = y + 54, sx = x + 20, rx = x + 100;

  s += `<rect class="s-mod" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>`;
  s += `<circle class="s-body" cx="${bx}" cy="${y}" r="4"/><path class="s-ln" d="M${bx},${y + 4}V${py}"/><circle class="s-fill" cx="${bx}" cy="${py}" r="2.6"/>`;

  [sx, bx, rx].forEach(cx => s += `<circle class="s-body" cx="${cx}" cy="${cy}" r="2.6"/>`);

  s += `<path class="s-ln" d="M${bx},${py}L${tx + (tx < bx ? 3 : tx > bx ? -3 : 0)},${cy - 3}" stroke-width="2.2"/>`;
  if (S.key === 'start') s += `<path class="s-thin" stroke-dasharray="3 3" d="M${sx},${cy}H${rx}"/>`;
  s += T(sx + 6, y + h - 9, 't-sub', 'ST') + T(bx, y + h - 9, 't-sub', 'OFF', 'middle') + T(rx - 6, y + h - 9, 't-sub', 'RUN', 'end');

  return s + '</g>';
}

function drawLamp(c){
  const {x, y1, y2} = c, ym = (y1 + y2) / 2, nom = BATT / c.R, lit = Math.abs(RES.I[c.id] || 0) > nom * 0.3;
  let s = itOpen(c.id, c.name);

function breakMarks(){
  let s = '';
  const mark = (x, y) => `<g class="brk"><circle cx="${x}" cy="${y}" r="7"/><line x1="${x - 3.5}" y1="${y - 3.5}" x2="${x + 3.5}" y2="${y + 3.5}"/><line x1="${x + 3.5}" y1="${y - 3.5}" x2="${x - 3.5}" y2="${y + 3.5}"/></g>`;
  S.open.forEach(id => {
    const it = ITEMS[id]; if (!it) return;
    if (it.kind === 'wire' || it.kind === 'trace') { const m = polySplit(it.d.pts)[2]; s += mark(m[0], m[1]); }
    else if (it.kind === 'comp' && it.d.type === 'ground') s += mark(it.d.x + 18, it.d.y - 8);
    else if (it.kind === 'pin') s += mark(it.d.pin.x - 13, it.d.pin.y);
    else if (it.kind === 'comp' && ['horn','motor','sensor','lamp'].includes(it.d.type)) s += mark(it.d.x - 20, (it.d.y1 + it.d.y2) / 2 - 22);
    else if (it.kind === 'sub' && it.d.type === 'coil') { const c = it.d.parent; s += mark(c.cx + 18, c.y + c.h / 2); }
  });
  return s;
}

function itemShape(id, cls, clsW, pad = 5){
  const it = ITEMS[id]; if (!it) return '';
  if (it.kind === 'wire' || it.kind === 'trace') return `<path class="${clsW}" d="${P(it.d.pts)}"/>`;
  if (it.kind === 'pin') return `<circle class="${cls}" cx="${it.d.pin.x}" cy="${it.d.pin.y}" r="11"/>`;
  const b = BB[id]; if (!b || !b.w) return '';
  return `<rect class="${cls}" x="${b.x - pad}" y="${b.y - pad}" width="${b.w + pad * 2}" height="${b.h + pad * 2}" rx="7"/>`;
}
function itemCenter(id){
  const it = ITEMS[id]; if (!it) return [0, 0];
  if (it.kind === 'wire' || it.kind === 'trace') return polySplit(it.d.pts)[2];
  if (it.kind === 'pin') return [it.d.pin.x, it.d.pin.y];
  const b = BB[id]; return b ? [b.x + b.w / 2, b.y + b.h / 2] : [0, 0];
}
function renderHalos(){
  const ly = $('#lyHalo'), lb = $('#lyBadge'); if (!ly) return;
  let s = '', bd = '';
  if (S.sel && ITEMS[S.sel]){
    const it = ITEMS[S.sel];
    if (it.kind === 'wire' || it.kind === 'trace'){
      const net = NET[S.sel];
      DG.wires.forEach(w => { if (w.id !== S.sel && NET[w.id] === net) s += `<path class="halo-net" d="${P(w.pts)}"/>`; });
    }
    s += itemShape(S.sel, 'halo-box', 'halo-sel');
  }
  S.sus.forEach(id => s += itemShape(id, 'halo-sus', 'halo-susw'));
  S.picks.forEach((id, k) => {
    s += itemShape(id, 'halo-goodb', 'halo-good');

    bd += `<g class="badge"><circle cx="${x + 12}" cy="${y - 12}" r="9"/><text x="${x + 12}" y="${y - 12}">${k + 1}</text></g>`;
  });
  S.spot.forEach(id => s += itemShape(id, 'halo-spot', 'halo-spotw', 7));
  ly.innerHTML = s; lb.innerHTML = bd;
}
function flash(id, good){

/* ================= zoom & pan ================= */
function applyView(){ $('#dg').setAttribute('viewBox', `${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`); }
function zoomAt(f, cx, cy){
  const nw = Math.max(250, Math.min(1000, VIEW.w / f)), k = nw / VIEW.w;
  if (cx == null) { cx = VIEW.x + VIEW.w / 2; cy = VIEW.y + VIEW.h / 2; }
  VIEW = {x: cx - (cx - VIEW.x) * k, y: cy - (cy - VIEW.y) * k, w: nw, h: nw * 0.68};
  clampView(); applyView();
}
function clampView(){
  if (VIEW.w >= 1000) { VIEW = {x:0, y:0, w:1000, h:680}; return; }
  VIEW.x = Math.max(-40, Math.min(1040 - VIEW.w, VIEW.x));
  VIEW.y = Math.max(-40, Math.min(720 - VIEW.h, VIEW.y));
}
function svgPt(e){
  const svg = $('#dg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

const Icur = id => RES.I[id] || 0;
const liveOn = () => S.color === 'volt';
const liveHint = () => `<div class="live"><span class="f">Switch Color to <b>Voltage</b> to see live readings here</span></div>`;
const span = (s, z) => `<span${z ? ' class="z"' : ''}>${s}</span>`;
const vSpan = (lbl, v) => span(lbl + ' ' + fmtV(v), v == null || Math.abs(v) < 0.05);
const rowsHtml = rows => '<dl class="rows">' + rows.filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('') + '</dl>';
const selLink = (id, label) => `<button type="button" class="btn small" data-sel="${id}">${label}</button>`;
const swatch = color => { const c = parseColor(color); return `<i class="sw" style="background:${c.stripe ? `linear-gradient(90deg,${COLORS[c.main].hex} 0 55%,${COLORS[c.stripe].hex} 55% 100%)` : COLORS[c.main].hex}"></i>`; };
function actBtn(act, on, offLabel, onLabel){
  if (S.mode !== 'explore' && !(S.mode === 'guided' && curStep()?.goal?.allowBreak)) return '';
  return `<button type="button" class="btn small danger${on ? ' lit' : ''}" data-act="${act}">${on ? onLabel : offLabel}</button>`;
}
const connOfNode = n => { const m = /^(C\d+)\.([0-9A-Z]+)([ab])$/.exec(n); return m ? {c:m[1], p:m[2], side:m[3]} : null; };

function inspectWire(w){
  const trace = w.kind === 'trace', L = wireLive(w);
  let h = `<div class="ititle"><b>${trace ? 'Internal circuit' : w.size + ' ' + w.color}</b><span>${trace ? 'Inside the fuse block' : 'Wire · circuit ' + w.ckt}</span></div>`;
  if (trace) h += `<p class="itext">${SYM.trace.what} ${w.desc}</p>`;
  else {
    const c = parseColor(w.color);
    h += `<div class="dec">
      <div><small>Size</small><b>${w.size} mm²</b><span>≈ ${AWG[w.size]} AWG</span></div>
      <div><small>Color</small><b>${swatch(w.color)}${w.color}</b><span>${COLORS[c.main].n}${c.stripe ? ' + ' + COLORS[c.stripe].n.toLowerCase() + ' stripe' : ''}</span></div>
      <div><small>Circuit</small><b>${w.ckt}</b><span>Same number on every segment</span></div></div>`;
    h += `<p class="itext">${w.fn}.</p>`;
  }
  const same = DG.wires.filter(x => x.id !== w.id && x.kind !== 'trace' && NET[x.id] === NET[w.id]);
  h += rowsHtml([
    ['From', NODE_DESC[w.a] || w.a], ['To', NODE_DESC[w.b] || w.b],
    !trace && same.length ? ['Same circuit', same.map(x => `<button type="button" class="btn small" data-sel="${x.id}">${swatch(x.color)}${x.size} ${x.color}</button>`).join(' ')] : null,
  ]);
  if (liveOn()){
    h += '<div class="live">';
    if (L.cut) h += vSpan('Upstream end', L.va) + vSpan('Downstream end', L.vb) + span('Open: 0 A', true);
    else h += vSpan('Voltage', L.va == null || L.vb == null ? null : (L.va + L.vb) / 2) + span('Current ' + fmtA(L.i), Math.abs(L.i) < 0.001);
    h += '</div>';
  } else h += liveHint();
  const ends = [w.a, w.b].map(connOfNode).filter(Boolean);
  const acts = ends.map(e => selLink(e.c + '.' + e.p, `View ${e.c} · pin ${e.p}`)).join('') + actBtn('open:' + w.id, S.open.has(w.id), trace ? 'Open this circuit' : 'Cut this wire', 'Repair the wire');
  if (acts) h += `<div class="acts">${acts}</div>`;
  return h;
}

function cviewSvg(c, selPin, half){
  const cols = c.cols, rows = c.rows, cell = Math.min(34, 300 / cols), W = cols * cell + 40, H = rows * cell + 44;
  const used = new Map(c.pins.map(p => [p.p, p]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.id} ${S.flip ? 'wire side' : 'face'} view">`;
  s += `<rect x="${W / 2 - 20}" y="6" width="40" height="14" rx="3" fill="#26323f" stroke="#3a4a5c"/><text x="${W / 2}" y="16" text-anchor="middle" style="font:700 7.5px var(--f-label);letter-spacing:.14em;fill:#8A98A8">LATCH</text>`;
  s += `<rect x="16" y="20" width="${cols * cell + 8}" height="${rows * cell + 8}" rx="7" fill="#17202a" stroke="#3a4a5c" stroke-width="1.4"/>`;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const n = r * cols + k, lbl = c.labels ? c.labels[n] : String(n + 1), dc = S.flip ? cols - 1 - k : k;
    const x = 20 + dc * cell + cell * 0.12, y = 24 + r * cell + cell * 0.12, sz = cell * 0.76, fs = Math.min(11, cell * 0.42);
    const p = used.get(lbl); let fill = '#0c1117', stroke = '#2b3846', tc = '#4f5c69', extra = '';
    if (p){
      const pw = pinWires(c, p.p), wire = (half === 0 ? pw.a : pw.b);
      if (wire && wire.kind !== 'trace'){
        const cc = parseColor(wire.color); fill = COLORS[cc.main].hex; stroke = '#c9d3dd';
        tc = ['WH','YE','LT GN','PK','LT BU','TN','OG','GY'].includes(cc.main) ? '#111' : '#fff';
        if (cc.stripe) extra = `<rect x="${x}" y="${y + sz * 0.7}" width="${sz}" height="${sz * 0.3}" fill="${COLORS[cc.stripe].hex}" pointer-events="none"/>`;
      } else { fill = '#4a5562'; stroke = '#c9d3dd'; tc = '#fff'; }
    }
    const cur = p && selPin === lbl;
    s += `<g${p ? ` data-pin="${c.id}.${lbl}" style="cursor:pointer"` : ''}><rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="${sz * 0.18}" fill="${fill}" stroke="${cur ? '#2F9BE0' : stroke}" stroke-width="${cur ? 3 : 1}"/>${extra}`;
    s += `<text x="${x + sz / 2}" y="${y + sz / 2 + fs * 0.36}" text-anchor="middle" style="font:700 ${fs}px var(--f-label);fill:${tc}" pointer-events="none">${lbl}</text>`;
    if (cur) s += `<rect x="${x - 4}" y="${y - 4}" width="${sz + 8}" height="${sz + 8}" rx="${sz * 0.25}" fill="none" stroke="#2F9BE0" stroke-width="1.4" stroke-dasharray="3 2"/>`;
    s += '</g>';
  }
  return s + '</svg>';
}
function defaultHalf(c){
  const p = c.pins[0], pw = pinWires(c, p.p);
  return pw.a && pw.a.kind !== 'trace' ? 0 : 1;
}
function inspectConn(c, pinSel){
  S.halfOf ??= {};
  const half = S.halfOf[c.id] ?? defaultHalf(c);
  const unp = S.unplug.has(c.id);
  let h = `<div class="ititle"><b>${c.id}${pinSel ? ' · pin ' + pinSel : ''}</b><span>${c.kind === 'inline' ? 'Inline connector' : 'Component connector'}</span></div>`;
  h += `<p class="itext"><b>${c.name}.</b> ${c.kind === 'inline' ? 'Joins two harnesses.' : 'Plugs a harness into a part.'} The number or letter next to each wire on the diagram is its cavity.</p>`;
  h += rowsHtml([['Location', c.loc], ['Cavities', `${c.rows * c.cols} (${c.rows} × ${c.cols}); this diagram uses ${c.pins.length}`]]);
  const bothWires = c.pins.some(p => { const pw = pinWires(c, p.p); return pw.a && pw.b && pw.a.kind !== 'trace' && pw.b.kind !== 'trace'; });
  h += `<div class="cview"><div class="ch"><b>${S.flip ? 'Wire side' : 'Face view'}</b>
    <div class="seg mini" role="group" aria-label="View"><button type="button" data-flip="0" aria-pressed="${!S.flip}">Face view</button><button type="button" data-flip="1" aria-pressed="${S.flip}">Wire side</button></div>
    ${bothWires ? `<div class="seg mini" role="group" aria-label="Half">${c.sides.map((sd, i) => `<button type="button" data-half="${c.id}:${i}" aria-pressed="${half === i}">${sd}</button>`).join('')}</div>` : `<span>${c.sides[half]}</span>`}</div>`;
  h += cviewSvg(c, pinSel, half);
  h += `<p class="note">${S.flip ? 'Looking at the <b>back</b> of the connector, where the wires go in (the back-probing side). Left and right are <b>swapped</b> compared with the face view.' : 'Looking <b>into the cavities</b> from the mating side. This is the view most service info prints. Flip to Wire side before you back-probe.'}</p></div>`;
  h += `<table class="ptab"><thead><tr><th>Pin</th><th>Wire</th><th>Circuit</th><th>Goes to</th></tr></thead><tbody>`;
  c.pins.forEach(p => {
    const pw = pinWires(c, p.p), list = [pw.a, pw.b].filter(x => x && x.kind !== 'trace');
    const far = list.map(w => { const other = (w.a.startsWith(c.id + '.') ? w.b : w.a); return NODE_DESC[other] || other; });
    h += `<tr data-sel="${c.id}.${p.p}"${pinSel === p.p ? ' class="cur"' : ''}><td><b>${p.p}</b></td><td>${list.map(w => swatch(w.color) + ' ' + w.color).join('<br>')}</td><td>${list[0]?.ckt || '—'}</td><td>${far.join('<br>')}</td></tr>`;
  });
  h += '</tbody></table>';
  if (pinSel && liveOn()){
    const a = nodeV(c.id + '.' + pinSel + 'a'), b = nodeV(c.id + '.' + pinSel + 'b');
    h += `<div class="live">${vSpan(c.sides[0], a)}${vSpan(c.sides[1], b)}${span('Current ' + fmtA(Icur(c.id + '.' + pinSel)), Math.abs(Icur(c.id + '.' + pinSel)) < 0.001)}</div>`;
  } else if (pinSel) h += liveHint();
  const acts = actBtn('unplug:' + c.id, unp, 'Unplug ' + c.id, 'Plug in ' + c.id) + (pinSel ? actBtn('open:' + c.id + '.' + pinSel, S.open.has(c.id + '.' + pinSel), 'Open this terminal', 'Repair terminal') : '');
  if (acts) h += `<div class="acts">${acts}</div>`;
  return h;
}

function inspectComp(c){
  const sym = SYM[c.type];

  let h = `<div class="ititle"><b>${title}</b><span>${sym.n}</span></div>`;

  const rows = [['Location', c.loc]];
  if (c.type === 'fuse') rows.push(['Rating', c.amps + ' A'], ['Fed by', NODE_DESC[c.a]]);
  if (c.type === 'relay') rows.push(['Pins', '<b>86</b> coil feed · <b>85</b> coil ground side<br><b>30</b> power in · <b>87</b> switched output']);
  if (c.type === 'splice'){ const ws = wiresAt(c.node); rows.push(['Joins', ws.map(w => `<button type="button" class="btn small" data-sel="${w.id}">${swatch(w.color)}${w.size} ${w.color}</button>`).join(' ')]); }
  if (c.type === 'ground'){ const ws = wiresAt(c.node); rows.push(['Wires', ws.map(w => `<button type="button" class="btn small" data-sel="${w.id}">${swatch(w.color)}${w.size} ${w.color}</button>`).join(' ')]); }
  h += rowsHtml(rows);
  if (liveOn()){
    let l = '';
    switch (c.type){
      case 'fuse': l = vSpan('In', nodeV(c.a)) + vSpan('Out', nodeV(c.b)) + span('Current ' + fmtA(Icur(c.id)), !Icur(c.id)); break;
      case 'relay': l = span('Coil ' + fmtA(Icur(c.id + '.coil')), Math.abs(Icur(c.id + '.coil')) < 0.001) + span('Contacts ' + (S.relay[c.id] ? 'CLOSED' : 'open'), !S.relay[c.id]) + span('Load ' + fmtA(Icur(c.id + '.sw')), !S.relay[c.id]); break;
      case 'switch': l = span(S.ctl[c.ctl] ? 'Pressed: closed' : 'Released: open', !S.ctl[c.ctl]) + vSpan('Top', nodeV(c.a)) + vSpan('Bottom', nodeV(c.b)); break;
      case 'horn': case 'motor': case 'lamp': case 'clockspring': {
        const va = nodeV(c.a), vb = nodeV(c.b), d = va != null && vb != null ? va - vb : null;
        l = vSpan('Feed', va) + vSpan('Ground side', vb) + span('Across it ' + fmtV(d), d == null || Math.abs(d) < 0.05) + span('Current ' + fmtA(Icur(c.id)), Math.abs(Icur(c.id)) < 0.001); break; }
      case 'sensor': l = span(Math.round(S.temp) + ' °F') + span(Math.round(ectR(S.temp)) + ' Ω') + vSpan('Signal', nodeV(c.a)) + vSpan('Low ref', nodeV(c.b)); break;
      case 'ground': case 'splice': l = vSpan('Voltage', nodeV(c.node)) + (c.type === 'ground' ? span('To chassis ' + fmtA(Icur(c.id)), Math.abs(Icur(c.id)) < 0.001) : ''); break;
      case 'battery': { const v = battV(), i = Icur(c.id); l = span('Battery ' + fmtV(v), v == null) + span(i < -0.5 ? 'Charging ' + fmtA(i) : i > 0.5 ? 'Discharging ' + fmtA(i) : 'Resting', Math.abs(i) < 0.5) + vSpan('+ post', nodeV(c.pos)) + vSpan('− post', nodeV(c.neg)); break; }
      case 'starter': l = span(Math.abs(Icur('ST.mot')) > 50 ? 'Cranking ' + fmtA(Icur('ST.mot')) : 'Not cranking', Math.abs(Icur('ST.mot')) < 50) + vSpan('B terminal', nodeV(c.nB)) + vSpan('S terminal', nodeV(c.nS)); break;
      case 'alternator': { const o = Icur(c.id + '.out'); l = span(o > 1 ? 'Charging ' + fmtA(o) : 'Not charging', o < 1) + vSpan('B+ stud', nodeV(c.nB)) + vSpan('Ignition input', nodeV(c.nI)) + span(S.running ? 'Engine running' : 'Engine off', !S.running); break; }
      case 'ignsw': l = span('Key ' + S.key.toUpperCase()) + vSpan('BATT', nodeV(c.nB)) + vSpan('RUN out', nodeV(c.nR)) + vSpan('START out', nodeV(c.nS)); break;
      case 'hsw': l = span('Switch ' + S.lsw.toUpperCase()) + vSpan('Pin 1 (PARK)', nodeV('C210.1b')) + vSpan('Pin 2 (HEAD)', nodeV('C210.2b')) + span('Switch current ' + fmtA(Icur('HSW.park') + Icur('HSW.head')), true); break;
      case 'module': if (c.kind === 'bcm') {
        const b = RES.bcm; l = span(b.powered ? 'Running' : 'No power', !b.powered);
        if (b.powered) l += span('Park ' + (b.park ? 'ON' : 'off'), !b.park) + span('Low beams ' + (b.head ? 'ON' : 'off'), !b.head);
        ['1', '20', '21', '10', '12', '11'].forEach(pn => l += vSpan('Pin ' + pn, nodeV('C140.' + pn + 'b')));
        break;
      } else {
        const p = RES.pcm; l = span(p.powered ? 'Running' : 'No power', !p.powered);
        if (p.powered) l += span(p.fault ? 'ECT circuit ' + p.fault : 'ECT ' + Math.round(p.ectF) + ' °F') + span('Fan ' + (p.drv ? 'commanded ON' : 'off'), !p.drv);
        ['20', '47', '48', '52', '1'].forEach(pn => l += vSpan('Pin ' + pn, nodeV('C160.' + pn + 'b')));
        break; }
    }
    h += `<div class="live">${l}</div>`;
  } else h += liveHint();
  let acts = '';
  if (c.type === 'fuse') acts = actBtn('open:' + c.id, S.open.has(c.id), 'Blow this fuse', 'Replace fuse');
  if (c.type === 'ground') acts = actBtn('open:' + c.id, S.open.has(c.id), 'Loosen this ground', 'Tighten ground');
  if (['horn', 'motor', 'sensor', 'lamp'].includes(c.type)) acts = actBtn('open:' + c.id, S.open.has(c.id), 'Open it (burned out)', 'Replace it');
  if (acts) h += `<div class="acts">${acts}</div>`;
  return h;
}

const SUBTXT = {
  solenoid:'Fed through the S terminal by the starter relay. Pulls in the main contacts and the drive gear. It draws about 12 A.',
  stcontacts:'Close when the solenoid pulls in, connecting the battery cable to the motor. Burned contacts cause a click with no crank.',
  startmotor:'Turns the engine. About 140 A here while cranking.',
  bpsu:'Battery power comes in on pin 1 (from F30) and the BCM grounds through pin 2. Pin 1 also feeds the lamp drivers.',
  bcmin:'Pins 20 (PARK) and 21 (HEAD) are pulled up to 5 V inside the BCM. The headlamp switch pulls them to ground.',
  hdriver:'Switches battery voltage from pin 1 out to a lamp. The lamp is grounded at G101 or G102.',
  coil:'Control side. Pin 86 is the feed, pin 85 is the ground side. When the coil has power and ground, it pulls the contacts closed.',
  contacts:'Load side. Pin 30 is power in, pin 87 is the output to the load. They carry the big current, so they need the heavy wires.',
  psu:'Ignition power comes in on pin 20. The PCM also needs ground (pins 1 and 2) to run.',
  pullup:'5 V from the PCM\'s regulator goes through a 2.49 kΩ resistor to pin 47. Hot coolant = low sensor resistance = low voltage.',
  driver:'Turns on to ground pin 52, which grounds the fan relay coil. When off, pin 52 floats up to about 12.6 V through the coil.',
  lowref:'Pin 48 grounds the ECT sensor inside the PCM. It should read near 0 V.',
};
function inspectSub(it){
  const t = it.d.type, sym = SYM[t], c = it.d.parent;
  let h = `<div class="ititle"><b>${it.d.name}</b><span>${sym.n}</span></div><p class="itext">${sym.what}</p><p class="itext">${SUBTXT[it.d.txt || t]}</p>`;
  if (liveOn()){
    let l = '';
    if (t === 'coil'){ const a = nodeV(c.n86), b = nodeV(c.n85), d = a != null && b != null ? a - b : null; l = vSpan('86', a) + vSpan('85', b) + span('Across coil ' + fmtV(d), d == null || Math.abs(d) < 0.05) + span(fmtA(Icur(it.id)), Math.abs(Icur(it.id)) < 0.001); }
    if (t === 'contacts') l = span(S.relay[c.id] ? 'CLOSED' : 'open', !S.relay[c.id]) + vSpan('30', nodeV(c.n30)) + vSpan('87', nodeV(c.n87)) + span(fmtA(Icur(it.id)), !S.relay[c.id]);
    if (t === 'solenoid') l = vSpan('S terminal', nodeV(c.nS)) + span('Coil ' + fmtA(Icur(it.id)), Math.abs(Icur(it.id)) < 0.5);
    if (t === 'stcontacts') l = span(S.relay[c.id] ? 'CLOSED' : 'open', !S.relay[c.id]) + vSpan('B side', nodeV(c.nB)) + vSpan('Motor side', nodeV(c.nM)) + span(fmtA(Icur(it.id)), !S.relay[c.id]);
    if (t === 'startmotor') { const a = nodeV(c.nM), b = nodeV(c.nG), d = a != null && b != null ? a - b : null; l = span('Across motor ' + fmtV(d), d == null || Math.abs(d) < 0.05) + span(fmtA(Icur(it.id)), Math.abs(Icur(it.id)) < 1); }
    if (t === 'psu' && it.d.txt === 'bpsu') l = vSpan('Pin 1', nodeV('C140.1b')) + vSpan('Pin 2 (ground)', nodeV('C140.2b')) + span(RES.bcm.powered ? 'Powered' : 'No power', !RES.bcm.powered);
    if (t === 'bcmin') l = vSpan('Pin 20 (PARK)', nodeV('C140.20b')) + vSpan('Pin 21 (HEAD)', nodeV('C140.21b')) + span('Park request ' + (RES.bcm.park ? 'YES' : 'no'), !RES.bcm.park) + span('Head request ' + (RES.bcm.head ? 'YES' : 'no'), !RES.bcm.head);
    if (t === 'hdriver') { const on = it.d.pin === '12' ? RES.bcm.park : RES.bcm.head; l = span(on ? 'ON (supplying power)' : 'OFF', !on) + vSpan('Pin ' + it.d.pin, nodeV('C140.' + it.d.pin + 'b')) + span(fmtA(Icur(it.id)), !on); }
    if (t === 'psu' && !it.d.txt) l = vSpan('Pin 20', nodeV('C160.20b')) + span(RES.pcm.powered ? 'Powered' : 'No power', !RES.pcm.powered);
    if (t === 'pullup') l = vSpan('5 V ref', nodeV('VREF')) + vSpan('Pin 47', nodeV('C160.47b'));
    if (t === 'driver') l = span(RES.pcm.drv ? 'ON (grounding)' : 'OFF', !RES.pcm.drv) + vSpan('Pin 52', nodeV('C160.52b'));
    if (t === 'lowref') l = vSpan('Pin 48', nodeV('C160.48b'));
    h += `<div class="live">${l}</div>`;
  } else h += liveHint();
  if (t === 'coil') h += `<div class="acts">${actBtn('open:' + it.id, S.open.has(it.id), 'Open the coil', 'Replace relay')}</div>`;
  return h;
}

function inspectBus(b){
  let h = `<div class="ititle"><b>${b.label}</b><span>${SYM.bus.n}</span></div><p class="itext">${SYM.bus.what}</p><p class="itext">${b.desc}</p>`;
  h += liveOn() ? `<div class="live">${vSpan('Voltage', nodeV(b.node))}</div>` : liveHint();
  return h;
}

function emptyInspector(){
  return `<div class="empty"><p class="itext">Tap any <b>symbol, wire or connector</b> on the diagram to decode it. Drag to pan when zoomed in; use + / − or the mouse wheel to zoom.</p>
    <h4 style="margin:0;font:700 10px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)">Reading a wire label</h4>
    <div class="anat"><div><b>0.5</b><small>Size in mm² (≈ 20 AWG)</small></div><div><b>YE/BK</b><small>Yellow, black stripe (main / stripe)</small></div><div><b>1235</b><small>Circuit number</small></div></div></div>`;
}

function renderInspector(){
  const el = $('#ibody'), it = S.sel && ITEMS[S.sel];
  if (!it) { el.innerHTML = emptyInspector(); $('#insSub').textContent = 'What you tapped, decoded'; return; }
  let h = '';
  if (it.kind === 'wire' || it.kind === 'trace') h = inspectWire(it.d);
  else if (it.kind === 'conn') h = inspectConn(it.d, null);
  else if (it.kind === 'pin') h = inspectConn(it.d.conn, it.d.pin.p);
  else if (it.kind === 'comp') h = inspectComp(it.d);
  else if (it.kind === 'sub') h = inspectSub(it);
  else if (it.kind === 'bus') h = inspectBus(it.d);
  $('#insSub').textContent = {wire:'Wire', trace:'Internal circuit', conn:'Connector', pin:'Connector', comp:'Component', sub:'Component part', bus:'Power bus'}[it.kind];
  el.innerHTML = h;
}

function tabSymbols(){
  const list = [['bus'], ['fuse'], ['relay'], ['coil'], ['contacts'], ['switch'], ['horn'], ['motor'], ['sensor'], ['clockspring'], ['module'], ['splice'], ['ground'], ['conn'], ['battery'], ['lamp'], ['starter'], ['alternator'], ['ignsw'], ['hdriver'],
    ['cross', {n:'Crossing vs joined', what:'Two wires that cross with no dot are <b>not</b> connected. A dot (or a splice) means they are joined.'}]];
  return `<p>Every symbol on the diagrams, with what it means. Tap the same symbol on the diagram to see it in context.</p><div class="syms">` +
    list.map(([t, o]) => { const d = o || SYM[t]; return `<div class="sym">${symSvg(t)}<div><b>${d.n}</b><span>${d.what}</span></div></div>`; }).join('') + '</div>';
}
function tabRead(){
  const used = ['BK','BN','BU','DK BU','GN','DK GN','LT GN','GY','OG','PK','RD','TN','VT','WH','YE'];
  return `<h3>How to read a wiring diagram</h3>
  <h4>1 · Power on top, ground on bottom</h4>
  <p>Current starts at a <b>power bus</b> at the top, flows down through fuses, switches and loads, and ends at a <b>ground</b> at the bottom. The bus label says when it is hot.</p>
  <h4>2 · A diagram is not a map</h4>
  <p>Parts are placed where the circuit is easiest to follow, not where they sit on the car. Use the <b>location</b> (and the component locator in your service info) to find them.</p>
  <h4>3 · Read the wire label</h4>
  <div class="anat"><div><b>0.5</b><small>Size, mm²</small></div><div><b>YE/BK</b><small>Main color / stripe</small></div><div><b>1235</b><small>Circuit number</small></div></div>
  <p>Colors can change at a connector, but the <b>circuit number</b> stays the same. Trust the circuit number and the pin.</p>
  <h4>4 · Reference designators</h4>
  <ul><li><b>F</b> fuse · <b>K</b> relay · <b>C</b> connector · <b>S</b> splice · <b>G</b> ground</li><li>Many manufacturers number by area of the vehicle (for example 100s in the engine compartment, 200s behind the instrument panel). Check your service info.</li></ul>
  <h4>5 · Switches are drawn at rest</h4>
  <p>Key off, nothing pressed, relay not energized. A normally-open switch is drawn open even if it is closed while you're testing.</p>
  <h4>6 · Face view vs wire side</h4>
  <p>Connector views are usually the <b>face</b> (mating side). From the back, where you back-probe, left and right swap. Count pins on the latch side to stay oriented.</p>
  <h4>7 · Find what's shared</h4>
  <p>When two loads share a fuse, splice or ground, a failure there takes out both. If one load works and the other doesn't, the problem is in the part they <b>don't</b> share.</p>
  <h4>8 · A switch may only be an input</h4>
  <p>On newer cars many switches (headlamps, wipers, horn) just ground a module input. The module powers the load. If the switch wire reads 5 V or 12 V with almost no current, that's normal: it's a signal, not a power feed.</p>
  <h4>Color codes</h4>
  <table class="ctab">${used.map(k => `<tr><td>${k}</td><td>${swatch(k)} ${COLORS[k].n}</td></tr>`).join('')}</table>
  <p style="font-size:12px;color:var(--dim)">Some manufacturers spell colors out (BLK, BRN…) or use single letters (B, R, W…). The idea is the same: main color first, stripe second.</p>`;
}

/* ================= setup helpers ================= */
function applySetup(st){
  if (!st) return;
  if (st.color) S.color = st.color;
  if ('horn' in st) S.ctl.horn = st.horn;
  if (st.key) S.key = st.key;
  if (st.gear) S.gear = st.gear;
  if (st.lsw) S.lsw = st.lsw;
  if (st.temp != null) S.temp = st.temp;
  if (st.open) { S.open = new Set(st.open); S.unplug = new Set(); }
  if ('flip' in st) S.flip = st.flip;
  if (st.half) { S.halfOf ??= {}; S.halfOf[st.half[0]] = st.half[1]; }
  if (st.sel) S.sel = st.sel;
}
function resetBench(){
  S.ctl = {horn:false}; S.key = 'off'; S.temp = 195; S.open = new Set(); S.unplug = new Set();
  S.relay = {}; S.pcm = {powered:false, drv:false}; S.bcm = {powered:false, park:false, head:false};
  S.gear = 'pn'; S.lsw = 'off'; S.running = false; S.cranked = false; S.alt = false; S.chg = false; S.sel = null; S.flip = false; S.halfOf = {};
}
function switchDiagram(id){
  if (id === S.dg && ITEMS && Object.keys(ITEMS).length) return;
  loadDiagram(id); resetBench(); ctrlKey = '';
  $('#pickName').textContent = DG.name; $('#pickSub').textContent = DG.sub;
}

/* ================= lesson engine ================= */
const curStep = () => S.lesson ? S.lesson.steps[S.step] : null;
function startLesson(id){
  S.lesson = LESSONS.find(l => l.id === id); S.step = 0;
  switchDiagram(S.lesson.dg); resetBench();
  enterStep();
}
function enterStep(){
  const st = curStep(); if (!st) return;
  S.spot = st.spot || []; S.picks = []; S.sus = new Set(); S.mcPick = null; S.susRes = null;
  applySetup(st.setup);
  S.stepOk = !st.goal;
  render(); checkGoal(); renderInspector(); renderNotebook();
}
function checkGoal(){
  const st = curStep(); if (!st || !st.goal || S.stepOk) return;
  if (st.goal.check && st.goal.check()) { S.stepOk = true; toast('✓ Nice', 'good'); renderNotebook(); }
}
function lessonTap(id){
  const st = curStep(); if (!st || !st.goal || S.stepOk) return;
  const g = st.goal;
  if (g.tap && id && g.tap.some(t => matches(t, id))) { S.stepOk = true; S.spot = []; flash(id, true); renderNotebook(); }
  if (g.trace && id) traceTap(g.trace, id, () => { S.stepOk = true; renderNotebook(); });
  if (g.sus && id) susTap(id);
}
function traceTap(path, id, done){
  const want = path[S.picks.length]; if (want == null) return;
  const opts = Array.isArray(want) ? want : [want];
  const hit = opts.find(o => matches(o, id));
  if (hit) {
    S.picks.push(hit); flash(hit, true); renderHalos();
    if (S.picks.length === path.length) { toast('✓ Complete path traced', 'good'); done(); }
    else renderNotebook();
  } else if (['trace', 'conn', 'pin'].includes(ITEMS[id]?.kind)) {
    return;
  } else if (!S.picks.some(p => matches(p, id))) {
    flash(id, false); S.traceMiss = (S.traceMiss || 0) + 1;
    toast(S.picks.length ? 'Not next. Where does current go after ' + labelOf(S.picks[S.picks.length - 1]) + '?' : 'Start where power enters the circuit: the fuse.', 'bad');
    if (S.prac) S.prac.miss = true;
  }
}
function susNorm(id){ const it = ITEMS[id]; return it && it.kind === 'pin' ? it.parent : id; }
function susTap(id){
  const n = susNorm(id);
  if (S.sus.has(n)) S.sus.delete(n); else S.sus.add(n);
  S.susRes = null; renderHalos(); renderNotebook();
}
function susCheck(g){
  const sel = [...S.sus];
  const missing = g.req.filter(r => !sel.some(s => matches(r, s)));
  const extra = sel.filter(s => ![...g.req, ...g.ok].some(x => matches(x, s) || matches(s, x)));
  return {missing, extra, ok: !missing.length && !extra.length};
}
function labelOf(id){
  const it = ITEMS[id]; if (!it) return id;
  if (it.kind === 'wire') return `the ${it.d.size} ${it.d.color} wire`;
  if (it.kind === 'trace') return 'the internal circuit';
  if (it.kind === 'sub') return it.d.name;
  if (it.kind === 'pin') return it.parent + ' pin ' + it.d.pin.p;
  if (it.kind === 'bus') return 'the ' + it.d.label + ' bus';
  if (it.kind === 'conn') return 'connector ' + id;
  const c = it.d; return c.type === 'ground' || c.type === 'splice' ? c.id : c.ref ? c.ref : c.name.toLowerCase();
}

/* ================= practice engine ================= */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startPractice(){
  const bank = PRACTICE[S.dg];
  S.prac = {dg:S.dg, bag:shuffle(bank.map((_, i) => i)), cur:null, right:0, total:0, streak:0, best:0, answered:false, miss:false, tries:0};
  nextQuestion();
}
const curQ = () => S.prac && S.prac.cur != null ? PRACTICE[S.prac.dg][S.prac.cur] : null;
function nextQuestion(){
  const p = S.prac;
  if (!p.bag.length) { p.cur = null; p.finished = true; S.spot = []; S.sus = new Set(); S.picks = []; render(); renderNotebook(); return; }
  p.cur = p.bag.shift(); p.answered = false; p.miss = false; p.tries = 0; p.pick = null;
  S.spot = []; S.sus = new Set(); S.picks = []; S.susRes = null; S.sel = null;
  resetBench();
  const q = curQ();
  if (S.color === 'volt' && q.noVolt) S.color = 'wires';
  applySetup(q.setup);
  render(); renderInspector(); renderNotebook();
}
function scoreQ(first){
  const p = S.prac; p.answered = true; p.total++;
  if (first) { p.right++; p.streak++; p.best = Math.max(p.best, p.streak); } else p.streak = 0;
}
function pracTap(id){
  const p = S.prac, q = curQ(); if (!q || p.answered || !id) return;
  if (q.k === 'find'){
    if (q.ans.some(a => matches(a, id))) { flash(id, true); scoreQ(p.tries === 0); renderNotebook(); }
    else { flash(id, false); p.tries++; toast('Not that one. You tapped ' + labelOf(id) + '.', 'bad'); renderNotebook(); }
  }
  if (q.k === 'trace') traceTap(q.path, id, () => { scoreQ(!p.miss); renderNotebook(); });
  if (q.k === 'sus') susTap(id);
}

const ICON_OK = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function mcHtml(m, pick, solved, who){
  let h = `<p class="qq">${m.q}</p><div class="mc">`;

    const cls = solved && i === m.a ? 'right' : pick != null && pick.includes?.(i) && i !== m.a ? 'wrong' : '';
    h += `<button type="button" data-mc="${who}:${i}" class="${cls}"${solved ? ' disabled' : ''}>${o}</button>`;
  });
